name: Google Play bundle

# Builds the Android App Bundle (AAB) for Google Play from the chosen ref and signs it with the Play upload key
# (PLAY_UPLOAD_KEYSTORE_* in the google-play environment, which needs the maintainer's approval). Google re-signs
# it with the app signing key it holds (Play App Signing). The AAB is kept as a workflow artifact and, unless the track
# is "none", uploaded to that Play testing track as a draft release that is NOT sent for review: the maintainer sends
# it for review in Play Console (Publishing overview). The service account (PLAY_SERVICE_ACCOUNT_JSON) only has rights
# on testing tracks (docs/manual-intervention.md, Google Play). The AAB's versionName is the release tag the workflow
# runs on (or the version-name input off a tag), checked against the source version (.github/scripts/version.py).

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play testing track to upload a draft release to (alpha = Closed testing - Alpha)
        type: choice
        default: alpha
        options:
          - alpha
          - internal
          - none
      notes:
        description: Release notes (en-US) shown to testers
        type: string
        default: ""
      version-name:
        description: versionName when not run on a release tag, e.g. 1.0.0-rc.1 (on a tag the tag is used)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: play-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Build and sign the Play bundle
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: google-play
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The upload key is configured
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::PLAY_UPLOAD_${name} is not set in the google-play environment"
              missing=1
            fi
          done
          exit "${missing}"

      # The AAB's versionName comes from the release tag, like release.yml's APK, never from the default in
      # build.gradle.kts; the source version (.github/scripts/version.py) must match it.
      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION_NAME: ${{ inputs.version-name }}
        run: |
          set -euo pipefail
          # Same pattern as release.yml's release policy.
          version_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[1-9][0-9]*)?$'
          if [ "${REF_TYPE}" = "tag" ]; then
            tag="${REF_NAME}"
            if [ -n "${INPUT_VERSION_NAME}" ] && [ "v${INPUT_VERSION_NAME}" != "${tag}" ]; then
              echo "::error::version-name ${INPUT_VERSION_NAME} differs from the tag ${tag}; leave it empty on a tag."
              exit 1
            fi
          elif [ -n "${INPUT_VERSION_NAME}" ]; then
            tag="v${INPUT_VERSION_NAME}"
          else
            echo "::error::Run this on a release tag, or give version-name (for example 1.0.0-rc.1)."
            exit 1
          fi
          if [[ ! "${tag}" =~ ${version_pattern} ]]; then
            echo "::error::${tag} is not a release version (v1.0.0, v1.0.0-beta.1, v1.0.0-rc.1)."
            exit 1
          fi
          python3 -I .github/scripts/version.py check --tag "${tag}"
          echo "name=${tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Build the APK and the signed AAB
        id: build
        uses: ./.github/actions/android-apk
        with:
          bundle: "true"
          version-name: ${{ steps.version.outputs.name }}
          upload-keystore-base64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          upload-keystore-password: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          upload-key-alias: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          upload-key-password: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}

      - name: Stage the AAB
        id: stage
        env:
          AAB: ${{ steps.build.outputs.aab }}
          AAB_KIND: ${{ steps.build.outputs.aab-kind }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          if [ "${AAB_KIND}" != play-signed ] || [ ! -f "${AAB}" ]; then
            echo "::error::The AAB was not signed with the upload key (kind '${AAB_KIND}', path '${AAB}')"
            exit 1
          fi
          gradle_file=apps/android-native/app/build.gradle.kts
          code="$(sed -n 's/^ *versionCode = \([0-9]*\).*/\1/p' "${gradle_file}")"
          # The versionName the build was given (the Version step), not build.gradle.kts's default.
          version="${VERSION_NAME}"
          if [ -z "${code}" ] || [ -z "${version}" ]; then
            echo "::error::Could not read versionCode ('${code}') or versionName ('${version}') from ${gradle_file}"
            exit 1
          fi
          name="anixops-net-${version}-${code}-play.aab"
          mkdir -p dist/play
          cp "${AAB}" "dist/play/${name}"
          (cd dist/play && sha256sum -- "${name}" > "${name}.sha256")
          echo "artifact_name=anixops-net-play-${code}-${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"
          echo "file=dist/play/${name}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${code} (${version})" >> "${GITHUB_OUTPUT}"
          {
            echo "### Google Play bundle"
            echo
            echo "- File: \`${name}\` (versionName ${version}, versionCode ${code})"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Signed with the upload key."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: dist/play/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload a draft release to Google Play
        if: ${{ inputs.track != 'none' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.track }}
          NOTES: ${{ inputs.notes }}
          AAB_FILE: ${{ steps.stage.outputs.file }}
          RELEASE_NAME: ${{ steps.stage.outputs.release_name }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check "google-auth==2.38.0" "requests==2.32.3"
          printf '%s' "${NOTES}" > "${RUNNER_TEMP}/play-notes.txt"
          python3 .github/scripts/play-upload.py io.anixops.net.android "${TRACK}" "${AAB_FILE}" "${RELEASE_NAME}" \
            "${RUNNER_TEMP}/play-notes.txt"
          {
            echo "- Uploaded to the \`${TRACK}\` track as a draft release, not sent for review."
            echo "  Send it for review in Play Console → Publishing overview."
          } >> "${GITHUB_STEP_SUMMARY}"
