name: UI screenshots

# Draws the desktop interface page by page with demo data. On a pull request it draws the base commit the same
# way, compares the two shot by shot and fails when a shot changed that the pull request description does not
# acknowledge on a "界面变化：" line (docs/ui-ux.md). Editing the description runs it again.
on:
  push:
    branches:
      - main
    paths:
      - apps/windows-gui/ui/**
      - TERMS.md
      - .github/workflows/ui-screenshots.yml
      - .github/scripts/screenshot-diff/**
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - apps/windows-gui/ui/**
      - TERMS.md
      - .github/workflows/ui-screenshots.yml
      - .github/scripts/screenshot-diff/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-screenshots-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    name: Desktop interface screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UI: apps/windows-gui/ui
    steps:
      # The runner's temporary directory is not known where a job's `env` is read, so these are set here.
      - name: Choose the working directories
        shell: bash
        run: |
          echo "TOOLS=${RUNNER_TEMP}/screenshot-tools" >> "${GITHUB_ENV}"
          echo "SHOTS=${RUNNER_TEMP}/ui-screenshots" >> "${GITHUB_ENV}"

      # On a pull request this is the merge of the branch into its base, so the comparison below shows exactly
      # what merging would change; the base is the merge's first parent.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/windows-gui/ui/pnpm-lock.yaml

      # The interface is Chinese first; without these the text would be drawn in a fallback bitmap face.
      - name: Install fonts
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      # Pinned, and kept out of the app's own dependencies: these only draw and compare pictures.
      - name: Install the browser and the comparison tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${TOOLS}"
          npm install --prefix "${TOOLS}" --no-audit --no-fund playwright@1.63.0 pixelmatch@5.3.0 pngjs@7.0.0 axe-core@4.10.3
          "${TOOLS}/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=${TOOLS}/node_modules" >> "${GITHUB_ENV}"

      - name: Test the comparison tools
        shell: bash
        run: node --test .github/scripts/screenshot-diff/ack.test.cjs

      - name: Build the interface
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir "${UI}" install --frozen-lockfile
          pnpm --dir "${UI}" run build

      # The base is drawn with this branch's shot list and demo data, so both sides are taken the same way and a
      # new shot shows up as "added". A shot the base cannot draw (a page it does not have) is simply missing.
      # It builds and draws in the background while this branch's shots are drawn and checked, so the two do not
      # add up in the job's time.
      - name: Start building and drawing the base commit
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          base="${RUNNER_TEMP}/base"
          git worktree add --detach "${base}" HEAD^1
          nohup bash -c '
            set -e
            pnpm --dir "$1/$2" install --frozen-lockfile
            pnpm --dir "$1/$2" run build
            node "$2/screenshots/render.cjs" "$1/$2/dist" "$3/before" || echo "::notice::some shots could not be drawn on the base commit; they count as added"
          ' base "${base}" "${UI}" "${SHOTS}" > "${RUNNER_TEMP}/base.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/base.pid"

      # A page that throws while it is drawn fails here: that is a bug in the pull request, not a difference. So does
      # any finding of the interface checks (screenshots/audit.cjs; docs/ui-ux.md, 自动检查): contrast and the rest
      # of axe, text cut off, an overlay that melts into the window under it. Every shot is drawn and checked
      # before the step fails, and audit.json lists each finding with the measurements.
      - name: Draw and check the screenshots
        shell: bash
        env:
          UI_AUDIT: ${{ runner.temp }}/ui-screenshots/after/audit.json
        run: node "${UI}/screenshots/render.cjs" "${UI}/dist" "${SHOTS}/after"

      # Also after a failed check: the comparison still tells what changed.
      - name: Wait for the base commit
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          pid="$(cat "${RUNNER_TEMP}/base.pid")"
          while kill -0 "${pid}" 2> /dev/null; do sleep 2; done
          cat "${RUNNER_TEMP}/base.log"

      - name: Compare with the base commit
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/screenshot-diff/diff.cjs --before "${SHOTS}/before" --after "${SHOTS}/after" --report "${SHOTS}/report" --label "桌面端（Windows / Linux）"

      - name: Upload the screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-screenshots-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ui-screenshots/after
            ${{ runner.temp }}/ui-screenshots/report
          if-no-files-found: warn
          retention-days: 3
