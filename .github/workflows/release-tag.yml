name: Release tag

# Creates a client release tag v* from a workflow and starts release.yml on it, because agent sessions cannot push
# tags. A tag pushed with GITHUB_TOKEN does not trigger the tag push event, so release.yml is started with
# workflow_dispatch on the new tag; release.yml then runs the same policy, CI gate and publish as for a pushed tag.
# Everything release.yml checks before building is checked here first, so a tag is never created that the release
# would reject (moving a published tag later is not allowed).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.0.0-rc.1 (the source version must already be 1.0.0)
        required: true
        type: string
      commit:
        description: Commit on main to tag (empty for the latest main)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and dispatch release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Check version, commit, notes and CI
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          REPO: ${{ github.repository }}
          RUN_REF_NAME: ${{ github.ref_name }}
          ANDROID_RELEASE_CERT: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ "${RUN_REF_NAME}" != "main" ]; then
            echo "::error::Run this workflow from main."
            exit 1
          fi
          # Same pattern as release.yml's release policy.
          version_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[1-9][0-9]*)?$'
          if [[ ! "${VERSION}" =~ ${version_pattern} ]]; then
            echo "::error::Version must look like v0.3.0, v0.3.0-beta.8, v0.3.0-rc.1."
            exit 1
          fi

          if [ -n "${COMMIT}" ]; then
            if ! target="$(git rev-parse --verify --quiet "${COMMIT}^{commit}")"; then
              echo "::error::${COMMIT} is not a commit in this repository."
              exit 1
            fi
          else
            target="$(git rev-parse origin/main)"
          fi
          if ! git merge-base --is-ancestor "${target}" origin/main; then
            echo "::error::${target} is not on main."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} already exists."
            exit 1
          fi

          # The tagged commit's own files (not main's working tree): its source version and every copy must be the
          # tag's version, as release.yml checks on the tag.
          python3 -I .github/scripts/version.py check --tag "${VERSION}" --rev "${target}"

          # The pinned Android release certificate (release.yml, Android release certificate is pinned).
          normalized_cert="$(printf '%s' "${ANDROID_RELEASE_CERT}" | tr -d ': ' | tr 'A-F' 'a-f')"
          if [[ ! "${normalized_cert}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Repository variable ANDROID_RELEASE_CERT_SHA256 must hold the SHA-256 of the Android app signing certificate."
            exit 1
          fi

          notes="docs/release-notes/${VERSION}.md"
          if ! git cat-file -e "${target}:${notes}" 2>/dev/null || [ -z "$(git show "${target}:${notes}")" ]; then
            echo "::error::${notes} is missing or empty at ${target}."
            exit 1
          fi
          if git show "${target}:${notes}" | grep -n -E 'TODO|TBD|待补'; then
            echo "::error::${notes} still has placeholders."
            exit 1
          fi

          # Same-commit CI on main must have finished successfully, as release.yml's CI gate requires.
          runs_json="$(gh api --method GET "repos/${REPO}/actions/workflows/ci.yml/runs" \
            -f branch=main -f status=completed -f head_sha="${target}" -f per_page=20)"
          ci_run="$(jq -c --arg sha "${target}" '
            [ .workflow_runs[]
              | select(.head_branch == "main" and .head_sha == $sha)
              | select(.event == "push" or .event == "workflow_dispatch")
              | select(.conclusion == "success") ]
            | sort_by(.created_at, .run_attempt) | last // empty' <<< "${runs_json}")"
          if [ -z "${ci_run}" ]; then
            echo "::error::No successful CI run on main for ${target}. Wait for CI to pass, then run this again."
            exit 1
          fi
          ci_url="$(jq -r '.html_url' <<< "${ci_run}")"
          ci_id="$(jq -r '.id' <<< "${ci_run}")"
          # Like release.yml's CI gate: a documentation-only push skips the build jobs, so every job of the
          # selected run must have run and passed.
          jobs_json="$(gh api --method GET "repos/${REPO}/actions/runs/${ci_id}/jobs" -f filter=latest -f per_page=100)"
          if [ "$(jq -r '.total_count // 0' <<< "${jobs_json}")" -gt "$(jq -r '.jobs | length' <<< "${jobs_json}")" ]; then
            echo "::error::CI workflow jobs query returned paginated results."
            exit 1
          fi
          if ! jq -e '[.jobs[] | select(.name == "CI summary" and .conclusion == "success")] | length > 0' <<< "${jobs_json}" >/dev/null; then
            echo "::error::CI run ${ci_url} has no successful CI summary job."
            exit 1
          fi
          not_run="$(jq -r '[.jobs[] | select(.conclusion != "success") | "\(.name)=\(.conclusion)"] | join(", ")' <<< "${jobs_json}")"
          if [ -n "${not_run}" ]; then
            echo "::error::CI run ${ci_url} did not run and pass every job (${not_run}). Run the CI workflow manually on main for ${target}, then run this again."
            exit 1
          fi

          echo "target=${target}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Release tag"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Version | ${VERSION} |"
            echo "| Commit | ${target} |"
            echo "| CI | ${ci_url} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Create tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ steps.check.outputs.target }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "AnixOps Net ${VERSION}" "${TARGET}"
          git push origin "refs/tags/${VERSION}"

      - name: Start release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${REPO}/actions/workflows/release.yml/dispatches" \
            -f ref="${VERSION}" -f "inputs[version]=${VERSION}"
          echo "Started release.yml on ${VERSION}: https://github.com/${REPO}/actions/workflows/release.yml" >> "${GITHUB_STEP_SUMMARY}"
