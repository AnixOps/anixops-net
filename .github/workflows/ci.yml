name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request runs are cancelled. Runs on main and manual dispatch
# always finish so every merged commit has a complete result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Kernel tests (protocols, engine, MITM, scripts, interop, fuzz) run in AnixOps/networkcore_anixops.
# This workflow only builds and tests the clients against the kernel commit pinned in Cargo.toml.
jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      ui: ${{ steps.changes.outputs.ui }}
      windows: ${{ steps.changes.outputs.windows }}
      linux: ${{ steps.changes.outputs.linux }}
      apple: ${{ steps.changes.outputs.apple }}
      android: ${{ steps.changes.outputs.android }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # AnixOps Design is vendored unmodified into apps/windows-gui/ui/src/design/anixops/ (with the app icons
      # copied from it); apps/ios/Design/tokens.json maps it onto the client's names, and the Swift and CSS
      # files are generated from both.
      - name: AnixOps Design vendored copy matches its manifest
        run: python3 .github/scripts/sync_design.py --check

      - name: Design tokens are up to date
        run: python3 .github/scripts/design_tokens.py --check

      # Pull requests run only the platforms their paths touch. Pushes to main, manual runs and any change to
      # the workspace, lockfile, workflows or scripts run everything.
      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rust=false; ui=false; windows=false; linux=false; apple=false; android=false
          all() { rust=true; ui=true; windows=true; linux=true; apple=true; android=true; }
          if [[ "${EVENT_NAME}" != pull_request ]]; then
            all
          else
            while IFS= read -r path; do
              case "${path}" in
                Cargo.toml | Cargo.lock | .github/*) all ;;
                apps/windows-gui/ui/*) ui=true; windows=true; linux=true; android=true ;;
                apps/windows-gui/* | apps/windows-service/* | installer/*) rust=true; windows=true ;;
                # The Android app is the Linux window and backend on Android.
                apps/linux-gui/*) rust=true; linux=true; android=true ;;
                apps/android/*) android=true ;;
                crates/*) rust=true; windows=true; linux=true; android=true ;;
                apps/ios/*) apple=true ;;
                # The desktop UI bundles TERMS.md and the Apple tests check its version (first-start consent).
                TERMS.md) ui=true; windows=true; linux=true; apple=true; android=true ;;
                *) ;;
              esac
            done < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          fi
          {
            echo "rust=${rust}"
            echo "ui=${ui}"
            echo "windows=${windows}"
            echo "linux=${linux}"
            echo "apple=${apple}"
            echo "android=${android}"
          } | tee -a "$GITHUB_OUTPUT"

  ui:
    name: Shared UI lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' || needs.changes.outputs.windows == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/windows-gui/ui/pnpm-lock.yaml

      - name: Install dependencies
        shell: bash
        run: pnpm --dir apps/windows-gui/ui install --frozen-lockfile

      - name: Audit production dependencies
        # 打进安装包的前端依赖有 high 及以上公告就失败；开发依赖不进安装包。
        shell: bash
        run: pnpm --dir apps/windows-gui/ui audit --prod --audit-level high

      - name: Lint
        shell: bash
        run: pnpm --dir apps/windows-gui/ui run lint

      - name: Test
        shell: bash
        run: pnpm --dir apps/windows-gui/ui test

      - name: Build
        shell: bash
        run: pnpm --dir apps/windows-gui/ui run build

      - name: Upload the built interface
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui-ui-${{ github.sha }}
          path: apps/windows-gui/ui/dist
          if-no-files-found: error
          retention-days: 1

  rust-deps:
    name: Rust dependency advisories and licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        shell: bash
        run: cargo deny --locked check advisories licenses sources

  rust-linux:
    name: Rust build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Format
        shell: bash
        run: cargo fmt --all -- --check

      - name: Lint
        shell: bash
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        shell: bash
        run: cargo test --locked --workspace --all-targets

  linux-gui:
    name: Linux GUI build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
    needs: changes
    if: ${{ needs.changes.outputs.linux == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Tauri on Linux renders through WebKitGTK.
      - name: Install WebKitGTK
        shell: bash
        run: |
          bash .github/scripts/apt-install.sh libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/windows-gui/ui/pnpm-lock.yaml

      # The Linux window shares the Windows React interface.
      - name: Build the shared interface
        shell: bash
        run: |
          pnpm --dir apps/windows-gui/ui install --frozen-lockfile
          pnpm --dir apps/windows-gui/ui run build

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-gui
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Lint, test and build the Linux GUI
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p networkcore-linux-gui --features gui --all-targets -- -D warnings
          cargo test --locked -p networkcore-linux-gui
          cargo build --locked -p networkcore-linux-gui --features gui --release
          test -x target/release/anixops-net

      # F4 cold start (median of 7 launches to the window's first page load, budget 1.5 s), the loopback
      # Prometheus endpoint and the install integrity check, on the release binary under Xvfb.
      - name: Cold start and client health
        shell: bash
        env:
          # Xvfb has no GPU: WebKitGTK renders in software.
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          bash .github/scripts/apt-install.sh xvfb xauth dbus
          chmod +x .github/scripts/linux-client-health.sh
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            dbus-run-session -- .github/scripts/linux-client-health.sh target/release/anixops-net

  windows:
    name: Windows build, test and MSI
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    needs:
      - changes
      - ui
    if: >-
      ${{
        always() &&
        needs.changes.result == 'success' &&
        needs.changes.outputs.windows == 'true' &&
        needs.ui.result == 'success'
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the built interface
        uses: actions/download-artifact@v4
        with:
          name: windows-gui-ui-${{ github.sha }}
          path: apps/windows-gui/ui/dist

      - name: Verify the built interface
        shell: bash
        run: test -s apps/windows-gui/ui/dist/index.html

      - name: Setup Windows C toolchain
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libsystre

      - name: Configure Windows Rust GNU target
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $MsysRoot = "${{ steps.msys2.outputs.msys2-location }}"
          $MingwPrefix = Join-Path $MsysRoot "mingw64"
          "${{ github.workspace }}\.github\scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$MingwPrefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "MSYS2_LOCATION=$MsysRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MINGW_PREFIX=$MingwPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RC_x86_64_pc_windows_gnu=${{ github.workspace }}\.github\scripts\rc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_BUILD_TARGET=x86_64-pc-windows-gnu" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_x86_64_pc_windows_gnu=$MingwPrefix\bin\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AR_x86_64_pc_windows_gnu=$MingwPrefix\bin\ar.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$MingwPrefix\bin\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Pinned: Rust 1.100 lays build script outputs out as build/<crate>/<hash>/out, and tauri-build 2.6
          # walks up from OUT_DIR to find the target directory, so the GUI build script fails with
          # "The system cannot find the path specified". Move back to stable once tauri-build handles it.
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustup component add clippy
          rustup target add x86_64-pc-windows-gnu

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-gnu
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # A restored cache can hold webview2-com-sys outputs from an older Cargo.lock.
      # Drop them so the WebView2Loader.dll uniqueness check below sees only this build.
      - name: Clear stale WebView2 build outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = "target\x86_64-pc-windows-gnu\debug"
          foreach ($subDir in @("build", ".fingerprint")) {
            $outputDir = Join-Path $releaseDir $subDir
            if (Test-Path $outputDir) {
              Get-ChildItem -Path $outputDir -Directory -Filter "webview2-com-sys-*" |
                Remove-Item -Recurse -Force
            }
          }

      - name: Restore windres compatibility shim
        id: windres-shim-cache
        uses: actions/cache@v4
        with:
          path: |
            .github/scripts/windres.exe
            .github/scripts/rc.exe
          key: windres-shim-${{ runner.os }}-${{ hashFiles('.github/scripts/windres_compat.rs', '.github/scripts/rc_compat.rs') }}

      - name: Build windres compatibility shim
        if: steps.windres-shim-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustc .github/scripts/windres_compat.rs -o .github/scripts/windres.exe
          rustc .github/scripts/rc_compat.rs -o .github/scripts/rc.exe

      - name: Lint
        shell: bash
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        shell: bash
        run: cargo test --locked --workspace --all-targets

      - name: Build the GUI and service
        shell: bash
        run: cargo build --locked -p networkcore-windows-gui -p networkcore-windows-service

      # The MSI also ships the kernel's Windows CLI, built from the pinned kernel checkout with its own lockfile.
      - name: Build the kernel Windows CLI
        shell: bash
        run: |
          set -euo pipefail
          kernel="$(bash .github/scripts/kernel-root.sh)"
          echo "Kernel checkout: ${kernel}"
          cargo build --locked --manifest-path "${kernel}/Cargo.toml" --target-dir target -p networkcore-windows
          test -s target/x86_64-pc-windows-gnu/debug/networkcore-windows.exe

      - name: Build and validate WiX MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet tool install --global wix --version 4.0.6
          wix extension add -g WixToolset.UI.wixext/4.0.6
          New-Item -ItemType Directory -Force -Path dist\windows-ci | Out-Null
          $releaseDir = (Resolve-Path "target\x86_64-pc-windows-gnu\debug").Path
          $webView2LoaderCandidates = @(
            Get-ChildItem -Path (Join-Path $releaseDir "build") -Recurse -Filter "WebView2Loader.dll" |
              Where-Object {
                $_.Directory.Name -eq "x64" -and
                $_.Directory.Parent.Name -eq "out" -and
                $_.Directory.Parent.Parent.Name -like "webview2-com-sys-*"
              }
          )
          if ($webView2LoaderCandidates.Count -ne 1) {
            $candidatePaths = $webView2LoaderCandidates.FullName -join ", "
            throw "Expected exactly one x64 WebView2Loader.dll generated by webview2-com-sys; found $($webView2LoaderCandidates.Count): $candidatePaths"
          }
          $webView2LoaderPath = $webView2LoaderCandidates[0].FullName
          if ((Get-Item $webView2LoaderPath).Length -le 0) {
            throw "WebView2Loader.dll is empty: $webView2LoaderPath"
          }
          $defaultConfig = (Resolve-Path "installer\windows\default-managed-config.json").Path
          $wintunPath = & .github/scripts/fetch-wintun.ps1 -Destination (Join-Path $env:RUNNER_TEMP "wintun")
          $integrityPath = Join-Path $env:RUNNER_TEMP "integrity\integrity.sha256"
          & .github/scripts/write-integrity.ps1 -Output $integrityPath -Entry @(
            "networkcore-windows-gui.exe=$releaseDir\networkcore-windows-gui.exe",
            "networkcore-windows-service.exe=$releaseDir\networkcore-windows-service.exe",
            "networkcore-windows.exe=$releaseDir\networkcore-windows.exe",
            "WebView2Loader.dll=$webView2LoaderPath",
            "wintun.dll=$wintunPath"
          )
          wix build installer/windows/Package.wxs `
            -ext WixToolset.UI.wixext `
            -arch x64 `
            -d "ProductVersion=0.2.1" `
            -d "CliExe=$releaseDir\networkcore-windows.exe" `
            -d "GuiExe=$releaseDir\networkcore-windows-gui.exe" `
            -d "WebView2LoaderDll=$webView2LoaderPath" `
            -d "WintunDll=$wintunPath" `
            -d "ServiceExe=$releaseDir\networkcore-windows-service.exe" `
            -d "DefaultConfig=$defaultConfig" `
            -d "IntegrityList=$integrityPath" `
            -o dist\windows-ci\networkcore-windows-ci.msi
          wix msi validate dist\windows-ci\networkcore-windows-ci.msi
          if ((Get-Item dist\windows-ci\networkcore-windows-ci.msi).Length -le 0) {
            throw "Windows managed client MSI is empty."
          }

      - name: Install and uninstall Windows managed client MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msiPath = (Resolve-Path "dist\windows-ci\networkcore-windows-ci.msi").Path
          $installLog = Join-Path $env:RUNNER_TEMP "networkcore-msi-install.log"
          $uninstallLog = Join-Path $env:RUNNER_TEMP "networkcore-msi-uninstall.log"

          function Invoke-MsiTransaction {
            param(
              [string[]]$Arguments,
              [string]$LogPath,
              [string]$Operation
            )

            $process = Start-Process -FilePath "msiexec.exe" -ArgumentList $Arguments -PassThru
            if (-not $process.WaitForExit(120000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              if (Test-Path $LogPath) {
                Get-Content $LogPath -Tail 200
              }
              throw "Windows managed client MSI $Operation exceeded 120 seconds."
            }
            if ($process.ExitCode -notin @(0, 3010)) {
              if (Test-Path $LogPath) {
                Get-Content $LogPath -Tail 200
              }
              throw "Windows managed client MSI $Operation failed with exit code $($process.ExitCode)."
            }
          }

          Invoke-MsiTransaction `
            -Arguments @("/i", "`"$msiPath`"", "/qn", "/norestart", "/l*v", "`"$installLog`"") `
            -LogPath $installLog `
            -Operation "install"

          $service = Get-Service -Name "AnixOpsNetworkCore" -ErrorAction SilentlyContinue
          if ($null -eq $service) {
            throw "Windows managed client MSI did not register AnixOpsNetworkCore."
          }

          $serviceExe = Join-Path $env:ProgramFiles "AnixOps\NetworkCore\networkcore-windows-service.exe"
          $guiExe = Join-Path $env:ProgramFiles "AnixOps\NetworkCore\networkcore-windows-gui.exe"
          $webView2Loader = Join-Path $env:ProgramFiles "AnixOps\NetworkCore\WebView2Loader.dll"
          $managedConfigPath = Join-Path $env:ProgramData "AnixOps\NetworkCore\managed-config.json"
          if (-not (Test-Path $serviceExe -PathType Leaf)) {
            throw "Windows managed client MSI did not install the service executable."
          }
          if (-not (Test-Path $managedConfigPath -PathType Leaf)) {
            throw "Windows managed client MSI did not install managed-config.json."
          }
          if (-not (Test-Path $guiExe -PathType Leaf)) {
            throw "Windows managed client MSI did not install the GUI executable."
          }
          if (-not (Test-Path $webView2Loader -PathType Leaf)) {
            throw "Windows managed client MSI did not install WebView2Loader.dll beside the GUI executable."
          }
          if (-not (Test-Path (Join-Path $env:ProgramFiles "AnixOps\NetworkCore\wintun.dll") -PathType Leaf)) {
            throw "Windows managed client MSI did not install wintun.dll beside the GUI executable."
          }
          # The integrity list the client checks at start must match the installed files.
          $installDir = Join-Path $env:ProgramFiles "AnixOps\NetworkCore"
          $integrityList = Join-Path $installDir "integrity.sha256"
          if (-not (Test-Path $integrityList -PathType Leaf)) {
            throw "Windows managed client MSI did not install integrity.sha256."
          }
          foreach ($line in Get-Content $integrityList) {
            if (-not $line.Trim()) { continue }
            $expected, $name = $line -split "  ", 2
            $actual = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $installDir $name)).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "Installed $name does not match integrity.sha256."
            }
          }

          # GitHub-hosted Windows runners have no dependable interactive desktop session for
          # WebView2 navigation. Verify the installed binary through its non-windowed entrypoint;
          # the real page-load assertion remains an explicit Windows beta acceptance step.
          $guiProcess = Start-Process -FilePath $guiExe -ArgumentList "--cleanup-startup" -PassThru
          if (-not $guiProcess.WaitForExit(15000)) {
            Stop-Process -Id $guiProcess.Id -Force -ErrorAction SilentlyContinue
            throw "Windows GUI cleanup entrypoint did not exit within 15 seconds."
          }
          if ($guiProcess.ExitCode -ne 0) {
            throw "Windows GUI cleanup entrypoint exited with code $($guiProcess.ExitCode)."
          }

          # Sign-in startup is a per-user elevated logon task (the GUI manifest requires
          # administrator rights, which the Run key silently skips). Seed one the way the
          # GUI registers it; the uninstaller, running as LocalSystem, must remove it.
          $startupSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $startupTaskName = "AnixOps Net $startupSid"
          $startupAction = New-ScheduledTaskAction -Execute $guiExe -Argument "--start-after-login"
          $startupTrigger = New-ScheduledTaskTrigger -AtLogOn
          Register-ScheduledTask -TaskPath "\AnixOps\" -TaskName $startupTaskName -Action $startupAction -Trigger $startupTrigger -Force | Out-Null

          $service = Get-Service -Name "AnixOpsNetworkCore" -ErrorAction Stop
          if ($service.Status -ne "Stopped") {
            Stop-Service -Name "AnixOpsNetworkCore" -ErrorAction Stop
            $service.WaitForStatus("Stopped", [TimeSpan]::FromSeconds(30))
          }

          $originalManagedConfig = Get-Content -Path $managedConfigPath -Raw
          try {
            Set-Content -Path $managedConfigPath -Value "{ invalid managed configuration" -Encoding utf8
            $startOutput = Join-Path $env:RUNNER_TEMP "networkcore-service-start-invalid-config.out"
            $startError = Join-Path $env:RUNNER_TEMP "networkcore-service-start-invalid-config.err"
            $startProcess = Start-Process -FilePath $serviceExe -ArgumentList "start" -PassThru -RedirectStandardOutput $startOutput -RedirectStandardError $startError
            if (-not $startProcess.WaitForExit(10000)) {
              Stop-Process -Id $startProcess.Id -Force -ErrorAction SilentlyContinue
              if (Test-Path $startOutput) { Get-Content $startOutput }
              if (Test-Path $startError) { Get-Content $startError }
              throw "Windows service start waited for an invalid managed configuration."
            }
            if ($startProcess.ExitCode -ne 0) {
              if (Test-Path $startOutput) { Get-Content $startOutput }
              if (Test-Path $startError) { Get-Content $startError }
              throw "Windows service start request failed for an invalid managed configuration."
            }

            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            do {
              $service = Get-Service -Name "AnixOpsNetworkCore" -ErrorAction Stop
              if ($service.Status -eq "Stopped") { break }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $deadline)
            if ($service.Status -ne "Stopped") {
              throw "Windows service did not report failure after invalid managed configuration."
            }
          } finally {
            Set-Content -Path $managedConfigPath -Value $originalManagedConfig -Encoding utf8
          }
          $serviceLog = Join-Path $env:ProgramData "AnixOps\NetworkCore\logs\service.log"
          if (-not (Test-Path $serviceLog -PathType Leaf)) {
            throw "Windows service did not write a startup diagnostic log."
          }
          if (-not (Select-String -Path $serviceLog -SimpleMatch "runtime start failed" -Quiet)) {
            throw "Windows service did not record the invalid managed configuration failure."
          }

          Invoke-MsiTransaction `
            -Arguments @("/x", "`"$msiPath`"", "/qn", "/norestart", "/l*v", "`"$uninstallLog`"") `
            -LogPath $uninstallLog `
            -Operation "uninstall"

          if ($null -ne (Get-Service -Name "AnixOpsNetworkCore" -ErrorAction SilentlyContinue)) {
            throw "Windows managed client MSI uninstall left AnixOpsNetworkCore registered."
          }
          if ($null -ne (Get-ScheduledTask -TaskPath "\AnixOps\" -TaskName $startupTaskName -ErrorAction SilentlyContinue)) {
            throw "Windows managed client MSI uninstall left the NetworkCore sign-in startup task."
          }

  swift:
    name: Swift package build, test and manifest validation
    runs-on: macos-26
    timeout-minutes: 45
    needs: changes
    if: ${{ needs.changes.outputs.apple == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Package.swift against the activation gate
        shell: bash
        run: bash .github/scripts/verify-ios-package-manifest.sh source

      - name: Test
        shell: bash
        working-directory: apps/ios
        run: swift test

      - name: Build
        shell: bash
        working-directory: apps/ios
        run: swift build

      # The release tool signs with the app's own verifier; every tampered feed or archive must be refused.
      - name: Signed update feed refuses tampering
        shell: bash
        run: bash .github/scripts/appcast-tamper-check.sh

      - name: Setup Go for the anix-kit interop check
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      # Feeds signed by AnixOps/anix-kit (anixsign / anixupdate) verify in the app, and the reverse.
      - name: Update feed interoperates with anix-kit
        shell: bash
        run: bash .github/scripts/appcast-anixkit-interop.sh

  ios-xcode-build:
    name: iOS and macOS Xcode build
    runs-on: macos-26
    timeout-minutes: 60
    needs: changes
    if: ${{ needs.changes.outputs.apple == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-runtime
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build the embedded runtime XCFramework
        shell: bash
        run: bash .github/scripts/build-ios-runtime-xcframework.sh all

      - name: Install XcodeGen
        shell: bash
        run: brew install xcodegen

      - name: Generate the Xcode project from apps/ios/project.yml
        shell: bash
        working-directory: apps/ios
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          # XcodeGen must not rewrite the committed entitlements, and both targets must sign with them.
          git diff --exit-code -- Entitlements
          grep -q 'CODE_SIGN_ENTITLEMENTS = Entitlements/NetworkCoreApp.entitlements;' NetworkCore.xcodeproj/project.pbxproj
          grep -q 'CODE_SIGN_ENTITLEMENTS = Entitlements/NetworkCorePacketTunnel.entitlements;' NetworkCore.xcodeproj/project.pbxproj
          grep -q 'CODE_SIGN_ENTITLEMENTS = Entitlements/NetworkCoreWidget.entitlements;' NetworkCore.xcodeproj/project.pbxproj
          grep -q 'CODE_SIGN_ENTITLEMENTS = Entitlements/NetworkCoreMac.entitlements;' NetworkCore.xcodeproj/project.pbxproj
          grep -q 'CODE_SIGN_ENTITLEMENTS = Entitlements/NetworkCoreMacTunnel.entitlements;' NetworkCore.xcodeproj/project.pbxproj
          grep -q 'CODE_SIGN_ENTITLEMENTS = Entitlements/NetworkCoreCLI.entitlements;' NetworkCore.xcodeproj/project.pbxproj

      - name: Build the app without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/ios/NetworkCore.xcodeproj \
            -scheme NetworkCoreApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath apps/ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check bundled privacy manifests and the tunnel extension point
        shell: bash
        run: |
          set -euo pipefail
          app=apps/ios/build/Build/Products/Debug-iphonesimulator/NetworkCoreApp.app
          appex="${app}/PlugIns/NetworkCorePacketTunnel.appex"
          test -f "${app}/PrivacyInfo.xcprivacy"
          test -f "${appex}/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "${appex}/Info.plist" \
            | grep -qx 'com.apple.networkextension.packet-tunnel'
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "${app}/PlugIns/NetworkCoreWidget.appex/Info.plist" \
            | grep -qx 'com.apple.widgetkit-extension'
          # The connection's Live Activity needs the app to declare it.
          /usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "${app}/Info.plist" | grep -qx 'true'
          # App Store Connect rejects uploads without an asset-catalog icon or declared orientations.
          # actool records the icon under CFBundleIcons:CFBundlePrimaryIcon; some Xcode versions also add it at the top level.
          icon="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "${app}/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "${app}/Info.plist" 2>/dev/null || true)"
          if [ "${icon}" != "AppIcon" ]; then
            echo "::error::the built app has no compiled AppIcon"
            plutil -p "${app}/Info.plist"
            ls "${app}"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations' "${app}/Info.plist" | grep -q 'UIInterfaceOrientationPortrait'
          test -f "${app}/Assets.car"

      - name: Check the tunnel extension links the embedded runtime
        shell: bash
        run: |
          set -euo pipefail
          products=apps/ios/build/Build/Products/Debug-iphonesimulator
          # Debug builds may move code into <name>.debug.dylib, so read every Mach-O next to the executable.
          symbols() {
            local dir="$1" name="$2" out="$3"
            : > "${out}"
            find "${dir}" -maxdepth 1 -type f -name "${name}*" -print0 | while IFS= read -r -d '' file; do
              nm "${file}" >> "${out}" 2>/dev/null || true
            done
          }
          symbols "${products}/NetworkCoreApp.app/PlugIns/NetworkCorePacketTunnel.appex" NetworkCorePacketTunnel "${RUNNER_TEMP}/appex-symbols.txt"
          symbols "${products}/NetworkCoreApp.app" NetworkCoreApp "${RUNNER_TEMP}/app-symbols.txt"
          grep -q '_networkcore_ios_runtime_init$' "${RUNNER_TEMP}/appex-symbols.txt"
          # The app links the runtime library for subscription import and the HTTP delay test.
          grep -q '_networkcore_import_nodes$' "${RUNNER_TEMP}/app-symbols.txt"
          grep -q '_networkcore_ios_measure_delay$' "${RUNNER_TEMP}/app-symbols.txt"

      - name: Build the macOS app without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/ios/NetworkCore.xcodeproj \
            -scheme NetworkCoreMac \
            -destination 'generic/platform=macOS' \
            -derivedDataPath apps/ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check the macOS app bundle and its tunnel extension
        shell: bash
        run: |
          set -euo pipefail
          app="apps/ios/build/Build/Products/Debug/AnixOps Net.app"
          # Developer ID distribution: the tunnel is a System Extension named after its bundle ID.
          tunnel_id=com.example.networkcore.macos.packettunnel
          appex="${app}/Contents/Library/SystemExtensions/${tunnel_id}.systemextension"
          test -f "${app}/Contents/Resources/PrivacyInfo.xcprivacy"
          test -f "${app}/Contents/Resources/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "${app}/Contents/Info.plist" | grep -qx 'AppIcon'
          /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "${appex}/Contents/Info.plist" | grep -qx 'SYSX'
          /usr/libexec/PlistBuddy -c 'Print :NetworkExtension:NEProviderClasses:com.apple.networkextension.packet-tunnel' \
            "${appex}/Contents/Info.plist" | grep -qx 'NetworkCoreMacTunnel.PacketTunnelProvider'
          /usr/libexec/PlistBuddy -c 'Print :NetworkExtension:NEMachServiceName' "${appex}/Contents/Info.plist" \
            | grep -q 'net.anixops.networkcore.tunnel$'
          /usr/libexec/PlistBuddy -c 'Print :NSSystemExtensionUsageDescription' "${appex}/Contents/Info.plist" > /dev/null
          # In-app updates are off unless the release build sets the feed URL and public keys (docs/macos-updates.md).
          /usr/libexec/PlistBuddy -c 'Print :AnixOpsUpdateFeedURL' "${app}/Contents/Info.plist" > /dev/null
          /usr/libexec/PlistBuddy -c 'Print :AnixOpsUpdatePublicKeys' "${app}/Contents/Info.plist" > /dev/null
          test ! -d "${app}/Contents/PlugIns/NetworkCoreMacTunnel.appex"
          test -d "${app}/Contents/Resources/en.lproj"
          symbols() {
            local dir="$1" name="$2" out="$3"
            : > "${out}"
            find "${dir}" -maxdepth 1 -type f -name "${name}*" -print0 | while IFS= read -r -d '' file; do
              nm "${file}" >> "${out}" 2>/dev/null || true
            done
          }
          symbols "${appex}/Contents/MacOS" "${tunnel_id}" "${RUNNER_TEMP}/mac-appex-symbols.txt"
          symbols "${app}/Contents/MacOS" "AnixOps Net" "${RUNNER_TEMP}/mac-app-symbols.txt"
          grep -q '_networkcore_ios_runtime_init$' "${RUNNER_TEMP}/mac-appex-symbols.txt"
          # The app links the runtime library for subscription import and the HTTP delay test.
          grep -q '_networkcore_import_nodes$' "${RUNNER_TEMP}/mac-app-symbols.txt"
          grep -q '_networkcore_ios_measure_delay$' "${RUNNER_TEMP}/mac-app-symbols.txt"
          lipo -archs "${appex}/Contents/MacOS/${tunnel_id}" | tee "${RUNNER_TEMP}/mac-archs.txt"
          grep -q arm64 "${RUNNER_TEMP}/mac-archs.txt"

      # The command-line tool ships in the app and must parse, report its version and use the documented exit codes
      # without the app running (docs/macos-cli.md).
      - name: Check the macOS command-line tool
        shell: bash
        run: |
          set -euo pipefail
          app="apps/ios/build/Build/Products/Debug/AnixOps Net.app"
          cli="${app}/Contents/MacOS/anixops"
          test -x "${cli}"
          /usr/libexec/PlistBuddy -c 'Print :AnixOpsAppGroup' "${app}/Contents/Info.plist" | grep -q 'net.anixops.networkcore$'
          "${cli}" --help | grep -q '退出码'
          "${cli}" version | grep -q '^anixops '
          expect() {
            local want="$1"
            shift
            set +e
            "${cli}" "$@" > /dev/null 2>&1
            local got=$?
            set -e
            if [ "${got}" -ne "${want}" ]; then
              echo "::error::anixops $*: expected exit code ${want}, got ${got}"
              exit 1
            fi
          }
          expect 64 frobnicate
          expect 64 mode fast
          expect 64
          expect 66 import /nonexistent/nodes.txt
          # Nothing listens on this socket: the app is "not running", and status never launches the app.
          expect 69 status --socket "${RUNNER_TEMP}/none.sock"
          expect 69 nodes --socket "${RUNNER_TEMP}/none.sock"

      # The unsigned debug build opens with made-up data (`-AnixOpsDemo YES`), so the pictures need no account,
      # no certificate and no tunnel. A machine without a screen session must not fail the build.
      - name: Take macOS screenshots with demo data
        continue-on-error: true
        shell: bash
        run: .github/scripts/mac-screenshots.sh "apps/ios/build/Build/Products/Debug/AnixOps Net.app" "${RUNNER_TEMP}/mac-screenshots"

      - name: Upload the macOS screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/mac-screenshots
          if-no-files-found: ignore
          retention-days: 3

  # The Android app (apps/android): the Linux window and backend with the VpnService plugin, built for arm64 by
  # the Tauri CLI. The Gradle project is generated here (`tauri android init`) and never committed. The APK is
  # signed with ANDROID_KEYSTORE_* secrets when they are set, otherwise with a throwaway debug key made for this
  # run (installing a later build then needs the old one uninstalled first).
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and sign the APK
        uses: ./.github/actions/android-apk
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: anixops-net-android-${{ github.sha }}
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
          retention-days: 3

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - changes
      - ui
      - rust-deps
      - rust-linux
      - linux-gui
      - android
      - windows
      - swift
      - ios-xcode-build
    steps:
      - name: Check required jobs
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${RESULTS}" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"' | tee "${RUNNER_TEMP}/results.txt"
          if grep -Eq '=(failure|cancelled)$' "${RUNNER_TEMP}/results.txt"; then
            echo "::error::one or more CI jobs failed or were cancelled"
            exit 1
          fi
