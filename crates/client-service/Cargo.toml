[package]
name = "client-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The client core as a background service: answers the windows connected over client-ipc and asks the user's window for what only that user's session can do."

[dependencies]
app-notifications = { path = "../app-notifications" }
client-core = { path = "../client-core" }
client-ipc = { path = "../client-ipc" }
client-mcp = { path = "../client-mcp" }
client-window = { path = "../client-window" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
