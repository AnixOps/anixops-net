name: Refresh pnpm Lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Generate pnpm lockfile artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Generate pnpm lockfile
        shell: bash
        run: pnpm --dir apps/windows-gui/ui install --lockfile-only --no-frozen-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pnpm-lock
          path: apps/windows-gui/ui/pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
