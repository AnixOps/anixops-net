[package]
name = "anixops-netd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The AnixOps Net core as a Linux daemon: runs the engine as a system service and answers the windows of signed-in users over a Unix socket."

# Linux only. On other systems the crate builds to nothing, so workspace-wide commands still pass there.
[target.'cfg(target_os = "linux")'.dependencies]
client-core = { path = "../../crates/client-core" }
client-ipc = { path = "../../crates/client-ipc" }
client-service = { path = "../../crates/client-service" }
libc = "0.2"
serde_json = "1"
