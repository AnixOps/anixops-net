name: R28 compatibility evidence

on:
  push:
    branches: [kalijerry/net-11-dns-ui-evidence]

permissions:
  contents: read

jobs:
  mesh:
    if: ${{ !contains(github.event.head_commit.message, '[projection-only]') }}
    name: Linux mesh contracts (${{ matrix.core }}, ${{ matrix.gate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        core: [default, rc.1]
        gate: [closed, preview]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Checkout exact R28 client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fbb734de1d05780421f7226c868aee14de54ac33
          persist-credentials: false

      - name: Checkout exact RC manifest and lockfile source
        if: matrix.core == 'rc.1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a4efd839c352f9a398b8e97bb383f4b617257181
          path: rc-client
          persist-credentials: false

      - name: Select and verify Core source
        shell: bash
        env:
          CORE: ${{ matrix.core }}
        run: |
          set -euo pipefail
          echo "Client $(git rev-parse HEAD)"
          if [[ "$CORE" == 'rc.1' ]]; then
            test "$(git -C rc-client rev-parse HEAD)" = a4efd839c352f9a398b8e97bb383f4b617257181
            cp rc-client/Cargo.toml rc-client/Cargo.lock .
            core_sha=ef52978586ce43e8c5a7376f987eb435650d9019
          else
            core_sha=6790d8675309d5d2cb719a5fcee4acca69735663
          fi
          test "$(sed -nE 's/.*networkcore_anixops", rev = "([0-9a-f]+)".*/\1/p' Cargo.toml | sort -u)" = "$core_sha"
          test "$(sed -nE 's/^source = "git\+https:\/\/github.com\/AnixOps\/networkcore_anixops\?rev=([0-9a-f]+)#[0-9a-f]+"$/\1/p' Cargo.lock | sort -u)" = "$core_sha"
          echo "Core $core_sha"

      - name: Run client mesh and view contracts
        shell: bash
        env:
          GATE: ${{ matrix.gate }}
        run: |
          set -euxo pipefail
          unset ANIXOPS_MESH_PREVIEW ANIXOPS_MESH04_PREVIEW
          if [[ "$GATE" == preview ]]; then export ANIXOPS_MESH_PREVIEW=1; fi
          rustup toolchain install stable --profile minimal
          cargo +stable test --locked -p client-core --lib backend::mesh::tests
          cargo +stable test --locked -p client-view

  projection:
    name: Core snapshot to desktop clipboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout evidence and Core captures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout exact R28 client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fbb734de1d05780421f7226c868aee14de54ac33
          path: client
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/apps/windows-gui/ui/pnpm-lock.yaml

      - name: Build the desktop UI and install Chromium
        shell: bash
        working-directory: client
        run: |
          set -euxo pipefail
          pnpm --dir apps/windows-gui/ui install --frozen-lockfile
          pnpm --dir apps/windows-gui/ui run build
          tools="$RUNNER_TEMP/playwright-tools"
          npm install --prefix "$tools" --no-audit --no-fund playwright@1.63.0
          "$tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$tools/node_modules" >> "$GITHUB_ENV"

      - name: Project exact snapshots through Rust and verify desktop copy and wording
        shell: bash
        run: |
          set -euxo pipefail
          unset ANIXOPS_MESH_PREVIEW ANIXOPS_MESH04_PREVIEW
          (cd r28-evidence && sha256sum --check SHA256SUMS)
          node -e 'const assert = require("node:assert/strict"); assert.equal(require("./r28-evidence/default.provenance.json").coreSha, "6790d8675309d5d2cb719a5fcee4acca69735663"); assert.equal(require("./r28-evidence/rc1.provenance.json").coreSha, "ef52978586ce43e8c5a7376f987eb435650d9019");'
          node -e 'require("node:assert/strict").equal(require("./r28-evidence/core439.provenance.json").coreSha, "1d9b4907918355a27ab3bb65698b28ca3e0ed0fa");'
          mkdir -p client/crates/client-view/examples
          cp crates/client-view/examples/project_mesh_status.rs client/crates/client-view/examples/
          cp apps/windows-gui/ui/screenshots/mesh-compat.cjs client/apps/windows-gui/ui/screenshots/
          rustup toolchain install stable --profile minimal
          cd client
          git rev-parse HEAD
          cargo +stable build --locked -p client-view --example project_mesh_status
          origin=http://127.0.0.1:4173
          pnpm --dir apps/windows-gui/ui exec vite preview --host 127.0.0.1 --port 4173 --strictPort &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in {1..20}; do curl --fail --silent "$origin" > /dev/null && break; sleep 1; done
          curl --fail --silent "$origin" > /dev/null
          shopt -s nullglob
          captures=(../r28-evidence/*.status.json)
          test "${#captures[@]}" -ge 2
          for snapshot in "${captures[@]}"; do
            echo "Core snapshot: $snapshot"
            target/debug/examples/project_mesh_status < "$snapshot" > "$RUNNER_TEMP/projected.json"
            node apps/windows-gui/ui/screenshots/mesh-compat.cjs "$origin" "$RUNNER_TEMP/projected.json" "${snapshot%.status.json}.expected.json"
          done
