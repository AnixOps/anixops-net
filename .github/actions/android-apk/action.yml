name: Android APK
description: >-
  Builds the arm64 Android APK (apps/android-native: the Rust bridge by cargo-ndk, then Gradle) and signs it with
  the given keystore, or with a throwaway debug key when no keystore is given, or leaves it unsigned with
  sign: false (release.yml signs it in a separate job that holds the release key). With bundle: true it also builds the
  Android App Bundle (AAB) for Google Play and signs it with the Play upload key when one is given. Shared by
  ci.yml, which also runs lint, the unit tests and the screenshots in the same Gradle call, release.yml and
  play-bundle.yml.

inputs:
  keystore-base64:
    description: Base64 of the release keystore (ANDROID_KEYSTORE_BASE64); empty = throwaway debug key
    required: false
    default: ""
  keystore-password:
    required: false
    default: ""
  key-alias:
    required: false
    default: ""
  key-password:
    required: false
    default: ""
  sign:
    description: >-
      false = leave the APK unsigned (output kind "unsigned"); release.yml signs it in its own job, so the release
      key never shares a job with Gradle or the third-party actions used here
    required: false
    default: "true"
  save-cache:
    description: Whether to save the Rust and Gradle caches
    required: false
    default: "false"
  checks:
    description: Gradle tasks to run before the release build in the same call (CI's lint, tests and screenshots)
    required: false
    default: ""
  version-name:
    description: >-
      versionName for the build (release.yml and play-bundle.yml pass the tag without "v"); empty = the default in
      build.gradle.kts (CI builds)
    required: false
    default: ""
  notices-file:
    description: >-
      THIRD_PARTY_NOTICES.txt to pack into the assets (release.yml and play-bundle.yml, from
      .github/actions/third-party-notices); empty = none (CI builds)
    required: false
    default: ""
  bundle:
    description: Also build the AAB (:app:bundleRelease)
    required: false
    default: "false"
  upload-keystore-base64:
    description: Base64 of the Google Play upload keystore (PLAY_UPLOAD_KEYSTORE_BASE64); empty = AAB left unsigned
    required: false
    default: ""
  upload-keystore-password:
    required: false
    default: ""
  upload-key-alias:
    required: false
    default: ""
  upload-key-password:
    required: false
    default: ""

outputs:
  apk:
    description: Absolute path of the signed APK (of the unsigned one with sign false)
    value: ${{ steps.sign.outputs.apk || steps.unsigned.outputs.apk }}
  kind:
    description: release (signed with the keystore), debug (throwaway key) or unsigned (sign false)
    value: ${{ steps.sign.outputs.kind || steps.unsigned.outputs.kind }}
  aab:
    description: Absolute path of the AAB (bundle true only)
    value: ${{ steps.sign-aab.outputs.aab }}
  aab-kind:
    description: play-signed (signed with the Play upload key) or unsigned (bundle true only)
    value: ${{ steps.sign-aab.outputs.kind }}

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: "17"

    - name: Setup Rust
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
        rustup target add aarch64-linux-android

    - name: Restore Rust build cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: android-native
        save-if: ${{ inputs.save-cache }}

    - name: Install cargo-ndk
      shell: bash
      run: cargo install cargo-ndk --version 3.5.4 --locked

    - name: Build the Rust bridge
      shell: bash
      run: |
        set -euo pipefail
        ndk="${ANDROID_NDK_LATEST_HOME}"
        # rquickjs-sys generates its Android bindings with bindgen against the NDK headers (API level = minSdk).
        export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android26 --sysroot=${ndk}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
        export ANDROID_NDK_HOME="${ndk}"
        # 16 KB pages: Google Play requires native libraries whose LOAD segments are 16 KB aligned (checked below).
        export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"
        cargo ndk -t arm64-v8a --platform 26 -o apps/android-native/app/src/main/jniLibs \
          build --release --locked -p anixops-net-android
        ls -l apps/android-native/app/src/main/jniLibs/arm64-v8a

    - name: Native libraries are 16 KB page aligned
      shell: bash
      run: |
        set -euo pipefail
        readelf="${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
        test -x "${readelf}"
        bad=0
        for so in apps/android-native/app/src/main/jniLibs/arm64-v8a/*.so; do
          test -f "${so}"
          # Every LOAD segment's alignment (last column) must be at least 2**14; a library with no LOAD segment
          # read means the check itself failed.
          aligns="$("${readelf}" -lW "${so}" | awk '$1 == "LOAD" { print $NF }')"
          if [ -z "${aligns}" ]; then
            echo "::error::${so}: no LOAD segments read"
            bad=1
            continue
          fi
          for align in ${aligns}; do
            echo "${so}: LOAD align ${align}"
            if [ $((align)) -lt 16384 ]; then
              echo "::error::${so}: LOAD segment aligned to ${align}, Google Play needs 16 KB (0x4000)"
              bad=1
            fi
          done
        done
        exit "${bad}"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        gradle-version: "8.14.3"
        cache-read-only: ${{ inputs.save-cache != 'true' }}

    # Robolectric fetches its android-all jars from Maven Central while the unit tests run, outside Gradle's cache.
    # A failed fetch fails every Robolectric test (main fa989cd: 66 of 91, IOException in MavenArtifactFetcher), so
    # keep them in their own cache keyed on the Robolectric version and compileSdk.
    - name: Cache Robolectric android-all jars
      if: inputs.checks != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository/org/robolectric
        key: robolectric-${{ runner.os }}-${{ hashFiles('apps/android-native/gradle/libs.versions.toml', 'apps/android-native/app/build.gradle.kts') }}
        restore-keys: robolectric-${{ runner.os }}-

    - name: Build the APK
      shell: bash
      env:
        CHECKS: ${{ inputs.checks }}
        BUNDLE: ${{ inputs.bundle }}
        VERSION_NAME: ${{ inputs.version-name }}
        NOTICES_FILE: ${{ inputs.notices-file }}
      run: |
        set -euo pipefail
        tasks=":app:assembleRelease"
        if [ "${BUNDLE}" = "true" ]; then
          tasks="${tasks} :app:bundleRelease"
        fi
        props=()
        if [ -n "${VERSION_NAME}" ]; then
          if [[ ! "${VERSION_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]; then
            echo "::error::version-name must look like 0.3.0 or 0.3.0-beta.7, got ${VERSION_NAME}"
            exit 1
          fi
          props+=("-Panixops.versionName=${VERSION_NAME}")
        fi
        if [ -n "${NOTICES_FILE}" ]; then
          test -s "${NOTICES_FILE}"
          props+=("-Panixops.noticesFile=${NOTICES_FILE}")
        fi
        # Word splitting is wanted: CHECKS and tasks are lists of Gradle task names.
        # shellcheck disable=SC2086
        gradle -p apps/android-native --no-daemon "${props[@]}" ${CHECKS} ${tasks}

    - name: Sign the APK
      id: sign
      if: ${{ inputs.sign != 'false' }}
      uses: ./.github/actions/sign-apk
      with:
        unsigned: ${{ github.workspace }}/apps/android-native/app/build/outputs/apk/release/app-release-unsigned.apk
        name: anixops-net-android-arm64
        keystore-base64: ${{ inputs.keystore-base64 }}
        keystore-password: ${{ inputs.keystore-password }}
        key-alias: ${{ inputs.key-alias }}
        key-password: ${{ inputs.key-password }}

    - name: Keep the APK unsigned
      id: unsigned
      if: ${{ inputs.sign == 'false' }}
      shell: bash
      run: |
        set -euo pipefail
        unsigned="${GITHUB_WORKSPACE}/apps/android-native/app/build/outputs/apk/release/app-release-unsigned.apk"
        test -f "${unsigned}"
        mkdir -p "${RUNNER_TEMP}/apk"
        out="${RUNNER_TEMP}/apk/anixops-net-android-arm64-unsigned.apk"
        cp "${unsigned}" "${out}"
        ls -l "${out}"
        echo "apk=${out}" >> "$GITHUB_OUTPUT"
        echo "kind=unsigned" >> "$GITHUB_OUTPUT"

    # Google Play takes the AAB signed with the upload key (jarsigner; apksigner does not sign bundles) and re-signs
    # it with the app signing key it holds (Play App Signing).
    - name: Sign the AAB
      id: sign-aab
      if: ${{ inputs.bundle == 'true' }}
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ inputs.upload-keystore-base64 }}
        KEYSTORE_PASSWORD: ${{ inputs.upload-keystore-password }}
        KEY_ALIAS: ${{ inputs.upload-key-alias }}
        KEY_PASSWORD: ${{ inputs.upload-key-password }}
      run: |
        set -euo pipefail
        unsigned="${GITHUB_WORKSPACE}/apps/android-native/app/build/outputs/bundle/release/app-release.aab"
        test -f "${unsigned}"
        mkdir -p "${RUNNER_TEMP}/aab"
        if [ -z "${KEYSTORE_BASE64}" ]; then
          out="${RUNNER_TEMP}/aab/anixops-net-android-unsigned.aab"
          cp "${unsigned}" "${out}"
          kind=unsigned
        else
          keystore="${RUNNER_TEMP}/play-upload.jks"
          echo "${KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          out="${RUNNER_TEMP}/aab/anixops-net-android-play-signed.aab"
          cp "${unsigned}" "${out}"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "${keystore}" \
            -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD "${out}" "${KEY_ALIAS}"
          jarsigner -verify "${out}" | tee "${RUNNER_TEMP}/aab-verify.txt"
          grep -q "jar verified" "${RUNNER_TEMP}/aab-verify.txt"
          keytool -printcert -jarfile "${out}"
          rm -f "${keystore}"
          # GitHub drops a step output that contains a secret's value, and the upload key alias may be a plain
          # word such as "upload"; so neither the path nor the kind uses that word.
          kind=play-signed
        fi
        ls -l "${out}"
        echo "aab=${out}" >> "$GITHUB_OUTPUT"
        echo "kind=${kind}" >> "$GITHUB_OUTPUT"
