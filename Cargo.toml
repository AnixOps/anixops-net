[workspace]
members = [
    "apps/android-native/rust",
    "apps/linux-gui",
    "apps/windows-gui",
    "crates/app-log",
    "crates/app-notifications",
    "crates/anx-license",
    "crates/client-core",
    "crates/client-health",
    "crates/client-ipc",
    "crates/desktop-dns",
    "crates/desktop-mitm",
    "crates/network-watch",
    "crates/node-edits",
    "crates/on-demand",
    "crates/subscription-meta",
    "crates/traffic-stats",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/AnixOps/anixops-net"

# The kernel lives in AnixOps/networkcore_anixops and is pinned to one commit here.
# Upgrading the kernel = change every rev below to the new commit (or tag) and refresh Cargo.lock.
# CI also builds the iOS runtime and the Windows CLI from this same checkout (.github/scripts/kernel-root.sh).
# For local kernel work, uncomment the [patch] section at the end and point it at a kernel checkout.
[workspace.dependencies]
config-core = { git = "https://github.com/AnixOps/networkcore_anixops", rev = "f0d4e61374aa8123055c31637b96995fd5ad90f1" }
control-domain = { git = "https://github.com/AnixOps/networkcore_anixops", rev = "f0d4e61374aa8123055c31637b96995fd5ad90f1" }
engine-embedded = { git = "https://github.com/AnixOps/networkcore_anixops", rev = "f0d4e61374aa8123055c31637b96995fd5ad90f1" }
inbound-mixed = { git = "https://github.com/AnixOps/networkcore_anixops", rev = "f0d4e61374aa8123055c31637b96995fd5ad90f1" }
mitm-policy = { git = "https://github.com/AnixOps/networkcore_anixops", rev = "f0d4e61374aa8123055c31637b96995fd5ad90f1" }
node-import = { git = "https://github.com/AnixOps/networkcore_anixops", rev = "f0d4e61374aa8123055c31637b96995fd5ad90f1" }
platform-windows = { git = "https://github.com/AnixOps/networkcore_anixops", rev = "f0d4e61374aa8123055c31637b96995fd5ad90f1" }

