name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request runs are cancelled. Runs on main and manual dispatch
# always finish so every merged commit has a complete result; each main commit
# has its own group, so a merge does not wait for the previous merge's run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Kernel tests (protocols, engine, MITM, scripts, interop, fuzz) run in AnixOps/networkcore_anixops.
# This workflow only builds and tests the clients against the kernel commit pinned in Cargo.toml.
jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      windows: ${{ steps.changes.outputs.windows }}
      apple: ${{ steps.changes.outputs.apple }}
      android_native: ${{ steps.changes.outputs.android_native }}
      windows_native: ${{ steps.changes.outputs.windows_native }}
      linux_native: ${{ steps.changes.outputs.linux_native }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # All clients derive branding from the vendored design files.
      - name: AnixOps Design vendored copy matches its manifest
        run: python3 .github/scripts/sync_design.py --check

      - name: Design tokens are up to date
        run: python3 .github/scripts/design_tokens.py --check

      # Every Windows Start menu shortcut, Installed apps entry and window executable carries the AnixOps Net
      # icon (an advertised shortcut without one shows the blank file icon). The self-test checks the rules first.
      - name: Windows shortcuts and programs have the app icon
        run: |
          python3 .github/scripts/windows_icons.py --self-test
          python3 .github/scripts/windows_icons.py

      # Public builds ship no preset scripts or preset routing rules (docs/no-presets.md).
      - name: No preset scripts or routing rules
        run: python3 .github/scripts/no_presets.py

      # Neutral terminology (AnixOps-design guidelines/terminology.md): none of the replaced terms in any
      # tracked file. The script and word list are byte-identical copies of the AnixOps-design baseline.
      - name: Neutral terminology
        run: python3 .github/scripts/neutral_terms.py

      # Interface colours come only from the generated design tokens: no colour literals, no faded copies of a
      # token, no disabled state drawn by fading (docs/ui-ux.md, 自动检查). The self-test checks the rules first.
      - name: UI lint
        run: |
          python3 .github/scripts/ui_lint.py --self-test
          python3 .github/scripts/ui_lint.py

      # iOS / macOS interface text: every Chinese string in apps/ios/Sources is an entry of Localizable.xcstrings
      # with English and Traditional Chinese, and reaches the screen through a lookup, not as a plain String
      # (docs/ui-ux.md, 自动检查). The self-test checks the rules first.
      - name: Apple interface strings are localized
        run: |
          python3 .github/scripts/apple_strings.py --self-test
          python3 .github/scripts/apple_strings.py

      # Every address the client sources name is described in docs/network-behavior.md: a new update server,
      # statistics endpoint or lookup service fails here until it is documented. Addresses built at run time
      # (the connection-quality report) are listed with a source marker; the self-test checks those rules first.
      - name: Outbound addresses are documented
        run: |
          python3 .github/scripts/outbound_hosts.py --self-test
          python3 .github/scripts/outbound_hosts.py

      - name: Path classification maps every input to the jobs that read it
        run: bash .github/scripts/classify-changes.test.sh

      # The Apple apps stop the tunnel when the embedded runtime's (ABI, schema, feature set) differs from
      # NetworkCoreRuntimeFFI.swift. build-ios-runtime-xcframework.sh checks the pinned kernel before every Apple
      # build; this pins the check itself.
      - name: Runtime handshake check catches drift
        run: bash .github/scripts/ios-runtime-handshake.test.sh

      # One version: Cargo.toml's workspace version is the source, and every copy the other build systems read
      # (Cargo.lock, .NET props and manifest, project.yml, build.gradle.kts)
      # equals it. release.yml and release-tag.yml also check it against the tag.
      - name: Version copies match the source
        run: |
          python3 -I .github/scripts/version.py --self-test
          python3 -I .github/scripts/version.py check

      # Export compliance: the app and its tunnel ship their own encryption (TLS, AEAD ciphers, WireGuard in the
      # bundled runtime), so every target that declares ITSAppUsesNonExemptEncryption must declare true, and
      # docs/manual-intervention.md must not keep the old "HTTPS only, exempt" answer (出口合规).
      - name: Export compliance declaration matches the app
        run: |
          set -euo pipefail
          if grep -nE '^\s*ITSAppUsesNonExemptEncryption:\s*(false|NO|no)\s*$' apps/ios/project.yml; then
            echo "::error::apps/ios/project.yml declares exempt encryption; the bundled runtime implements its own encryption."
            exit 1
          fi
          test "$(grep -cE '^\s*ITSAppUsesNonExemptEncryption:\s*true\s*$' apps/ios/project.yml)" -ge 4
          if grep -n '^ios-export-compliance-answer=standard-https-only-exempt' docs/manual-intervention.md; then
            echo "::error::docs/manual-intervention.md still records the exempt export compliance answer."
            exit 1
          fi

      # Every action is pinned to a commit SHA, and the Android release key and the Play keys appear only in jobs that
      # declare their protected environment (the release key only in release.yml's sign-android). The self-tests
      # check the rules first; android-signing-gate.test.sh covers the release APK signing gate.
      - name: Workflow supply chain and signing keys
        run: |
          python3 -I .github/scripts/workflow_policy.py --self-test
          python3 -I .github/scripts/workflow_policy.py
          bash .github/scripts/android-signing-gate.test.sh

      # 组网 stays closed in every release build (release.yml runs the same check before packaging).
      - name: Mesh release gate stays closed
        run: bash .github/scripts/mesh-release-gate.sh

      # The download page and latest.json point to the newest stable release; a later beta never replaces it.
      - name: Download page picks the stable release
        run: python3 -I .github/scripts/download_page_test.py

      # Pull requests run only the platforms their paths touch. Manual runs, every push to main that changes
      # anything besides documentation, and any change to the workspace, lockfile, workflows, scripts, Rust tool
      # configuration or a path classify-changes.sh does not name run everything. A push to main that only changes
      # documentation (root *.md other than TERMS.md and PRIVACY.md, docs/) runs nothing: no build reads those files. Its CI summary then has skipped jobs, which release.yml does not
      # accept, so such a commit is released only after a manual (full) run.
      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          rust=false; windows=false; apple=false; android_native=false
          windows_native=false; linux_native=false
          all() { rust=true; windows=true; apple=true; android_native=true; windows_native=true; linux_native=true; }
          # Documentation no build, test or packaging step reads. TERMS.md and PRIVACY.md are not here: the apps
          # bundle them.
          docs_only() {
            local path
            while IFS= read -r path; do
              case "${path}" in
                TERMS.md | PRIVACY.md) return 1 ;;
                docs/*) ;;
                # A README.md inside a crate or app can be read by the build (rustdoc include_str!).
                */*) return 1 ;;
                *.md) ;;
                *) return 1 ;;
              esac
            done
          }
          if [[ "${EVENT_NAME}" == push ]]; then
            # A new branch, or a force push whose old commit is gone, cannot be diffed: run everything.
            if [[ "${PUSH_BEFORE}" =~ ^0+$ ]] || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              all
            elif ! changed="$(git diff --name-only "${PUSH_BEFORE}" "${PUSH_AFTER}")" || [[ -z "${changed}" ]]; then
              all
            elif docs_only <<< "${changed}"; then
              echo "Documentation-only push to main; no build reads these files:"
              echo "${changed}"
            else
              all
            fi
          elif [[ "${EVENT_NAME}" != pull_request ]]; then
            all
          else
            # Fails closed: a path the script does not name runs every job.
            classified="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | bash .github/scripts/classify-changes.sh)"
            eval "${classified}"
          fi
          {
            echo "rust=${rust}"
            echo "windows=${windows}"
            echo "apple=${apple}"
            echo "android_native=${android_native}"
            echo "windows_native=${windows_native}"
            echo "linux_native=${linux_native}"
          } | tee -a "$GITHUB_OUTPUT"

  rust-deps:
    name: Rust dependency advisories and licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.0

      - name: cargo deny check
        shell: bash
        run: cargo deny --locked check advisories licenses sources

  # The third-party notices every release artifact ships (.github/actions/third-party-notices): run here too, so a
  # dependency whose license cannot be determined or is not accepted fails before a release is tagged.
  third-party-notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.android_native == 'true' || needs.changes.outputs.apple == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Notices script self-test
        run: python3 -I .github/scripts/third_party_notices.py --self-test

      - name: Write the notices
        uses: ./.github/actions/third-party-notices
        with:
          output-dir: ${{ runner.temp }}/notices

      - name: Upload the notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-notices-${{ github.sha }}
          path: ${{ runner.temp }}/notices/*/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 3

  rust-linux:
    name: Rust build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Format
        shell: bash
        run: cargo fmt --all -- --check

      - name: Lint
        shell: bash
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        shell: bash
        run: cargo test --locked --workspace --all-targets

      # The 组网 release gate is closed in the run above (its tests check that); client-core's mesh tests run again
      # with it open, as a test build only (mesh-release-gate.sh keeps it out of releases).
      - name: Test with the mesh preview open
        shell: bash
        env:
          ANIXOPS_MESH_PREVIEW: "1"
          ANIXOPS_MESH04_PREVIEW: "1"
        run: cargo test --locked -p client-core --lib

      # Audit 2026-11-25 NET-01: a body the capture inspector hands to another app must be unreadable by another
      # local account the moment it is written, under the usual 022 umask. A second account reads it via sudo.
      - name: Capture bodies are private to the account
        shell: bash
        run: |
          set -euo pipefail
          sudo useradd --no-create-home --shell /usr/sbin/nologin anixops-other
          umask 022
          ANIXOPS_OTHER_USER=anixops-other cargo test --locked -p desktop-mitm --lib -- \
            --ignored --exact capture::tests::another_account_cannot_read_opened_bodies

  windows:
    name: Windows Rust workspace
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    needs:
      - changes
    if: >-
      ${{
        always() &&
        needs.changes.result == 'success' &&
        needs.changes.outputs.windows == 'true'
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Windows C toolchain
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libsystre

      - name: Configure Windows Rust GNU target
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $MsysRoot = "${{ steps.msys2.outputs.msys2-location }}"
          $MingwPrefix = Join-Path $MsysRoot "mingw64"
          "${{ github.workspace }}\.github\scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$MingwPrefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "MSYS2_LOCATION=$MsysRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MINGW_PREFIX=$MingwPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RC_x86_64_pc_windows_gnu=${{ github.workspace }}\.github\scripts\rc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_BUILD_TARGET=x86_64-pc-windows-gnu" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_x86_64_pc_windows_gnu=$MingwPrefix\bin\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AR_x86_64_pc_windows_gnu=$MingwPrefix\bin\ar.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$MingwPrefix\bin\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy
          rustup target add x86_64-pc-windows-gnu

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-gnu
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Restore windres compatibility shim
        id: windres-shim-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .github/scripts/windres.exe
            .github/scripts/rc.exe
          key: windres-shim-${{ runner.os }}-${{ hashFiles('.github/scripts/windres_compat.rs', '.github/scripts/rc_compat.rs') }}

      - name: Build windres compatibility shim
        if: steps.windres-shim-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustc .github/scripts/windres_compat.rs -o .github/scripts/windres.exe
          rustc .github/scripts/rc_compat.rs -o .github/scripts/rc.exe

      - name: Lint
        shell: bash
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        shell: bash
        run: cargo test --locked --workspace --all-targets

  swift:
    name: Swift package build, test and manifest validation
    runs-on: macos-26
    timeout-minutes: 45
    needs: changes
    if: ${{ needs.changes.outputs.apple == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Package.swift against the activation gate
        shell: bash
        run: bash .github/scripts/verify-ios-package-manifest.sh source

      # ios-testflight.yml runs the gate on macOS, whose bash is 3.2; this keeps the script working there.
      - name: Mesh release gate runs with the macOS bash
        shell: bash
        run: /bin/bash .github/scripts/mesh-release-gate.sh

      - name: Test
        shell: bash
        working-directory: apps/ios
        run: swift test

      # The same with the 组网 release gates open (test build only; kernel 0.3 and 0.4): the mesh tests that need it run here.
      - name: Test with the mesh preview open
        shell: bash
        working-directory: apps/ios
        run: swift test -Xswiftc -DMESH_PREVIEW -Xswiftc -DMESH04_PREVIEW --scratch-path .build-mesh-preview --filter 'Mesh'

      - name: Build
        shell: bash
        working-directory: apps/ios
        run: swift build

      # The release tool signs with the app's own verifier; every tampered feed or archive must be refused.
      - name: Signed update feed refuses tampering
        shell: bash
        run: bash .github/scripts/appcast-tamper-check.sh

      - name: Setup Go for the anix-kit interop check
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.x'
          cache: false

      # Feeds signed by AnixOps/anix-kit (anixsign / anixupdate) verify in the app, and the reverse.
      - name: Update feed interoperates with anix-kit
        shell: bash
        run: bash .github/scripts/appcast-anixkit-interop.sh

  ios-xcode-build:
    name: iOS and macOS Xcode build
    runs-on: macos-26
    timeout-minutes: 60
    needs: changes
    if: ${{ needs.changes.outputs.apple == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ios-runtime
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build the embedded runtime XCFramework
        shell: bash
        run: bash .github/scripts/build-ios-runtime-xcframework.sh all

      - name: Install XcodeGen
        shell: bash
        run: brew install xcodegen

      - name: Generate the Xcode project from apps/ios/project.yml
        shell: bash
        working-directory: apps/ios
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          # XcodeGen must not rewrite the committed entitlements, and both targets must sign with them.
          git diff --exit-code -- Entitlements
          grep -q 'CODE_SIGN_ENTITLEMENTS = Entitlements/NetworkCoreApp.entitlements;' NetworkCore.xcodeproj/project.pbxproj
          grep -q 'CODE_SIGN_ENTITLEMENTS = Entitlements/NetworkCorePacketTunnel.entitlements;' NetworkCore.xcodeproj/project.pbxproj
          grep -q 'CODE_SIGN_ENTITLEMENTS = Entitlements/NetworkCoreWidget.entitlements;' NetworkCore.xcodeproj/project.pbxproj
          grep -q 'CODE_SIGN_ENTITLEMENTS = Entitlements/NetworkCoreMac.entitlements;' NetworkCore.xcodeproj/project.pbxproj
          grep -q 'CODE_SIGN_ENTITLEMENTS = Entitlements/NetworkCoreMacTunnel.entitlements;' NetworkCore.xcodeproj/project.pbxproj
          grep -q 'CODE_SIGN_ENTITLEMENTS = Entitlements/NetworkCoreCLI.entitlements;' NetworkCore.xcodeproj/project.pbxproj

      # build-for-testing also builds the UI test bundle and writes the .xctestrun file, so the jobs after this one
      # run the tests without building anything (test-without-building).
      - name: Build the app without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/ios/NetworkCore.xcodeproj \
            -scheme NetworkCoreApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath apps/ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Check bundled privacy manifests and the tunnel extension point
        shell: bash
        run: |
          set -euo pipefail
          app=apps/ios/build/Build/Products/Debug-iphonesimulator/NetworkCoreApp.app
          appex="${app}/PlugIns/NetworkCorePacketTunnel.appex"
          test -f "${app}/PrivacyInfo.xcprivacy"
          test -f "${appex}/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "${appex}/Info.plist" \
            | grep -qx 'com.apple.networkextension.packet-tunnel'
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "${app}/PlugIns/NetworkCoreWidget.appex/Info.plist" \
            | grep -qx 'com.apple.widgetkit-extension'
          # The connection's Live Activity needs the app to declare it.
          /usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "${app}/Info.plist" | grep -qx 'true'
          # App Store Connect rejects uploads without an asset-catalog icon or declared orientations.
          # actool records the icon under CFBundleIcons:CFBundlePrimaryIcon; some Xcode versions also add it at the top level.
          icon="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "${app}/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "${app}/Info.plist" 2>/dev/null || true)"
          if [ "${icon}" != "AppIcon" ]; then
            echo "::error::the built app has no compiled AppIcon"
            plutil -p "${app}/Info.plist"
            ls "${app}"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations' "${app}/Info.plist" | grep -q 'UIInterfaceOrientationPortrait'
          test -f "${app}/Assets.car"

      - name: Check the tunnel extension links the embedded runtime
        shell: bash
        run: |
          set -euo pipefail
          products=apps/ios/build/Build/Products/Debug-iphonesimulator
          # Debug builds may move code into <name>.debug.dylib, so read every Mach-O next to the executable.
          symbols() {
            local dir="$1" name="$2" out="$3"
            : > "${out}"
            find "${dir}" -maxdepth 1 -type f -name "${name}*" -print0 | while IFS= read -r -d '' file; do
              nm "${file}" >> "${out}" 2>/dev/null || true
            done
          }
          symbols "${products}/NetworkCoreApp.app/PlugIns/NetworkCorePacketTunnel.appex" NetworkCorePacketTunnel "${RUNNER_TEMP}/appex-symbols.txt"
          symbols "${products}/NetworkCoreApp.app" NetworkCoreApp "${RUNNER_TEMP}/app-symbols.txt"
          grep -q '_networkcore_ios_runtime_init$' "${RUNNER_TEMP}/appex-symbols.txt"
          # The app links the runtime library for subscription import, the HTTP delay test and the node checkup.
          grep -q '_networkcore_import_nodes$' "${RUNNER_TEMP}/app-symbols.txt"
          grep -q '_networkcore_ios_measure_delay$' "${RUNNER_TEMP}/app-symbols.txt"
          grep -q '_networkcore_ios_checkup$' "${RUNNER_TEMP}/app-symbols.txt"

      - name: Build the macOS app without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/ios/NetworkCore.xcodeproj \
            -scheme NetworkCoreMac \
            -destination 'generic/platform=macOS' \
            -derivedDataPath apps/ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Check the macOS app bundle and its tunnel extension
        shell: bash
        run: |
          set -euo pipefail
          app="apps/ios/build/Build/Products/Debug/AnixOps Net.app"
          # Developer ID distribution: the tunnel is a System Extension named after its bundle ID.
          tunnel_id=com.example.networkcore.macos.packettunnel
          appex="${app}/Contents/Library/SystemExtensions/${tunnel_id}.systemextension"
          test -f "${app}/Contents/Resources/PrivacyInfo.xcprivacy"
          test -f "${app}/Contents/Resources/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "${app}/Contents/Info.plist" | grep -qx 'AppIcon'
          /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "${appex}/Contents/Info.plist" | grep -qx 'SYSX'
          /usr/libexec/PlistBuddy -c 'Print :NetworkExtension:NEProviderClasses:com.apple.networkextension.packet-tunnel' \
            "${appex}/Contents/Info.plist" | grep -qx 'NetworkCoreMacTunnel.PacketTunnelProvider'
          /usr/libexec/PlistBuddy -c 'Print :NetworkExtension:NEMachServiceName' "${appex}/Contents/Info.plist" \
            | grep -q 'net.anixops.networkcore.tunnel$'
          /usr/libexec/PlistBuddy -c 'Print :NSSystemExtensionUsageDescription' "${appex}/Contents/Info.plist" > /dev/null
          # In-app updates are off unless the release build sets the feed URL and public keys (docs/macos-updates.md).
          /usr/libexec/PlistBuddy -c 'Print :AnixOpsUpdateFeedURL' "${app}/Contents/Info.plist" > /dev/null
          /usr/libexec/PlistBuddy -c 'Print :AnixOpsUpdatePublicKeys' "${app}/Contents/Info.plist" > /dev/null
          test ! -d "${app}/Contents/PlugIns/NetworkCoreMacTunnel.appex"
          test -d "${app}/Contents/Resources/en.lproj"
          symbols() {
            local dir="$1" name="$2" out="$3"
            : > "${out}"
            find "${dir}" -maxdepth 1 -type f -name "${name}*" -print0 | while IFS= read -r -d '' file; do
              nm "${file}" >> "${out}" 2>/dev/null || true
            done
          }
          symbols "${appex}/Contents/MacOS" "${tunnel_id}" "${RUNNER_TEMP}/mac-appex-symbols.txt"
          symbols "${app}/Contents/MacOS" "AnixOps Net" "${RUNNER_TEMP}/mac-app-symbols.txt"
          grep -q '_networkcore_ios_runtime_init$' "${RUNNER_TEMP}/mac-appex-symbols.txt"
          # The app links the runtime library for subscription import, the HTTP delay test and the node checkup.
          grep -q '_networkcore_import_nodes$' "${RUNNER_TEMP}/mac-app-symbols.txt"
          grep -q '_networkcore_ios_measure_delay$' "${RUNNER_TEMP}/mac-app-symbols.txt"
          grep -q '_networkcore_ios_checkup$' "${RUNNER_TEMP}/mac-app-symbols.txt"
          lipo -archs "${appex}/Contents/MacOS/${tunnel_id}" | tee "${RUNNER_TEMP}/mac-archs.txt"
          grep -q arm64 "${RUNNER_TEMP}/mac-archs.txt"

      # The command-line tool ships in the app and must parse, report its version and use the documented exit codes
      # without the app running (docs/macos-cli.md).
      - name: Check the macOS command-line tool
        shell: bash
        run: |
          set -euo pipefail
          app="apps/ios/build/Build/Products/Debug/AnixOps Net.app"
          cli="${app}/Contents/MacOS/anixops"
          test -x "${cli}"
          /usr/libexec/PlistBuddy -c 'Print :AnixOpsAppGroup' "${app}/Contents/Info.plist" | grep -q 'net.anixops.networkcore$'
          "${cli}" --help | grep -q '退出码'
          "${cli}" version | grep -q '^anixops '
          expect() {
            local want="$1"
            shift
            set +e
            "${cli}" "$@" > /dev/null 2>&1
            local got=$?
            set -e
            if [ "${got}" -ne "${want}" ]; then
              echo "::error::anixops $*: expected exit code ${want}, got ${got}"
              exit 1
            fi
          }
          expect 64 frobnicate
          expect 64 mode fast
          expect 64
          expect 66 import /nonexistent/nodes.txt
          # Nothing listens on this socket: the app is "not running", and status never launches the app.
          expect 69 status --socket "${RUNNER_TEMP}/none.sock"
          expect 69 nodes --socket "${RUNNER_TEMP}/none.sock"

      # The MCP program for AI tools ships in the app (docs/mcp-desktop.md). Without the app running it must still
      # answer the MCP handshake and list its tools, and report the app as not running from every tool call.
      - name: Check the macOS MCP program
        shell: bash
        run: |
          set -euo pipefail
          app="apps/ios/build/Build/Products/Debug/AnixOps Net.app"
          mcp="${app}/Contents/MacOS/anixops-mcp"
          test -x "${mcp}"
          lipo -archs "${mcp}" | tee "${RUNNER_TEMP}/mcp-archs.txt"
          grep -q arm64 "${RUNNER_TEMP}/mcp-archs.txt"
          grep -q x86_64 "${RUNNER_TEMP}/mcp-archs.txt"
          "${mcp}" --version | grep -q '^anixops-mcp '
          set +e
          "${mcp}" --frobnicate > /dev/null 2>&1
          code=$?
          set -e
          test "${code}" -eq 64
          # The socket is found through the app's Info.plist, as an AI tool would start it.
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_status","arguments":{}}}' \
            | "${mcp}" > "${RUNNER_TEMP}/mcp-out.jsonl"
          python3 - "${RUNNER_TEMP}/mcp-out.jsonl" crates/client-mcp/tools.json <<'PY'
          import json, sys
          answers = {}
          for line in open(sys.argv[1], encoding="utf-8"):
              message = json.loads(line)
              answers[message["id"]] = message
          assert sorted(answers) == [1, 2, 3], answers
          assert answers[1]["result"]["protocolVersion"] == "2025-06-18", answers[1]
          listed = {tool["name"] for tool in answers[2]["result"]["tools"]}
          expected = {tool["name"] for tool in json.load(open(sys.argv[2], encoding="utf-8"))}
          assert listed == expected, (listed, expected)
          status = answers[3]["result"]
          assert status["isError"] is True, status
          assert "not running" in status["content"][0]["text"], status
          PY

      # The screenshots, UI tests and accessibility audits run in the jobs below, side by side on their own machines,
      # from these products: the apps, the UI test bundles and their .xctestrun files.
      - name: Pack the built products
        shell: bash
        run: tar -C apps/ios/build/Build -czf "${RUNNER_TEMP}/apple-products.tgz" Products

      - name: Upload the built products
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-products-${{ github.sha }}
          path: ${{ runner.temp }}/apple-products.tgz
          retention-days: 1

      # The builds above are Debug; TestFlight and notarized releases archive Release, where `#if DEBUG` code (the
      # screenshot demo, `TunnelController.isDemo`) does not exist. Compile both apps in the Release configuration so
      # a reference to debug-only code fails here and not in the release workflow. Unoptimized and for the active
      # architecture only: this checks what compiles, not the optimizer, and keeps the extra time small.
      - name: Compile the iOS and macOS apps in the Release configuration
        shell: bash
        run: |
          set -euo pipefail
          for target in "NetworkCoreApp|generic/platform=iOS Simulator" "NetworkCoreMac|generic/platform=macOS"; do
            xcodebuild \
              -project apps/ios/NetworkCore.xcodeproj \
              -scheme "${target%%|*}" \
              -configuration Release \
              -destination "${target#*|}" \
              -derivedDataPath apps/ios/build-release \
              CODE_SIGNING_ALLOWED=NO \
              ONLY_ACTIVE_ARCH=YES \
              SWIFT_OPTIMIZATION_LEVEL=-Onone \
              SWIFT_COMPILATION_MODE=incremental \
              build
          done

  apple-mac:
    name: macOS screenshots, UI tests and accessibility audit
    runs-on: macos-26
    timeout-minutes: 45
    # Reads main's screenshot artifacts and the pull request description for the screenshot comparison.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    needs: [changes, ios-xcode-build]
    if: ${{ needs.changes.outputs.apple == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the built products
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apple-products-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Unpack the built products
        shell: bash
        run: |
          mkdir -p apps/ios/build/Build
          tar -C apps/ios/build/Build -xzf "${RUNNER_TEMP}/apple-products.tgz"

      # The unsigned debug build opens with made-up data (`-AnixOpsDemo YES`), so the pictures need no account,
      # no certificate and no tunnel. A machine without a screen session must not fail the build.
      - name: Take macOS screenshots with demo data
        continue-on-error: true
        shell: bash
        run: .github/scripts/mac-screenshots.sh "apps/ios/build/Build/Products/Debug/AnixOps Net.app" "${RUNNER_TEMP}/mac-screenshots"

      # The entry checks of docs/ui-ux.md (入口不变量) on the Mac app: the sidebar's connection switch on every page
      # of both modes, and a failure on the page the user is on. A failure here fails the build.
      - name: Run the macOS UI tests
        shell: bash
        run: .github/scripts/mac-ui-tests.sh "apps/ios/build/Build/Products/Debug/AnixOps Net.app" apps/ios/build/Build/Products "${RUNNER_TEMP}/mac-ui-tests.xcresult"

      - name: Upload the macOS UI test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-ui-tests-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mac-ui-tests.xcresult
            ${{ runner.temp }}/mac-ui-tests-attachments
          if-no-files-found: ignore
          retention-days: 3

      # A pull request's pictures are compared with main's, shot by shot; a change the description does not
      # acknowledge on a "界面变化：" line fails the job (docs/ui-ux.md). The demo data has a fixed clock, so two
      # runs of the same code give the same pixels.
      - name: Compare the macOS screenshots with main
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/screenshot-compare.sh "${RUNNER_TEMP}/mac-screenshots" "${RUNNER_TEMP}/mac-screenshot-compare" mac macOS

      # Main's pictures are the baseline later pull requests compare with, so they are kept longer.
      - name: Upload the macOS screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/mac-screenshots
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'push' && 30 || 3 }}

      - name: Upload the macOS screenshot comparison
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-screenshot-report-${{ github.sha }}
          path: ${{ runner.temp }}/mac-screenshot-compare/report
          if-no-files-found: ignore
          retention-days: 3

  apple-ios-screenshots:
    name: iOS screenshots
    runs-on: macos-26
    timeout-minutes: 30
    # Reads main's screenshot artifacts and the pull request description for the screenshot comparison.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    needs: [changes, ios-xcode-build]
    if: ${{ needs.changes.outputs.apple == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the built products
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apple-products-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Unpack the built products
        shell: bash
        run: |
          mkdir -p apps/ios/build/Build
          tar -C apps/ios/build/Build -xzf "${RUNNER_TEMP}/apple-products.tgz"

      # The same for the iPhone app, in a simulator made for this run: demo data, a fixed status bar, one picture
      # per tab. A machine that cannot boot a simulator must not fail the build.
      - name: Take iOS screenshots with demo data
        continue-on-error: true
        shell: bash
        run: .github/scripts/ios-screenshots.sh apps/ios/build/Build/Products/Debug-iphonesimulator/NetworkCoreApp.app "${RUNNER_TEMP}/ios-screenshots"

      - name: Compare the iOS screenshots with main
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/screenshot-compare.sh "${RUNNER_TEMP}/ios-screenshots" "${RUNNER_TEMP}/ios-screenshot-compare" ios iOS

      - name: Upload the iOS screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/ios-screenshots
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'push' && 30 || 3 }}

      - name: Upload the iOS screenshot comparison
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screenshot-report-${{ github.sha }}
          path: ${{ runner.temp }}/ios-screenshot-compare/report
          if-no-files-found: ignore
          retention-days: 3

  apple-ios-tests:
    name: iOS UI tests (${{ matrix.part }})
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: entry
            tests: NetworkCoreAppUITests/EntryInvariantTests
    needs: [changes, ios-xcode-build]
    if: ${{ needs.changes.outputs.apple == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the built products
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apple-products-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Unpack the built products
        shell: bash
        run: |
          mkdir -p apps/ios/build/Build
          tar -C apps/ios/build/Build -xzf "${RUNNER_TEMP}/apple-products.tgz"

      # One part of the iPhone app's UI tests per machine: the entry checks of docs/ui-ux.md (入口不变量: the
      # connection switch where each mode needs it, exactly once, and a failure on the page the user is on).
      # Xcode's accessibility audit joins as more parts once its first findings are fixed (docs/ui-ux.md, 第二层).
      # A failure here fails the build.
      - name: Run the iOS UI tests
        shell: bash
        run: .github/scripts/ios-ui-tests.sh apps/ios/build/Build/Products/Debug-iphonesimulator/NetworkCoreApp.app apps/ios/build/Build/Products "${RUNNER_TEMP}/ios-ui-tests.xcresult" ${{ matrix.tests }}

      - name: Upload the iOS UI test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ui-tests-${{ matrix.part }}-${{ github.sha }}
          path: ${{ runner.temp }}/ios-ui-tests.xcresult
          if-no-files-found: ignore
          retention-days: 3

  # The native Android app (apps/android-native, docs/architecture/android-native-compose.md): the Rust bridge
  # built for arm64 by cargo-ndk, then Gradle runs lint (warnings are errors), the unit tests (the Kotlin side of
  # the command bridge against the shared fixtures) and the Roborazzi screenshots. The screenshots are recorded
  # again and must equal the committed ones; when they differ the job fails and uploads the new images. The APK
  # (io.anixops.net.android) is always signed with a throwaway debug key made for this run (file name *-debug.apk):
  # it cannot be installed over a release build. Only release.yml signs with the release key.
  android-native:
    name: Android native app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    needs: changes
    if: ${{ needs.changes.outputs.android_native == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Lint (warnings are errors), the unit tests and the screenshots run in the same Gradle call as the release
      # build. The APK is signed with a throwaway key made for this run: the release signing key lives only in the
      # android-release environment, which only release.yml's tag releases enter (workflow_policy.py checks that
      # no other job names it), so pull requests and branch runs never receive it.
      - name: Lint, unit tests, screenshots and the APK
        id: apk
        uses: ./.github/actions/android-apk
        with:
          checks: lint testDebugUnitTest :app:recordRoborazziDebug
          # The Google Play bundle is built too (left unsigned here: the upload key lives in the google-play
          # environment, used only by play-bundle.yml).
          bundle: "true"
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Screenshots match the committed baselines
        id: screenshots
        run: |
          set -euo pipefail
          changed="$(git status --porcelain -- apps/android-native/app/src/test/screenshots)"
          if [ -n "${changed}" ]; then
            echo "${changed}"
            echo "::error::screenshots differ from apps/android-native/app/src/test/screenshots; check the uploaded images and commit them if the change is intended"
            exit 1
          fi

      - name: Upload the screenshots
        if: ${{ failure() && steps.screenshots.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-native-screenshots-${{ github.sha }}
          path: apps/android-native/app/src/test/screenshots
          retention-days: 3

      - name: Upload the lint and test reports
        if: ${{ failure() && steps.screenshots.outcome != 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-native-reports-${{ github.sha }}
          path: |
            apps/android-native/*/build/reports
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anixops-net-android-${{ github.sha }}
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 3

  # The native Windows app (apps/windows-native, WinUI 3 and C#): the channel library (its tests read the same
  # message samples as the Rust side), what the app shows, and the app itself, also against the real core
  # service (apps/windows-service), which is built here in release mode so that what is measured is what ships.
  windows-native:
    name: Windows native app
    runs-on: windows-latest
    timeout-minutes: 75
    needs:
      - changes
    if: ${{ needs.changes.outputs.windows_native == 'true' }}
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same Rust toolchain as the "Windows Rust workspace" job, for the service.
      - name: Setup Windows C toolchain
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libsystre

      - name: Configure Windows Rust GNU target
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $MsysRoot = "${{ steps.msys2.outputs.msys2-location }}"
          $MingwPrefix = Join-Path $MsysRoot "mingw64"
          "${{ github.workspace }}\.github\scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$MingwPrefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "MSYS2_LOCATION=$MsysRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MINGW_PREFIX=$MingwPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RC_x86_64_pc_windows_gnu=${{ github.workspace }}\.github\scripts\rc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_BUILD_TARGET=x86_64-pc-windows-gnu" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_x86_64_pc_windows_gnu=$MingwPrefix\bin\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AR_x86_64_pc_windows_gnu=$MingwPrefix\bin\ar.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$MingwPrefix\bin\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-gnu

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-gnu-service-release
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Restore windres compatibility shim
        id: windres-shim-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .github/scripts/windres.exe
            .github/scripts/rc.exe
          key: windres-shim-${{ runner.os }}-${{ hashFiles('.github/scripts/windres_compat.rs', '.github/scripts/rc_compat.rs') }}

      - name: Build windres compatibility shim
        if: steps.windres-shim-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustc .github/scripts/windres_compat.rs -o .github/scripts/windres.exe
          rustc .github/scripts/rc_compat.rs -o .github/scripts/rc.exe

      - name: Build the core service
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --locked --release -p anixops-net-service
          if ($LASTEXITCODE -ne 0) { throw "the service did not build" }
          $exe = Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-gnu\release\anixops-net-service.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built" }
          "ANIXOPS_NET_SERVICE_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # The MCP program for AI tools (docs/mcp-desktop.md), installed beside the service.
          cargo build --locked --release -p client-mcp --bin anixops-mcp
          if ($LASTEXITCODE -ne 0) { throw "anixops-mcp did not build" }
          $mcp = Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-gnu\release\anixops-mcp.exe"
          if (-not (Test-Path $mcp)) { throw "$mcp was not built" }
          "ANIXOPS_NET_MCP_EXE=$mcp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # TUN mode: the service loads wintun.dll from its own folder, here as in the installation.
          $wintunDir = Join-Path $env:RUNNER_TEMP "native-wintun"
          $wintun = & .github/scripts/fetch-wintun.ps1 -Destination $wintunDir
          Copy-Item -Path $wintun -Destination (Join-Path (Split-Path $exe) "wintun.dll") -Force
          "ANIXOPS_NET_WINTUN_DIR=$wintunDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build apps/windows-native/AnixOps.Net.slnx --configuration Release

      # The UI tests start the built app on the runner's desktop and drive it through UI Automation; they
      # save a picture of every page in both languages and both themes.
      - name: Test
        env:
          ANIXOPS_NET_SCREENSHOTS: ${{ runner.temp }}\windows-native-screenshots
        run: dotnet test apps/windows-native/AnixOps.Net.slnx --configuration Release --no-build --logger "console;verbosity=normal"

      # What the request list measured about itself with 50,000 rows (the test above holds it to the limits).
      - name: Show the request list measurement
        if: ${{ always() }}
        shell: pwsh
        run: |
          $file = Join-Path $env:RUNNER_TEMP "windows-native-screenshots\requests-measurement.json"
          if (Test-Path $file) { Get-Content $file } else { Write-Host "no measurement was written" }

      # Pass mark 3, TUN part: the service (the window has no rights for it) makes the Wintun adapter, the
      # machine's traffic leaves through it and arrives, and disconnecting leaves no adapter. A step of
      # its own because it changes this machine's routes for a few seconds.
      - name: TUN mode through the service
        env:
          ANIXOPS_NET_TUN_TESTS: "1"
        run: dotnet test apps/windows-native/tests/AnixOps.Net.Session.Tests/AnixOps.Net.Session.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~TunModeTests" --logger "console;verbosity=normal"

      # Pass mark 3, HTTPS decryption part: the root is trusted in the user's own store (no administrator
      # rights), Windows accepts it, and what the removal does takes the trust away. A step of its own
      # because Windows may show its confirmation on the desktop, which the test then answers.
      - name: Root certificate in the user's store
        env:
          ANIXOPS_NET_ROOT_TESTS: "1"
          ANIXOPS_NET_SCREENSHOTS: ${{ runner.temp }}\windows-native-screenshots
        run: dotnet test apps/windows-native/tests/AnixOps.Net.App.UiTests/AnixOps.Net.App.UiTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~RootStoreTests" --logger "console;verbosity=normal"

      # Whether Windows asked for confirmation on this machine (it does on a person's desktop).
      - name: Show whether Windows asked before trusting the root
        if: ${{ always() }}
        shell: pwsh
        run: |
          $file = Join-Path $env:RUNNER_TEMP "windows-native-screenshots\root-confirmation.txt"
          if (Test-Path $file) { Get-Content $file } else { Write-Host "nothing was noted" }

      # The installer: the window published with its runtime, and the service. Two versions of the same
      # files, so that an upgrade can be tested.
      - name: Build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = Join-Path $env:RUNNER_TEMP "native-app"
          dotnet publish apps/windows-native/src/AnixOps.Net.App/AnixOps.Net.App.csproj --configuration Release --runtime win-x64 --self-contained true --output $app
          if ($LASTEXITCODE -ne 0) { throw "the window was not published" }
          if (-not (Test-Path (Join-Path $app "AnixOpsNet.exe"))) { throw "the published window has no AnixOpsNet.exe" }
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "WiX was not installed" }
          wix extension add -g WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw "the WiX utility extension was not installed" }
          $out = Join-Path $env:RUNNER_TEMP "native-msi"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($version in @("0.3.0", "0.3.1")) {
            wix build installer/windows-native/Package.wxs `
              -arch x64 `
              -ext WixToolset.Util.wixext `
              -d "ProductVersion=$version" `
              -d "AppDir=$app" `
              -d "ServiceExe=$env:ANIXOPS_NET_SERVICE_EXE" `
              -d "McpExe=$env:ANIXOPS_NET_MCP_EXE" `
              -d "WintunDir=$env:ANIXOPS_NET_WINTUN_DIR" `
              -o (Join-Path $out "anixops-net-$version.msi")
            if ($LASTEXITCODE -ne 0) { throw "the installer $version was not built" }
          }
          # ICE03 is left out: it rejects the language lists in the version resources of some of the .NET
          # and Windows App SDK libraries, which are Microsoft's files and installed as they are.
          wix msi validate -sice ICE03 (Join-Path $out "anixops-net-0.3.0.msi")
          if ($LASTEXITCODE -ne 0) { throw "the installer did not pass validation" }
          & .github/scripts/check-windows-icons.ps1 -Msi (Join-Path $out "anixops-net-0.3.0.msi") -Exe @((Join-Path $app "AnixOpsNet.exe"))
          $size = (Get-Item (Join-Path $out "anixops-net-0.3.0.msi")).Length
          Write-Host ("installer size: {0:N1} MB" -f ($size / 1MB))

      # Pass mark 3: install, upgrade with the window open, TUN mode through the installed service, its root
      # trusted in the user's store, remove with the window open; after removal no service, process, file,
      # shortcut, login entry, network adapter, driver or trusted root is left.
      - name: Install, upgrade and remove
        shell: pwsh
        env:
          ANIXOPS_NET_SCREENSHOTS: ${{ runner.temp }}\windows-native-screenshots
        run: |
          $out = Join-Path $env:RUNNER_TEMP "native-msi"
          .github/scripts/native-msi-lifecycle.ps1 `
            -First (Join-Path $out "anixops-net-0.3.0.msi") `
            -Second (Join-Path $out "anixops-net-0.3.1.msi") `
            -SecondVersion "0.3.1" `
            -TestProject apps/windows-native/tests/AnixOps.Net.App.UiTests/AnixOps.Net.App.UiTests.csproj `
            -SessionTestProject apps/windows-native/tests/AnixOps.Net.Session.Tests/AnixOps.Net.Session.Tests.csproj

      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native-screenshots-${{ github.sha }}
          path: ${{ runner.temp }}\windows-native-screenshots
          if-no-files-found: warn
          retention-days: 3

  # The native Linux window (apps/linux-native, GTK 4 and libadwaita): built and linted with the `gui` feature,
  # then started for real under Xvfb: it draws every page in every language and theme into PNG files, a
  # script walks and operates it through AT-SPI the way a screen reader does, and it is run against the real
  # daemon (apps/linux-daemon), which is why changes to the daemon run this job too.
  linux-native:
    name: Linux native app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
    needs: changes
    if: ${{ needs.changes.outputs.linux_native == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Build: the GTK 4 and libadwaita development files. Run: a display, a session bus, the accessibility
      # bus and its Python bindings, the icon theme the sidebar's icons come from, and a font with Chinese.
      - name: Install GTK 4, libadwaita and the test tools
        shell: bash
        run: |
          bash .github/scripts/apt-install.sh libgtk-4-dev libadwaita-1-dev xvfb xauth dbus at-spi2-core \
            gir1.2-atspi-2.0 python3-gi adwaita-icon-theme fonts-noto-cjk
          echo "GTK $(pkg-config --modversion gtk4), libadwaita $(pkg-config --modversion libadwaita-1)"

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux-native
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Lint, test and build the window
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p anixops-net-native --features gui --all-targets -- -D warnings
          cargo test --locked -p anixops-net-native --features gui
          cargo build --locked -p anixops-net-native --features gui --release
          test -x target/release/anixops-net

      # The window links no engine: it talks to the daemon. Keeps that from slipping back in.
      - name: The window has no engine in it
        shell: bash
        run: |
          set -euo pipefail
          tree=$(cargo tree --locked -p anixops-net-native --features gui --edges normal --prefix none)
          for crate in client-core engine-embedded; do
            if grep -q "^${crate} " <<<"${tree}"; then
              echo "::error::anixops-net-native depends on ${crate}; the engine belongs to the daemon"
              exit 1
            fi
          done
          grep -q "^client-window " <<<"${tree}"

      - name: Build the daemon the window talks to
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p anixops-netd --release
          test -x target/release/anixops-netd

      - name: Screenshots of every page, language and theme
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a --server-args="-screen 0 2400x1600x24" dbus-run-session -- \
            .github/scripts/linux-native-screenshots.sh target/release/anixops-net \
            "${RUNNER_TEMP}/linux-native-screenshots"

      # The last part runs the window against the real daemon: not running, found, connected and disconnected
      # with the overview's button, stopped, found again.
      - name: The window through the accessibility interface, alone and with the daemon
        shell: bash
        env:
          GSK_RENDERER: cairo
        run: |
          set -euo pipefail
          # The daemon only answers users who are signed in at the machine (a login record or a runtime
          # folder). A runner's job is not a login session, so the runtime folder is made here as the login
          # manager would have made it.
          uid=$(id -u)
          if [[ ! -e "/run/systemd/users/${uid}" && ! -e "/run/user/${uid}" ]]; then
            sudo install -d -m 0700 -o "${uid}" "/run/user/${uid}"
          fi
          xvfb-run -a --server-args="-screen 0 1280x800x24" dbus-run-session -- \
            python3 .github/scripts/linux-native-a11y.py target/release/anixops-net \
            crates/client-strings/catalogue.json target/release/anixops-netd \
            "${RUNNER_TEMP}/linux-native-screenshots"

      # The MCP program for AI tools against the same daemon (docs/mcp-desktop.md §9): off until a window turns
      # it on, the state and nodes without addresses, no window command reached, "not running" once it stops.
      - name: anixops-mcp against the daemon
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p client-mcp --bin anixops-mcp --release
          python3 .github/scripts/linux-mcp-e2e.py target/release/anixops-netd target/release/anixops-mcp

      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-native-screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/linux-native-screenshots
          if-no-files-found: warn
          retention-days: 3

  # The native app on an x86_64 emulator: libanixops_net.so loads, the Rust client opens and each page shows
  # what it answers (app/src/androidTest). Only for the emulator; the APK stays arm64.
  android-native-smoke:
    name: Android native emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    needs: changes
    if: ${{ needs.changes.outputs.android_native == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-linux-android

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android-native-x86_64
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - name: Build the Rust bridge for the emulator
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME}"
          export BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android="--target=x86_64-linux-android26 --sysroot=${ndk}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export ANDROID_NDK_HOME="${ndk}"
          cargo ndk -t x86_64 --platform 26 -o apps/android-native/app/src/main/jniLibs \
            build --release --locked -p anixops-net-android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.14.3"
          cache-read-only: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

      - name: Build the app and its smoke test
        run: gradle -p apps/android-native --no-daemon -Panixops.abis=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle -p apps/android-native --no-daemon -Panixops.abis=x86_64 :app:connectedDebugAndroidTest

      - name: Upload the smoke test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-native-smoke-${{ github.sha }}
          path: apps/android-native/app/build/reports/androidTests
          if-no-files-found: ignore
          retention-days: 3

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - changes
      - rust-deps
      - third-party-notices
      - rust-linux
      - android-native
      - android-native-smoke
      - windows
      - windows-native
      - linux-native
      - swift
      - ios-xcode-build
      - apple-mac
      - apple-ios-screenshots
      - apple-ios-tests
    steps:
      - name: Check required jobs
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${RESULTS}" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"' | tee "${RUNNER_TEMP}/results.txt"
          if grep -Eq '=(failure|cancelled)$' "${RUNNER_TEMP}/results.txt"; then
            echo "::error::one or more CI jobs failed or were cancelled"
            exit 1
          fi
