# XcodeGen spec for the NetworkCore iOS app.
#
# The generated NetworkCore.xcodeproj is produced in GitHub Actions and is never committed.
# This spec is the source of truth for the Xcode project, as the source-tree contract requires.
# Bundle identifiers are placeholders. Real values come from GitHub variables in the upload gate.
name: NetworkCore

options:
  bundleIdPrefix: com.example.networkcore
  # Chinese is the source language; Sources/NetworkCoreApp/Resources/Localizable.xcstrings adds English. A language
  # the app is not translated into reads English, as on every client (docs/ui-ux.md, 界面语言): each bundle with
  # interface text sets CFBundleDevelopmentRegion to en, the localization the system falls back to.
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  NetworkCoreIOS:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "1"

targets:
  NetworkCoreApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/NetworkCoreApp
      - path: Sources/NetworkCoreAppHost
      - path: Sources/NetworkCoreShared
    info:
      path: Generated/NetworkCoreApp-Info.plist
      properties:
        CFBundleDisplayName: AnixOps Net
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # anixops:// links: connect, disconnect, toggle, mode, select and import (NetworkCoreBridge/AppURLCommand.swift).
        CFBundleURLTypes:
          - CFBundleURLName: net.anixops.net
            CFBundleURLSchemes:
              - anixops
        # Scanning node and subscription QR codes in the import sheet; nothing is recorded or uploaded. English is the
        # fallback; Sources/NetworkCoreApp/Resources/InfoPlist.xcstrings has the Chinese.
        NSCameraUsageDescription: The camera scans node and subscription QR codes. Nothing is recorded or uploaded.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad takes every orientation, which Split View and Stage Manager require.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Non-exempt: the bundled runtime implements its own standard encryption (TLS, AEAD ciphers, WireGuard) for
        # the tunnel, beyond Apple's system encryption (docs/manual-intervention.md, 出口合规).
        ITSAppUsesNonExemptEncryption: true
        # The connection's Live Activity on the Lock Screen and in the Dynamic Island (LiveActivityController).
        NSSupportsLiveActivities: true
        # Subscription groups update in the background (TunnelController.scheduleBackgroundRefresh).
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - net.anixops.subscriptions.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.networkcore.ios
        # Not the XcodeGen `entitlements:` key: without `properties` it rewrites the committed file as an empty plist.
        CODE_SIGN_ENTITLEMENTS: Entitlements/NetworkCoreApp.entitlements
        # iPhone and iPad; on a regular-width iPad window RootView shows a sidebar instead of tabs.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: NetworkCoreIOS
        product: NetworkCoreIOS
      - target: NetworkCorePacketTunnel
        embed: true
      # The TestFlight workflow drops this target when no widget provisioning profile is configured.
      - target: NetworkCoreWidget
        embed: true
      # The Rust runtime (crates/engine-embedded, which includes crates/node-import): the app uses it for
      # subscription import and the HTTP delay test, never to run the tunnel.
      - framework: Generated/NetworkCoreRuntime.xcframework
        embed: false

  # The entry checks of docs/ui-ux.md (入口不变量), run by CI on a simulator against the demo data.
  NetworkCoreAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/NetworkCoreApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.networkcore.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    # No target application: xcodebuild sometimes failed to resolve the host app's path ("The bundle identifier
    # for NetworkCoreApp couldn't be read"). The app built earlier in CI is installed by the script and the tests
    # launch it by bundle identifier or path.

  NetworkCorePacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/NetworkCorePacketTunnel
      # The connection-stopped notification is localized like the app.
      - path: Sources/NetworkCoreApp/Resources/Localizable.xcstrings
    info:
      path: Generated/NetworkCorePacketTunnel-Info.plist
      properties:
        CFBundleDisplayName: AnixOps Net Tunnel
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Non-exempt: the bundled runtime implements its own standard encryption (TLS, AEAD ciphers, WireGuard) for
        # the tunnel, beyond Apple's system encryption (docs/manual-intervention.md, 出口合规).
        ITSAppUsesNonExemptEncryption: true
        # Team prefix of the extension-only keychain group `networkcore.tunnel-private` (MeshKeyStore).
        AnixOpsKeychainPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.networkcore.ios.packettunnel
        CODE_SIGN_ENTITLEMENTS: Entitlements/NetworkCorePacketTunnel.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: NetworkCoreIOS
        product: NetworkCoreIOS
      # Static Rust runtime (crates/engine-embedded), built in GitHub Actions by
      # .github/scripts/build-ios-runtime-xcframework.sh. Only the extension links it.
      - framework: Generated/NetworkCoreRuntime.xcframework
        embed: false
      - sdk: Security.framework

  # Home Screen / Lock Screen status widget and the iOS 18 Control Center switch. It reads the saved VPN
  # configuration itself (status, node name, protocol), so it carries the same Network Extension entitlement.
  NetworkCoreWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/NetworkCoreWidget
      - path: Sources/NetworkCoreShared
      - path: Sources/NetworkCoreAppHost/BrandPalette.swift
      - path: Sources/NetworkCoreAppHost/BrandTokens.swift
      - path: Sources/NetworkCoreAppHost/RouteLine.swift
      - path: Sources/NetworkCoreApp/Resources/Localizable.xcstrings
    info:
      path: Generated/NetworkCoreWidget-Info.plist
      properties:
        CFBundleDisplayName: AnixOps Net
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.networkcore.ios.widget
        CODE_SIGN_ENTITLEMENTS: Entitlements/NetworkCoreWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: NetworkCoreIOS
        product: NetworkCoreIOS

  # The macOS app: the same tunnel controller, import flow and brand views as iOS, with a sidebar window and a
  # menu bar item. Distributed outside the Mac App Store with a Developer ID signature and notarization, so the
  # Network Extension ships as a System Extension (Contents/Library/SystemExtensions) that the app activates
  # (SystemExtensionActivation) and the user allows in System Settings.
  NetworkCoreMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/NetworkCoreMac
      - path: Sources/NetworkCoreApp
        excludes:
          - "Resources/**"
      - path: Sources/NetworkCoreApp/Resources/Localizable.xcstrings
      - path: Sources/NetworkCoreApp/Resources/PrivacyInfo.xcprivacy
      - path: Sources/NetworkCoreAppHost/AppModeViews.swift
      - path: Sources/NetworkCoreAppHost/BrandPalette.swift
      - path: Sources/NetworkCoreAppHost/BrandTokens.swift
      - path: Sources/NetworkCoreAppHost/ClientHealthMonitor.swift
      - path: Sources/NetworkCoreAppHost/ClientReporter.swift
      - path: Sources/NetworkCoreAppHost/CaptureRequestsView.swift
      - path: Sources/NetworkCoreAppHost/CaptureSessionsView.swift
      - path: Sources/NetworkCoreAppHost/CaptureBodyDecoder.swift
      - path: Sources/NetworkCoreAppHost/CaptureStreamViews.swift
      - path: Sources/NetworkCoreAppHost/CaptureViews.swift
      - path: Sources/NetworkCoreAppHost/ConnectionsView.swift
      - path: Sources/NetworkCoreAppHost/DashboardCards.swift
      - path: Sources/NetworkCoreAppHost/DashboardModel.swift
      - path: Sources/NetworkCoreAppHost/DnsSettingsView.swift
      - path: Sources/NetworkCoreAppHost/ExchangeInspector.swift
      - path: Sources/NetworkCoreAppHost/ImportView.swift
      - path: Sources/NetworkCoreAppHost/MappingsViews.swift
      - path: Sources/NetworkCoreAppHost/MeshModel.swift
      - path: Sources/NetworkCoreAppHost/MeshNetworkSheet.swift
      - path: Sources/NetworkCoreAppHost/MeshPathSheet.swift
      - path: Sources/NetworkCoreAppHost/MeshViews.swift
      - path: Sources/NetworkCoreAppHost/MitmPluginInspector.swift
      - path: Sources/NetworkCoreAppHost/MitmTrustPresentation.swift
      - path: Sources/NetworkCoreAppHost/PluginsView.swift
      - path: Sources/NetworkCoreAppHost/ProxyModeText.swift
      - path: Sources/NetworkCoreAppHost/ReplayView.swift
      - path: Sources/NetworkCoreAppHost/RouteLine.swift
      - path: Sources/NetworkCoreAppHost/TermsConsentView.swift
      - path: Sources/NetworkCoreAppHost/RuleSetsView.swift
      - path: Sources/NetworkCoreAppHost/RuleTextEditor.swift
      - path: Sources/NetworkCoreAppHost/RuleToolsView.swift
      - path: Sources/NetworkCoreAppHost/TunnelController.swift
      - path: Sources/NetworkCoreAppHost/TunnelController+CaptureCopies.swift
      - path: Sources/NetworkCoreAppHost/CaptureViewer.swift
      - path: Sources/NetworkCoreAppHost/URLCommandHandler.swift
      - path: Sources/NetworkCoreAppHost/AppNotifications.swift
      - path: Sources/NetworkCoreAppHost/BlockQuicSection.swift
      - path: Sources/NetworkCoreAppHost/TakeoverSection.swift
      - path: Sources/NetworkCoreAppHost/DiagnosticEventsView.swift
      - path: Sources/NetworkCoreAppHost/NativeNodeImporterFFI.swift
      - path: Sources/NetworkCoreAppHost/NodeDelayFFI.swift
      - path: Sources/NetworkCoreAppHost/NodeCheckupFFI.swift
      - path: Sources/NetworkCoreAppHost/NodeCheckupSheet.swift
      - path: Sources/NetworkCoreAppHost/NodeEditSheet.swift
      - path: Sources/NetworkCoreAppHost/OnDemandSettingsView.swift
      - path: Sources/NetworkCoreAppHost/SettingsSubpages.swift
      - path: Sources/NetworkCoreAppHost/SubscriptionGroupViews.swift
      - path: Sources/NetworkCoreAppHost/TrafficStatsView.swift
    info:
      path: Generated/NetworkCoreMac-Info.plist
      properties:
        CFBundleDisplayName: AnixOps Net
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        # anixops:// links, the same six actions as on iOS (NetworkCoreBridge/AppURLCommand.swift).
        CFBundleURLTypes:
          - CFBundleURLName: net.anixops.net
            CFBundleURLSchemes:
              - anixops
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Non-exempt: the bundled runtime implements its own standard encryption (TLS, AEAD ciphers, WireGuard) for
        # the tunnel, beyond Apple's system encryption (docs/manual-intervention.md, 出口合规).
        ITSAppUsesNonExemptEncryption: true
        # In-app updates (Sources/NetworkCoreMac/AppUpdater.swift, docs/macos-updates.md): the HTTPS feed URL and the
        # base64 Ed25519 public keys, comma separated. Empty in every build but the release build, which turns
        # updates off.
        AnixOpsUpdateFeedURL: $(ANIXOPS_UPDATE_FEED_URL)
        AnixOpsUpdatePublicKeys: $(ANIXOPS_UPDATE_PUBLIC_KEYS)
        # The app group whose container holds the command-line socket (MacControlService, docs/macos-cli.md).
        AnixOpsAppGroup: $(TeamIdentifierPrefix)net.anixops.networkcore
    settings:
      base:
        ANIXOPS_UPDATE_FEED_URL: ""
        ANIXOPS_UPDATE_PUBLIC_KEYS: ""
        PRODUCT_NAME: AnixOps Net
        PRODUCT_MODULE_NAME: NetworkCoreMac
        # The tunnel's bundle ID (com.example.networkcore.macos.packettunnel) starts with this one.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.networkcore.macos
        CODE_SIGN_ENTITLEMENTS: Entitlements/NetworkCoreMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    # anixops-mcp, the MCP program for AI tools (docs/mcp-desktop.md), at Contents/MacOS/anixops-mcp. It is built by
    # .github/scripts/build-macos-mcp.sh with Cargo, so a script copies and signs it instead of a target dependency.
    postBuildScripts:
      - name: Embed anixops-mcp
        script: bash "${SRCROOT}/Tools/embed-mcp.sh"
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/Generated/anixops-mcp
          - $(SRCROOT)/Tools/embed-mcp.sh
          - $(SRCROOT)/Entitlements/NetworkCoreCLI.entitlements
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/anixops-mcp
    dependencies:
      - package: NetworkCoreIOS
        product: NetworkCoreIOS
      - target: NetworkCoreMacTunnel
        embed: true
      # The `anixops` command-line tool, at Contents/MacOS/anixops.
      - target: NetworkCoreCLI
        embed: true
        copy:
          destination: executables
      # The macOS slice of the runtime, for subscription import and the HTTP delay test; the tunnel runs in the extension.
      - framework: Generated/NetworkCoreRuntime.xcframework
        embed: false

  # The packet tunnel for macOS: the same provider sources as iOS, linked with the macOS slice of the runtime, run as
  # a System Extension (Sources/NetworkCoreMacTunnel/main.swift). It runs as root and cannot read the user's
  # Keychain, so the app hands the node key, node library and MITM root over at start (TunnelStartSecrets).
  # Its bundle ID must start with the app's, and macOS requires the bundle to be named after its bundle ID.
  # The macOS entry checks of docs/ui-ux.md (入口不变量), run by CI against the demo data.
  NetworkCoreMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests/NetworkCoreMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.networkcore.macos.uitests
        GENERATE_INFOPLIST_FILE: YES
    # No target application: xcodebuild sometimes failed to resolve the host app's path ("The bundle identifier
    # for NetworkCoreApp couldn't be read"). The app built earlier in CI is installed by the script and the tests
    # launch it by bundle identifier or path.

  NetworkCoreMacTunnel:
    type: system-extension
    platform: macOS
    sources:
      - path: Sources/NetworkCorePacketTunnel
      - path: Sources/NetworkCoreMacTunnel
    info:
      path: Generated/NetworkCoreMacTunnel-Info.plist
      properties:
        CFBundleDisplayName: AnixOps Net Tunnel
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Non-exempt: the bundled runtime implements its own standard encryption (TLS, AEAD ciphers, WireGuard) for
        # the tunnel, beyond Apple's system encryption (docs/manual-intervention.md, 出口合规).
        ITSAppUsesNonExemptEncryption: true
        # XcodeGen does not add the package type for system extensions; macOS only loads a SYSX bundle.
        CFBundlePackageType: SYSX
        # English is the fallback; Sources/NetworkCoreMacTunnel/InfoPlist.xcstrings has the Chinese.
        NSSystemExtensionUsageDescription: AnixOps Net uses this network extension to set up its VPN tunnel.
        NetworkExtension:
          # Must start with an app group of the extension's entitlements (Entitlements/NetworkCoreMacTunnel.entitlements).
          NEMachServiceName: $(TeamIdentifierPrefix)net.anixops.networkcore.tunnel
          NEProviderClasses:
            com.apple.networkextension.packet-tunnel: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.networkcore.macos.packettunnel
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        PRODUCT_MODULE_NAME: NetworkCoreMacTunnel
        CODE_SIGN_ENTITLEMENTS: Entitlements/NetworkCoreMacTunnel.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: NetworkCoreIOS
        product: NetworkCoreIOS
      - framework: Generated/NetworkCoreRuntime.xcframework
        embed: false
      - sdk: Security.framework

  # `anixops`, the command-line tool of the macOS app (Sources/NetworkCoreCLI, docs/macos-cli.md). It talks to the
  # running app over a socket in the app group container, so it needs only the app group, no Network Extension
  # entitlement and no provisioning profile; it is not sandboxed.
  NetworkCoreCLI:
    type: tool
    platform: macOS
    sources:
      - path: Sources/NetworkCoreCLI
    info:
      path: Generated/NetworkCoreCLI-Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: anixops
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AnixOpsAppGroup: $(TeamIdentifierPrefix)net.anixops.networkcore
    settings:
      base:
        PRODUCT_NAME: anixops
        PRODUCT_MODULE_NAME: NetworkCoreCLI
        PRODUCT_BUNDLE_IDENTIFIER: com.example.networkcore.macos.cli
        # A bare executable has no bundle: Info.plist goes into the binary, where Bundle.main reads it.
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        # Debug builds would otherwise move the code into anixops.debug.dylib, which the copy into the app leaves out.
        ENABLE_DEBUG_DYLIB: NO
        CODE_SIGN_ENTITLEMENTS: Entitlements/NetworkCoreCLI.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: NetworkCoreIOS
        product: NetworkCoreIOS

schemes:
  NetworkCoreApp:
    build:
      targets:
        NetworkCoreApp: all
        NetworkCorePacketTunnel: all
        NetworkCoreWidget: all
    test:
      targets:
        - NetworkCoreAppUITests

  NetworkCoreMac:
    build:
      targets:
        NetworkCoreMac: all
        NetworkCoreMacTunnel: all
        NetworkCoreCLI: all
    test:
      targets:
        - NetworkCoreMacUITests
