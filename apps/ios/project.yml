# XcodeGen spec for the NetworkCore iOS app.
#
# The generated NetworkCore.xcodeproj is produced in GitHub Actions and is never committed.
# This spec is the source of truth for the Xcode project, as the source-tree contract requires.
# Bundle identifiers are placeholders. Real values come from GitHub variables in the upload gate.
name: NetworkCore

options:
  bundleIdPrefix: com.example.networkcore
  # Chinese is the source language; Sources/NetworkCoreApp/Resources/Localizable.xcstrings adds English.
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  NetworkCoreIOS:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  NetworkCoreApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/NetworkCoreApp
      - path: Sources/NetworkCoreAppHost
      - path: Sources/NetworkCoreShared
    info:
      path: Generated/NetworkCoreApp-Info.plist
      properties:
        CFBundleDisplayName: AnixOps Net
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # anixops:// links: connect, disconnect, toggle, mode, select and import (NetworkCoreBridge/AppURLCommand.swift).
        CFBundleURLTypes:
          - CFBundleURLName: net.anixops.net
            CFBundleURLSchemes:
              - anixops
        # Scanning node and subscription QR codes in the import sheet; nothing is recorded or uploaded.
        NSCameraUsageDescription: 扫描节点或订阅二维码时使用相机，画面不会保存或上传。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad takes every orientation, which Split View and Stage Manager require.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # The connection's Live Activity on the Lock Screen and in the Dynamic Island (LiveActivityController).
        NSSupportsLiveActivities: true
        # Subscription groups update in the background (TunnelController.scheduleBackgroundRefresh).
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - net.anixops.subscriptions.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.networkcore.ios
        # Not the XcodeGen `entitlements:` key: without `properties` it rewrites the committed file as an empty plist.
        CODE_SIGN_ENTITLEMENTS: Entitlements/NetworkCoreApp.entitlements
        # iPhone and iPad; on a regular-width iPad window RootView shows a sidebar instead of tabs.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: NetworkCoreIOS
        product: NetworkCoreIOS
      - target: NetworkCorePacketTunnel
        embed: true
      # The TestFlight workflow drops this target when no widget provisioning profile is configured.
      - target: NetworkCoreWidget
        embed: true
      # The Rust runtime (crates/engine-embedded, which includes crates/node-import): the app uses it for
      # subscription import and the HTTP delay test, never to run the tunnel.
      - framework: Generated/NetworkCoreRuntime.xcframework
        embed: false

  NetworkCorePacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/NetworkCorePacketTunnel
    info:
      path: Generated/NetworkCorePacketTunnel-Info.plist
      properties:
        CFBundleDisplayName: AnixOps Net Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.networkcore.ios.packettunnel
        CODE_SIGN_ENTITLEMENTS: Entitlements/NetworkCorePacketTunnel.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: NetworkCoreIOS
        product: NetworkCoreIOS
      # Static Rust runtime (crates/engine-embedded), built in GitHub Actions by
      # .github/scripts/build-ios-runtime-xcframework.sh. Only the extension links it.
      - framework: Generated/NetworkCoreRuntime.xcframework
        embed: false
      - sdk: Security.framework

  # Home Screen / Lock Screen status widget and the iOS 18 Control Center switch. It reads the saved VPN
  # configuration itself (status, node name, protocol), so it carries the same Network Extension entitlement.
  NetworkCoreWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/NetworkCoreWidget
      - path: Sources/NetworkCoreShared
      - path: Sources/NetworkCoreAppHost/BrandPalette.swift
      - path: Sources/NetworkCoreAppHost/BrandTokens.swift
      - path: Sources/NetworkCoreAppHost/RouteLine.swift
      - path: Sources/NetworkCoreApp/Resources/Localizable.xcstrings
    info:
      path: Generated/NetworkCoreWidget-Info.plist
      properties:
        CFBundleDisplayName: AnixOps Net
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.networkcore.ios.widget
        CODE_SIGN_ENTITLEMENTS: Entitlements/NetworkCoreWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: NetworkCoreIOS
        product: NetworkCoreIOS

  # The macOS app: the same tunnel controller, import flow and brand views as iOS, with a sidebar window and a
  # menu bar item. Distributed outside the Mac App Store with a Developer ID signature and notarization, so the
  # Network Extension ships as a System Extension (Contents/Library/SystemExtensions) that the app activates
  # (SystemExtensionActivation) and the user allows in System Settings.
  NetworkCoreMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/NetworkCoreMac
      - path: Sources/NetworkCoreApp
        excludes:
          - "Resources/**"
      - path: Sources/NetworkCoreApp/Resources/Localizable.xcstrings
      - path: Sources/NetworkCoreApp/Resources/PrivacyInfo.xcprivacy
      - path: Sources/NetworkCoreAppHost/BrandPalette.swift
      - path: Sources/NetworkCoreAppHost/BrandTokens.swift
      - path: Sources/NetworkCoreAppHost/ClientHealthMonitor.swift
      - path: Sources/NetworkCoreAppHost/ClientReporter.swift
      - path: Sources/NetworkCoreAppHost/ConnectionsView.swift
      - path: Sources/NetworkCoreAppHost/DashboardCards.swift
      - path: Sources/NetworkCoreAppHost/DashboardModel.swift
      - path: Sources/NetworkCoreAppHost/DnsSettingsView.swift
      - path: Sources/NetworkCoreAppHost/ImportView.swift
      - path: Sources/NetworkCoreAppHost/MitmPluginInspector.swift
      - path: Sources/NetworkCoreAppHost/MitmTrustPresentation.swift
      - path: Sources/NetworkCoreAppHost/PluginsView.swift
      - path: Sources/NetworkCoreAppHost/ProxyModeText.swift
      - path: Sources/NetworkCoreAppHost/RouteLine.swift
      - path: Sources/NetworkCoreAppHost/RuleSetsView.swift
      - path: Sources/NetworkCoreAppHost/RuleTextEditor.swift
      - path: Sources/NetworkCoreAppHost/TunnelController.swift
      - path: Sources/NetworkCoreAppHost/URLCommandHandler.swift
      - path: Sources/NetworkCoreAppHost/NativeNodeImporterFFI.swift
      - path: Sources/NetworkCoreAppHost/NodeDelayFFI.swift
      - path: Sources/NetworkCoreAppHost/NodeEditSheet.swift
      - path: Sources/NetworkCoreAppHost/OnDemandSettingsView.swift
      - path: Sources/NetworkCoreAppHost/SubscriptionGroupViews.swift
      - path: Sources/NetworkCoreAppHost/TrafficStatsView.swift
    info:
      path: Generated/NetworkCoreMac-Info.plist
      properties:
        CFBundleDisplayName: AnixOps Net
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        # anixops:// links, the same six actions as on iOS (NetworkCoreBridge/AppURLCommand.swift).
        CFBundleURLTypes:
          - CFBundleURLName: net.anixops.net
            CFBundleURLSchemes:
              - anixops
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: AnixOps Net
        PRODUCT_MODULE_NAME: NetworkCoreMac
        # The tunnel's bundle ID (com.example.networkcore.macos.packettunnel) starts with this one.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.networkcore.macos
        CODE_SIGN_ENTITLEMENTS: Entitlements/NetworkCoreMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: NetworkCoreIOS
        product: NetworkCoreIOS
      - target: NetworkCoreMacTunnel
        embed: true
      # The macOS slice of the runtime, for subscription import and the HTTP delay test; the tunnel runs in the extension.
      - framework: Generated/NetworkCoreRuntime.xcframework
        embed: false

  # The packet tunnel for macOS: the same provider sources as iOS, linked with the macOS slice of the runtime, run as
  # a System Extension (Sources/NetworkCoreMacTunnel/main.swift). It runs as root and cannot read the user's
  # Keychain, so the app hands the node key, node library and MITM root over at start (TunnelStartSecrets).
  # Its bundle ID must start with the app's, and macOS requires the bundle to be named after its bundle ID.
  NetworkCoreMacTunnel:
    type: system-extension
    platform: macOS
    sources:
      - path: Sources/NetworkCorePacketTunnel
      - path: Sources/NetworkCoreMacTunnel
    info:
      path: Generated/NetworkCoreMacTunnel-Info.plist
      properties:
        CFBundleDisplayName: AnixOps Net Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        ITSAppUsesNonExemptEncryption: false
        # XcodeGen does not add the package type for system extensions; macOS only loads a SYSX bundle.
        CFBundlePackageType: SYSX
        NSSystemExtensionUsageDescription: AnixOps Net 用这个网络扩展建立 VPN 隧道。
        NetworkExtension:
          # Must start with an app group of the extension's entitlements (Entitlements/NetworkCoreMacTunnel.entitlements).
          NEMachServiceName: $(TeamIdentifierPrefix)net.anixops.networkcore.tunnel
          NEProviderClasses:
            com.apple.networkextension.packet-tunnel: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.networkcore.macos.packettunnel
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        PRODUCT_MODULE_NAME: NetworkCoreMacTunnel
        CODE_SIGN_ENTITLEMENTS: Entitlements/NetworkCoreMacTunnel.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: NetworkCoreIOS
        product: NetworkCoreIOS
      - framework: Generated/NetworkCoreRuntime.xcframework
        embed: false
      - sdk: Security.framework

schemes:
  NetworkCoreApp:
    build:
      targets:
        NetworkCoreApp: all
        NetworkCorePacketTunnel: all
        NetworkCoreWidget: all

  NetworkCoreMac:
    build:
      targets:
        NetworkCoreMac: all
        NetworkCoreMacTunnel: all
