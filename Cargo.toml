[workspace]
members = [
    "apps/linux-gui",
    "apps/windows-gui",
    "apps/windows-service",
    "crates/subscription-meta",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/AnixOps/anixops-net"

# The kernel lives in AnixOps/networkcore_anixops and is pinned to one commit here.
# Upgrading the kernel = change every rev below to the new commit (or tag) and refresh Cargo.lock.
# CI also builds the iOS runtime and the Windows CLI from this same checkout (.github/scripts/kernel-root.sh).
# For local kernel work, uncomment the [patch] section at the end and point it at a kernel checkout.
[workspace.dependencies]
config-core = { git = "https://github.com/AnixOps/networkcore_anixops", rev = "1584b4bfa89d0e5ec161fba4afe32e7792f72d8e" }
control-domain = { git = "https://github.com/AnixOps/networkcore_anixops", rev = "1584b4bfa89d0e5ec161fba4afe32e7792f72d8e" }
engine-embedded = { git = "https://github.com/AnixOps/networkcore_anixops", rev = "1584b4bfa89d0e5ec161fba4afe32e7792f72d8e" }
engine-native = { git = "https://github.com/AnixOps/networkcore_anixops", rev = "1584b4bfa89d0e5ec161fba4afe32e7792f72d8e" }
inbound-mixed = { git = "https://github.com/AnixOps/networkcore_anixops", rev = "1584b4bfa89d0e5ec161fba4afe32e7792f72d8e" }
mitm-policy = { git = "https://github.com/AnixOps/networkcore_anixops", rev = "1584b4bfa89d0e5ec161fba4afe32e7792f72d8e" }
platform-windows = { git = "https://github.com/AnixOps/networkcore_anixops", rev = "1584b4bfa89d0e5ec161fba4afe32e7792f72d8e" }

