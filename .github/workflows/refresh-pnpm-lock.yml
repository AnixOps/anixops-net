name: Refresh pnpm Lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Generate pnpm lockfile artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Generate pnpm lockfile
        shell: bash
        run: pnpm --dir apps/windows-gui/ui install --lockfile-only --no-frozen-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pnpm-lock
          path: apps/windows-gui/ui/pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
