[package]
name = "networkcore-linux-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Linux desktop client for AnixOps Net: the shared Tauri + React interface over the embedded engine; also the backend of the Android app."

# The window needs WebKitGTK, which plain workspace builds do not install, so the Tauri layer sits behind the
# `gui` feature. Without it the crate only re-exports the backend (`crates/client-core`),
# which the workspace jobs test; the Linux GUI job builds and lints the window with `--features gui`.
[features]
default = []
# `tauri/custom-protocol` embeds the built interface; without it a release binary loads the dev server URL.
gui = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-deep-link",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-single-instance",
    "tauri/custom-protocol",
]

[dependencies]
app-notifications = { path = "../../crates/app-notifications" }
client-core = { path = "../../crates/client-core" }
client-health = { path = "../../crates/client-health" }
# `tauri::generate_context!` writes the plugin settings in tauri.conf.json (deep-link) as `serde_json` values.
serde_json = "1"
tauri = { version = "2", optional = true }
tauri-plugin-deep-link = { version = "~2.4", optional = true }
tauri-plugin-notification = { version = "~2.3", optional = true }

# The desktop keeps one window per user, so an `anixops://` link reaches the running one.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-single-instance = { version = "2", optional = true, features = ["deep-link"] }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[lib]
path = "src/lib.rs"

[[bin]]
name = "anixops-net"
path = "src/main.rs"
