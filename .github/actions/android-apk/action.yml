name: Android APK
description: >-
  Builds the arm64 Android APK (apps/android-native: the Rust bridge by cargo-ndk, then Gradle) and signs it with
  the given keystore, or with a throwaway debug key when no keystore is given. Shared by ci.yml, which also runs
  lint, the unit tests and the screenshots in the same Gradle call, and release.yml.

inputs:
  keystore-base64:
    description: Base64 of the release keystore (ANDROID_KEYSTORE_BASE64); empty = throwaway debug key
    required: false
    default: ""
  keystore-password:
    required: false
    default: ""
  key-alias:
    required: false
    default: ""
  key-password:
    required: false
    default: ""
  save-cache:
    description: Whether to save the Rust and Gradle caches
    required: false
    default: "false"
  checks:
    description: Gradle tasks to run before the release build in the same call (CI's lint, tests and screenshots)
    required: false
    default: ""

outputs:
  apk:
    description: Absolute path of the signed APK
    value: ${{ steps.sign.outputs.apk }}
  kind:
    description: release (signed with the keystore) or debug (throwaway key)
    value: ${{ steps.sign.outputs.kind }}

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Setup Rust
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
        rustup target add aarch64-linux-android

    - name: Restore Rust build cache
      uses: Swatinem/rust-cache@v2
      with:
        key: android-native
        save-if: ${{ inputs.save-cache }}

    - name: Install cargo-ndk
      shell: bash
      run: cargo install cargo-ndk --version 3.5.4 --locked

    - name: Build the Rust bridge
      shell: bash
      run: |
        set -euo pipefail
        ndk="${ANDROID_NDK_LATEST_HOME}"
        # rquickjs-sys generates its Android bindings with bindgen against the NDK headers (API level = minSdk).
        export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android26 --sysroot=${ndk}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
        export ANDROID_NDK_HOME="${ndk}"
        cargo ndk -t arm64-v8a --platform 26 -o apps/android-native/app/src/main/jniLibs \
          build --release --locked -p anixops-net-android
        ls -l apps/android-native/app/src/main/jniLibs/arm64-v8a

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "8.14.3"
        cache-read-only: ${{ inputs.save-cache != 'true' }}

    - name: Build the APK
      shell: bash
      env:
        CHECKS: ${{ inputs.checks }}
      run: |
        set -euo pipefail
        # Word splitting is wanted: CHECKS is a list of Gradle task names.
        # shellcheck disable=SC2086
        gradle -p apps/android-native --no-daemon ${CHECKS} :app:assembleRelease

    - name: Sign the APK
      id: sign
      uses: ./.github/actions/sign-apk
      with:
        unsigned: ${{ github.workspace }}/apps/android-native/app/build/outputs/apk/release/app-release-unsigned.apk
        name: anixops-net-android-arm64
        keystore-base64: ${{ inputs.keystore-base64 }}
        keystore-password: ${{ inputs.keystore-password }}
        key-alias: ${{ inputs.key-alias }}
        key-password: ${{ inputs.key-password }}
