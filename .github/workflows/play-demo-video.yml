name: Play demo video

# The short demo Google Play asks for with the VPN service and foreground service declarations: the real debug APK on
# an x86_64 emulator, driven by .github/scripts/play-demo-video.sh, with captions burned in. Manual only; the result
# is a workflow artifact that the developer uploads to YouTube or Drive and links in Play Console
# (docs/manual-intervention.md).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    name: Record the Play demo video
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-linux-android

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android-native-x86_64
          save-if: false

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - name: Build the Rust bridge for the emulator
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME}"
          export BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android="--target=x86_64-linux-android26 --sysroot=${ndk}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export ANDROID_NDK_HOME="${ndk}"
          cargo ndk -t x86_64 --platform 26 -o apps/android-native/app/src/main/jniLibs \
            build --release --locked -p anixops-net-android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.14.3"
          cache-read-only: true

      - name: Build the app
        run: gradle -p apps/android-native --no-daemon -Panixops.abis=x86_64 :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/play-demo-video.sh apps/android-native/app/build/outputs/apk/debug/app-debug.apk ${{ runner.temp }}/demo

      - name: Burn in the captions
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          python3 - "${RUNNER_TEMP}/demo" <<'EOF'
          import os, subprocess, sys, textwrap
          d = sys.argv[1]
          rows = [line.rstrip("\n").split("\t", 1) for line in open(os.path.join(d, "captions.tsv")) if line.strip()]
          font = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          # screenrecord writes frames only when the screen changes; a fixed frame rate lets each caption change on time.
          filters = ["fps=30"]
          for i, (start, text) in enumerate(rows):
              end = rows[i + 1][0] if i + 1 < len(rows) else "100000"
              path = os.path.join(d, f"caption-{i}.txt")
              with open(path, "w") as f:
                  f.write("\n".join(textwrap.wrap(text, 30)))
              filters.append(
                  f"drawtext=fontfile={font}:textfile={path}:fontsize=46:line_spacing=14:fontcolor=white:box=1:boxcolor=black@0.72"
                  f":boxborderw=26:x=(w-text_w)/2:y=h*0.30:enable='between(t,{start},{end})'"
              )
          subprocess.run(
              ["ffmpeg", "-y", "-loglevel", "error", "-i", os.path.join(d, "raw.mp4"), "-vf", ",".join(filters),
               "-c:v", "libx264", "-preset", "slow", "-crf", "20", "-pix_fmt", "yuv420p", "-movflags", "+faststart",
               "-t", "89", os.path.join(d, "anixops-net-play-demo.mp4")],
              check=True,
          )
          EOF
          ffprobe -v error -show_entries format=duration -of csv=p=0 "${RUNNER_TEMP}/demo/anixops-net-play-demo.mp4"

      - name: Upload the video
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: play-demo-video-${{ github.sha }}
          path: |
            ${{ runner.temp }}/demo/anixops-net-play-demo.mp4
            ${{ runner.temp }}/demo/raw.mp4
            ${{ runner.temp }}/demo/captions.tsv
            ${{ runner.temp }}/demo/debug
          if-no-files-found: warn
          retention-days: 7
