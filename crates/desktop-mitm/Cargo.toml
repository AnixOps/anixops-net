[package]
name = "desktop-mitm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTPS decryption on the desktop clients: the local root, the imported plugin library and the engine `mitm` section they make."

[dependencies]
engine-embedded = { workspace = true }
rcgen = "0.14.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
