[package]
name = "desktop-dns"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The DNS choices of the desktop clients (presets, the user's own servers and hosts, Fake-IP) and the engine `dns` section each one writes, the `block_quic` switch and the user's own rule lines."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The physical network's DNS servers for the `system` upstream (src/system.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
