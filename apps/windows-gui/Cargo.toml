[package]
name = "networkcore-windows-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Windows GUI client for AnixOps NetworkCore."

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
client-core = { path = "../../crates/client-core" }
client-health = { path = "../../crates/client-health" }
config-core = { workspace = true }
control-domain = { workspace = true }
desktop-dns = { path = "../../crates/desktop-dns" }
desktop-mitm = { path = "../../crates/desktop-mitm" }
engine-embedded = { workspace = true }
inbound-mixed = { workspace = true }
anx-license = { path = "../../crates/anx-license" }
node-edits = { path = "../../crates/node-edits" }
on-demand = { path = "../../crates/on-demand" }
node-import = { workspace = true }
platform-windows = { workspace = true }
rcgen = { version = "0.14.8", features = ["x509-parser"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
network-watch = { path = "../../crates/network-watch" }
subscription-meta = { path = "../../crates/subscription-meta" }
app-log = { path = "../../crates/app-log" }
app-notifications = { path = "../../crates/app-notifications" }
traffic-stats = { path = "../../crates/traffic-stats" }

[target.'cfg(windows)'.dependencies]
windows-data = { path = "../../crates/windows-data" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "~2.4"
tauri-plugin-notification = "~2.3"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Console",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "networkcore-windows-gui"
path = "src/main.rs"
