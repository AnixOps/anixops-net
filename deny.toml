# cargo-deny 配置。CI 的 `rust-deps` job 运行 `cargo deny --locked check advisories licenses sources`。
#
# 许可证政策：与 networkcore_anixops 的 deny.toml 同一份白名单（宽松许可证 + MPL-2.0），
# 拒绝 GPL / AGPL / LGPL-only / SSPL 与 source-available 许可证。

[graph]
all-features = true

[advisories]
version = 2
# RustSec 公告直接让 CI 失败。确实不可达或已缓解的公告，在这里加
# { id = "RUSTSEC-xxxx-xxxx", reason = "..." }，写清楚原因。
# 下面都是"unmaintained"（不再维护）公告，不是漏洞，且都经 Tauri 间接引入、上游没有可升级版本。
# Tauri 换掉这些依赖后删掉对应条目；出现新的 unmaintained 公告仍会让 CI 失败。
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: gtk-rs 0.18 via tauri (Linux GUI), build-time proc macro, no upgrade" },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range: urlpattern via tauri-utils, no upgrade" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common: urlpattern via tauri-utils, no upgrade" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property: urlpattern via tauri-utils, no upgrade" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version: urlpattern via tauri-utils, no upgrade" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident: urlpattern via tauri-utils, no upgrade" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; zbus 5 via tauri-plugin-single-instance, no upgrade" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; zbus 5 via tauri-plugin-single-instance, no upgrade" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; zbus 5 via tauri-plugin-single-instance, no upgrade" },
]

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # 文件级 copyleft：不修改地使用只需署名；修改过的 MPL 文件必须公开。
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# 工作区 crate 不发布到 crates.io。
ignore = true

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# 内核 crate 来自 networkcore_anixops（Apache-2.0），按 Cargo.toml 固定的 rev 引用。
allow-git = ["https://github.com/AnixOps/networkcore_anixops"]
