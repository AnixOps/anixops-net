name: Release

# Packages the Windows (MSI + portable ZIP), Linux (tarball + .deb) and Android (APK) clients.
# A tag push (or release-tag.yml, which dispatches this on the tag it creates) publishes a GitHub Release;
# workflow_dispatch from main only builds and attests.
# iOS ships through ios-testflight.yml. Kernel CLI releases stay in AnixOps/networkcore_anixops.

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/third-party-notices/**
      - .github/scripts/third_party_notices.py
      - Cargo.lock
      - installer/linux/**
      - installer/windows-native/**
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v0.3.0-beta.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  LINUX_TARGET: x86_64-unknown-linux-gnu
  LINUX_RUST_TOOLCHAIN: stable
  LINUX_RUST_PROFILE: minimal
  WINDOWS_TARGET: x86_64-pc-windows-gnu
  WINDOWS_RUST_TOOLCHAIN: stable
  WINDOWS_RUST_PROFILE: minimal
  WINDOWS_WIX_VERSION: 5.0.2

jobs:
  release-policy:
    name: Release policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.policy.outputs.version }}
      is_tag_release: ${{ steps.policy.outputs.is_tag_release }}
      release_kind: ${{ steps.policy.outputs.release_kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Android versionCode check reads build.gradle.kts at the previous release tag.
          fetch-depth: 0
          fetch-tags: true

      # 组网 stays out of every release until kernel 0.3 is complete and audited: nothing a release build reads may
      # open its gate (client-core ANIXOPS_MESH_PREVIEW, Apple MESH_PREVIEW).
      - name: Mesh release gate stays closed
        shell: bash
        run: bash .github/scripts/mesh-release-gate.sh

      - name: Verify release source
        id: policy
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${RELEASE_EVENT}" = "pull_request" ]; then
            source_version="$(python3 -I .github/scripts/version.py check)"
            source_version="${source_version#version }"
            echo "version=v${source_version%%:*}" >> "${GITHUB_OUTPUT}"
            echo "is_tag_release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          version_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[1-9][0-9]*)?$'
          if [[ ! "${RELEASE_VERSION}" =~ ${version_pattern} ]]; then
            echo "::error::Release version must match vMAJOR.MINOR.PATCH, vMAJOR.MINOR.PATCH-alpha.N, vMAJOR.MINOR.PATCH-beta.N, or vMAJOR.MINOR.PATCH-rc.N."
            exit 1
          fi

          release_kind=stable
          if [[ "${RELEASE_VERSION}" =~ -(alpha|beta|rc)\. ]]; then
            release_kind=prerelease
          fi

          if [[ "${RELEASE_VERSION}" =~ -(alpha|beta|rc)\.([1-9][0-9]*)$ ]]; then
            release_channel="${BASH_REMATCH[1]}"
            release_sequence=$((10#${BASH_REMATCH[2]}))
            case "${release_channel}" in
              alpha) max_sequence=499 ;;
              beta) max_sequence=399 ;;
              rc) max_sequence=98 ;;
            esac
            if (( release_sequence < 1 || release_sequence > max_sequence )); then
              echo "::error::${release_channel} release sequence must be between 1 and ${max_sequence} to preserve Windows Installer version ordering."
              exit 1
            fi
          fi

          case "${RELEASE_EVENT}" in
            workflow_dispatch)
              if [ "${RELEASE_REF_TYPE}" = "tag" ]; then
                # release-tag.yml creates the tag with GITHUB_TOKEN, which fires no push event, and then dispatches
                # this workflow on the tag: it publishes exactly like a pushed tag.
                if [ "${RELEASE_VERSION}" != "${RELEASE_REF_NAME}" ]; then
                  echo "::error::A release dispatched on a tag must use the tag name as its version."
                  exit 1
                fi
                echo "is_tag_release=true" >> "${GITHUB_OUTPUT}"
              elif [ "${RELEASE_REF_TYPE}" = "branch" ] && [ "${RELEASE_REF_NAME}" = "main" ]; then
                echo "is_tag_release=false" >> "${GITHUB_OUTPUT}"
              else
                echo "::error::workflow_dispatch release validation must run from main or from a release tag."
                exit 1
              fi
              ;;
            push)
              if [ "${RELEASE_REF_TYPE}" != "tag" ]; then
                echo "::error::push releases must be triggered by a tag ref."
                exit 1
              fi
              if [ "${RELEASE_VERSION}" != "${RELEASE_REF_NAME}" ]; then
                echo "::error::Tag-triggered release version must match the tag name."
                exit 1
              fi
              echo "is_tag_release=true" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "::error::Unsupported release event: ${RELEASE_EVENT}."
              exit 1
              ;;
          esac

          echo "version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release_kind=${release_kind}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Release Policy"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Version | ${RELEASE_VERSION} |"
            echo "| Event | ${RELEASE_EVENT} |"
            echo "| Ref type | ${RELEASE_REF_TYPE} |"
            echo "| Ref name | ${RELEASE_REF_NAME} |"
            echo "| Release kind | ${release_kind} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      # Every artifact takes its version from the source (Cargo.toml's workspace version and its checked copies,
      # .github/scripts/version.py), so the tag must be that version (plus a prerelease suffix): otherwise a v1.0.0
      # release would ship clients that call themselves 0.3.0.
      - name: Tag matches the source version
        shell: bash
        env:
          VERSION: ${{ steps.policy.outputs.version }}
        run: python3 -I .github/scripts/version.py check --tag "${VERSION}"

      # The pinned Android release certificate is checked before anything is built: sign-android refuses a tag
      # release without it, after the 90-minute build. It is public (Play Console → App signing), so it is a
      # repository variable, never a secret (a job output that contains a secret's value is dropped).
      - name: Android release certificate is pinned
        if: ${{ steps.policy.outputs.is_tag_release == 'true' }}
        shell: bash
        env:
          EXPECTED_CERT: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          normalized="$(printf '%s' "${EXPECTED_CERT}" | tr -d ': ' | tr 'A-F' 'a-f')"
          if [[ ! "${normalized}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Repository variable ANDROID_RELEASE_CERT_SHA256 must hold the SHA-256 of the Android app signing certificate (docs/manual-intervention.md, 安卓正式签名密钥)."
            exit 1
          fi

      # Checked before anything is built, so a release never goes out without notes or with an Android versionCode
      # that cannot install over the previous release.
      - name: Release notes and Android versionCode
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          VERSION: ${{ steps.policy.outputs.version }}
        run: |
          set -euo pipefail
          notes="docs/release-notes/${VERSION}.md"
          if [ ! -s "${notes}" ]; then
            echo "::error::${notes} is missing or empty. Write the release notes (Chinese, user-facing) before tagging."
            exit 1
          fi
          if grep -n -E 'TODO|TBD|待补' "${notes}"; then
            echo "::error::${notes} still has placeholders."
            exit 1
          fi

          gradle_file=apps/android-native/app/build.gradle.kts
          code_of() {
            grep -m1 -oE '^[[:space:]]*versionCode = [0-9]+' | grep -oE '[0-9]+$' || true
          }
          current="$(code_of < "${gradle_file}")"
          if [ -z "${current}" ]; then
            echo "::error::No versionCode in ${gradle_file}."
            exit 1
          fi
          # The newest v* tag that is not this version: that release's APK is what users upgrade from.
          previous="$(git tag --list 'v*' --sort=-creatordate | grep -vxF "${VERSION}" | head -n 1 || true)"
          previous_code=""
          if [ -n "${previous}" ]; then
            if git show "${previous}:${gradle_file}" > "${RUNNER_TEMP}/previous-build.gradle.kts" 2>/dev/null; then
              previous_code="$(code_of < "${RUNNER_TEMP}/previous-build.gradle.kts")"
            fi
          fi
          if [ -n "${previous_code}" ] && [ "${current}" -le "${previous_code}" ]; then
            echo "::error::Android versionCode ${current} is not above ${previous_code} in ${previous}; raise it in ${gradle_file}."
            exit 1
          fi
          {
            echo "| Release notes | \`${notes}\` |"
            echo "| Android versionCode | ${current} (previous release ${previous:-none}: ${previous_code:-no native Android app}) |"
          } >> "${GITHUB_STEP_SUMMARY}"

  release-ci-gate:
    name: Release CI gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - release-policy
    permissions:
      contents: read
      actions: read
    outputs:
      ci_workflow_name: ${{ steps.validate.outputs.ci_workflow_name }}
      ci_workflow_file: ${{ steps.validate.outputs.ci_workflow_file }}
      ci_run_id: ${{ steps.validate.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.validate.outputs.ci_run_attempt }}
      ci_run_url: ${{ steps.validate.outputs.ci_run_url }}
      ci_run_status: ${{ steps.validate.outputs.ci_run_status }}
      ci_run_conclusion: ${{ steps.validate.outputs.ci_run_conclusion }}
      ci_head_sha: ${{ steps.validate.outputs.ci_head_sha }}
      ci_head_branch: ${{ steps.validate.outputs.ci_head_branch }}
      ci_event: ${{ steps.validate.outputs.ci_event }}
      ci_repository: ${{ steps.validate.outputs.ci_repository }}
      ci_checked_at: ${{ steps.validate.outputs.ci_checked_at }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate same-commit CI success
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs_json="$(gh api --method GET "repos/${RELEASE_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f status=completed \
            -f head_sha="${RELEASE_SHA}" \
            -f per_page=20)"
          run_total="$(jq -r '.total_count // 0' <<< "${runs_json}")"
          run_count="$(jq -r '.workflow_runs | length' <<< "${runs_json}")"
          if [ "${run_total}" -gt "${run_count}" ]; then
            echo "::error::CI workflow runs query returned paginated results."
            exit 1
          fi

          ci_run_json="$(jq -c --arg sha "${RELEASE_SHA}" --arg repo "${RELEASE_REPOSITORY}" '
            [
              .workflow_runs[]
              | select(.name == "CI")
              | select(.path == ".github/workflows/ci.yml")
              | select(.head_branch == "main")
              | select(.head_sha == $sha)
              | select(.status == "completed")
              | select(.conclusion == "success")
              | select(.event == "push" or .event == "workflow_dispatch")
              | select(.repository.full_name == $repo)
            ]
            | sort_by(.created_at, .run_attempt)
            | last // empty
          ' <<< "${runs_json}")"
          if [ -z "${ci_run_json}" ]; then
            echo "::error::No successful completed CI run on main was found for ${RELEASE_REPOSITORY}@${RELEASE_SHA}."
            exit 1
          fi

          ci_run_id="$(jq -r '.id' <<< "${ci_run_json}")"
          ci_run_attempt="$(jq -r '.run_attempt' <<< "${ci_run_json}")"
          ci_run_url="$(jq -r '.html_url' <<< "${ci_run_json}")"
          ci_run_status="$(jq -r '.status' <<< "${ci_run_json}")"
          ci_run_conclusion="$(jq -r '.conclusion' <<< "${ci_run_json}")"
          ci_head_sha="$(jq -r '.head_sha' <<< "${ci_run_json}")"
          ci_head_branch="$(jq -r '.head_branch' <<< "${ci_run_json}")"
          ci_event="$(jq -r '.event' <<< "${ci_run_json}")"
          ci_repository="$(jq -r '.repository.full_name' <<< "${ci_run_json}")"

          jobs_json="$(gh api --method GET "repos/${RELEASE_REPOSITORY}/actions/runs/${ci_run_id}/jobs" \
            -f filter=latest \
            -f per_page=100)"
          job_total="$(jq -r '.total_count // 0' <<< "${jobs_json}")"
          job_count="$(jq -r '.jobs | length' <<< "${jobs_json}")"
          if [ "${job_total}" -gt "${job_count}" ]; then
            echo "::error::CI workflow jobs query returned paginated results."
            exit 1
          fi
          if ! jq -e '[.jobs[] | select(.name == "CI summary") | select(.status == "completed") | select(.conclusion == "success")] | length > 0' <<< "${jobs_json}" >/dev/null; then
            echo "::error::Selected CI run does not contain a successful CI summary job."
            exit 1
          fi
          # A documentation-only push to main skips every build job (ci.yml, "Classify changed paths") and its
          # summary still passes. A release needs a run in which every job ran and passed: run CI manually first.
          not_run="$(jq -r '[.jobs[] | select(.conclusion != "success") | "\(.name)=\(.conclusion)"] | join(", ")' <<< "${jobs_json}")"
          if [ -n "${not_run}" ]; then
            echo "::error::Selected CI run did not run and pass every job (${not_run}). Run the CI workflow manually on ${RELEASE_SHA} and release again."
            exit 1
          fi

          ci_checked_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          {
            echo "ci_workflow_name=CI"
            echo "ci_workflow_file=.github/workflows/ci.yml"
            echo "ci_run_id=${ci_run_id}"
            echo "ci_run_attempt=${ci_run_attempt}"
            echo "ci_run_url=${ci_run_url}"
            echo "ci_run_status=${ci_run_status}"
            echo "ci_run_conclusion=${ci_run_conclusion}"
            echo "ci_head_sha=${ci_head_sha}"
            echo "ci_head_branch=${ci_head_branch}"
            echo "ci_event=${ci_event}"
            echo "ci_repository=${ci_repository}"
            echo "ci_checked_at=${ci_checked_at}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### Release CI Gate"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| CI run | ${ci_run_id} |"
            echo "| CI URL | ${ci_run_url} |"
            echo "| CI branch | ${ci_head_branch} |"
            echo "| CI commit | ${ci_head_sha} |"
            echo "| CI conclusion | ${ci_run_conclusion} |"
            echo "| CI summary job | success |"
          } >> "${GITHUB_STEP_SUMMARY}"


  # THIRD_PARTY_NOTICES.txt for every artifact, from the package managers' metadata (.github/actions/
  # third-party-notices). Each package job ships the file for its platform and checks it is inside the package.
  third-party-notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - release-policy
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write the notices
        uses: ./.github/actions/third-party-notices
        with:
          output-dir: ${{ runner.temp }}/notices

      - name: Upload the notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-notices-${{ needs.release-policy.outputs.version }}
          path: ${{ runner.temp }}/notices/*/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 14

  package-linux-gui:
    name: Package Linux desktop client
    if: ${{ !cancelled() && needs.release-policy.result == 'success' && needs.third-party-notices.result == 'success' && (github.event_name == 'pull_request' || needs.release-ci-gate.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - release-policy
      - release-ci-gate
      - third-party-notices
    permissions:
      contents: read
    outputs:
      bundle_name: ${{ steps.package.outputs.bundle_name }}
      archive_name: ${{ steps.package.outputs.archive_name }}
      archive_checksum_value: ${{ steps.package.outputs.archive_checksum_value }}
      archive_manifest_name: ${{ steps.package.outputs.archive_manifest_name }}
      deb_name: ${{ steps.package.outputs.deb_name }}
      deb_checksum_value: ${{ steps.package.outputs.deb_checksum_value }}
      deb_manifest_name: ${{ steps.package.outputs.deb_manifest_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native desktop dependencies
        shell: bash
        run: bash .github/scripts/apt-install.sh libgtk-4-dev libadwaita-1-dev

      - name: Download the third-party notices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-notices-${{ needs.release-policy.outputs.version }}
          path: ${{ runner.temp }}/notices

      - name: Build and package the Linux desktop client
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.release-policy.outputs.version }}
          TARGET: ${{ env.LINUX_TARGET }}
          RUST_TOOLCHAIN: ${{ env.LINUX_RUST_TOOLCHAIN }}
          RUST_PROFILE: ${{ env.LINUX_RUST_PROFILE }}
          CI_RUN_URL: ${{ needs.release-ci-gate.outputs.ci_run_url }}
          RELEASE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          NOTICES: ${{ runner.temp }}/notices/desktop/THIRD_PARTY_NOTICES.txt
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [ "${checkout_sha}" != "${RELEASE_SHA}" ]; then
            echo "::error::Checkout SHA ${checkout_sha} does not match release SHA ${RELEASE_SHA}."
            exit 1
          fi
          test -s "${NOTICES}"

          rustup toolchain install "${RUST_TOOLCHAIN}" --profile "${RUST_PROFILE}"
          rustup default "${RUST_TOOLCHAIN}"
          rustup target add "${TARGET}" --toolchain "${RUST_TOOLCHAIN}"
          test -f Cargo.lock
          cargo build --locked --release --target "${TARGET}" -p anixops-net-native --features gui
          cargo build --locked --release --target "${TARGET}" -p anixops-netd -p client-mcp
          release_bin="target/${TARGET}/release"
          unit=apps/linux-daemon/packaging/anixops-netd.service

          version="${VERSION}"
          stem="anixops-net-linux-${version}-${TARGET}"
          dist_dir="dist/linux-gui"
          output_dir="${dist_dir}/artifacts"
          rm -rf "${dist_dir}"
          mkdir -p "${output_dir}"

          desktop_entry() {
            cat <<EOF
          [Desktop Entry]
          Type=Application
          Name=AnixOps Net
          Comment=Proxy client with subscriptions, node switching and delay tests
          Exec=$1
          Icon=anixops-net
          Terminal=false
          Categories=Network;
          EOF
          }

          # Tarball: run in place from a versioned directory.
          staging="${dist_dir}/staging/${stem}"
          mkdir -p "${staging}/bin" "${staging}/share/applications" "${staging}/share/icons/hicolor/256x256/apps"
          install -m 0755 "${release_bin}/anixops-net-preview" "${staging}/bin/anixops-net"
          install -m 0755 "${release_bin}/anixops-netd" "${release_bin}/anixops-mcp" "${staging}/bin/"
          install -Dm0644 "${unit}" "${staging}/lib/systemd/system/anixops-netd.service"
          install -m 0644 apps/linux-native/data/anixops-net.png "${staging}/share/icons/hicolor/256x256/apps/anixops-net.png"
          desktop_entry anixops-net > "${staging}/share/applications/anixops-net.desktop"
          install -m 0644 LICENSE "${staging}/LICENSE"
          install -m 0644 "${NOTICES}" "${staging}/THIRD_PARTY_NOTICES.txt"
          install -m 0644 installer/linux/INSTALL.md "${staging}/INSTALL.md"
          archive_name="${stem}.tar.gz"
          tar -czf "${output_dir}/${archive_name}" -C "${dist_dir}/staging" "${stem}"

          # Debian package: system install with a menu entry.
          # Debian sorts "~" before release, so 0.2.0~rc.1 < 0.2.0.
          deb_version="$(printf '%s' "${version#v}" | tr '-' '~')"
          deb_root="${dist_dir}/deb"
          mkdir -p "${deb_root}/DEBIAN" "${deb_root}/usr/bin" "${deb_root}/usr/share/applications" \
            "${deb_root}/usr/share/icons/hicolor/256x256/apps" "${deb_root}/usr/share/doc/anixops-net"
          install -m 0755 "${release_bin}/anixops-net-preview" "${deb_root}/usr/bin/anixops-net"
          install -m 0755 "${release_bin}/anixops-netd" "${release_bin}/anixops-mcp" "${deb_root}/usr/bin/"
          install -Dm0644 "${unit}" "${deb_root}/usr/lib/systemd/system/anixops-netd.service"
          install -m 0644 apps/linux-native/data/anixops-net.png "${deb_root}/usr/share/icons/hicolor/256x256/apps/anixops-net.png"
          desktop_entry /usr/bin/anixops-net > "${deb_root}/usr/share/applications/anixops-net.desktop"
          # Debian copyright file (DEP-5): the client's own license, and where the third-party notices are.
          install -m 0644 "${NOTICES}" "${deb_root}/usr/share/doc/anixops-net/THIRD_PARTY_NOTICES.txt"
          {
            echo "Format: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/"
            echo "Upstream-Name: AnixOps Net"
            echo "Upstream-Contact: contact@anixops.com"
            echo "Source: https://github.com/AnixOps/anixops-net"
            echo
            echo "Files: *"
            echo "Copyright: AnixOps"
            echo "License: Apache-2.0"
            echo "Comment: The binary also contains third-party software under its own licenses (MIT, BSD, ISC,"
            echo " Apache-2.0, MPL-2.0 and others). Their copyright notices and license texts, and where the source"
            echo " of the MPL-2.0 components is, are in /usr/share/doc/anixops-net/THIRD_PARTY_NOTICES.txt."
            echo
            echo "License: Apache-2.0"
            sed -e 's/^[[:space:]]*$/./' -e 's/^/ /' LICENSE
          } > "${deb_root}/usr/share/doc/anixops-net/copyright"
          chmod 0644 "${deb_root}/usr/share/doc/anixops-net/copyright"
          for script in postinst prerm postrm; do
            install -m 0755 "installer/linux/${script}" "${deb_root}/DEBIAN/${script}"
          done
          installed_size="$(du -sk "${deb_root}/usr" | cut -f1)"
          cat > "${deb_root}/DEBIAN/control" <<EOF
          Package: anixops-net
          Version: ${deb_version}
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libgtk-4-1 (>= 4.14), libadwaita-1-0 (>= 1.5), init-system-helpers (>= 1.54)
          Recommends: systemd
          Installed-Size: ${installed_size}
          Maintainer: AnixOps <noreply@github.com>
          Homepage: https://github.com/AnixOps/anixops-net
          Description: AnixOps Net desktop proxy client
           Imports subscriptions and share links, switches nodes, runs delay tests and
           points the desktop proxy setting at a local SOCKS5/HTTP port while connected,
           or captures all traffic through a TUN adapter managed by its system service.
          EOF
          deb_name="anixops-net_${deb_version}_amd64.deb"
          dpkg-deb --root-owner-group --build "${deb_root}" "${output_dir}/${deb_name}"
          dpkg-deb --info "${output_dir}/${deb_name}" >/dev/null
          dpkg-deb --extract "${output_dir}/${deb_name}" "${dist_dir}/deb-inspection"
          tar -xzf "${output_dir}/${archive_name}" -C "${dist_dir}"
          for binary in anixops-net anixops-netd anixops-mcp; do
            test -x "${dist_dir}/deb-inspection/usr/bin/${binary}"
            test -x "${dist_dir}/${stem}/bin/${binary}"
          done
          cmp "${unit}" "${dist_dir}/deb-inspection/usr/lib/systemd/system/anixops-netd.service"
          cmp "${unit}" "${dist_dir}/${stem}/lib/systemd/system/anixops-netd.service"
          # Both packages carry the license notices.
          for notice in ./usr/share/doc/anixops-net/copyright ./usr/share/doc/anixops-net/THIRD_PARTY_NOTICES.txt; do
            if ! dpkg-deb -c "${output_dir}/${deb_name}" | awk '{ print $NF }' | grep -qxF "${notice}"; then
              echo "::error::${deb_name} lacks ${notice}"
              exit 1
            fi
          done
          for notice in LICENSE THIRD_PARTY_NOTICES.txt; do
            if ! tar -tzf "${output_dir}/${archive_name}" | grep -qxF "${stem}/${notice}"; then
              echo "::error::${archive_name} lacks ${stem}/${notice}"
              exit 1
            fi
          done

          manifest() {
            local file="$1" kind="$2" format="$3" checksum="$4"
            jq -n \
              --arg artifact_name "${file}" --arg artifact_kind "${kind}" --arg package_format "${format}" \
              --arg target_triple "${TARGET}" --arg version "${version}" --arg commit_sha "${RELEASE_SHA}" \
              --arg source_ref "${SOURCE_REF}" --arg ci_run_url "${CI_RUN_URL}" \
              --arg release_run_url "${RELEASE_RUN_URL}" --arg rust_toolchain "${RUST_TOOLCHAIN}" \
              --arg checksum_value "${checksum}" \
              '{
                schema_version: 1,
                artifact_kind: $artifact_kind,
                package_format: $package_format,
                artifact_name: $artifact_name,
                target_triple: $target_triple,
                version: $version,
                commit_sha: $commit_sha,
                source_ref: $source_ref,
                ci_run_url: $ci_run_url,
                release_run_url: $release_run_url,
                runner: "ubuntu-latest",
                rust_toolchain: $rust_toolchain,
                source: "apps/linux-native+apps/linux-daemon+crates/client-mcp",
                checksum: {algorithm: "sha256", file_name: ($artifact_name + ".sha256"), value: $checksum_value},
                runtime_dependencies: ["GTK >= 4.14", "libadwaita >= 1.5", "systemd"],
                system_mutation_policy: "systemd-core-and-user-session-proxy",
                signing: {
                  signing_policy: "unsigned-no-detached-signature",
                  attestation_policy: "github-artifact-attestation-required",
                  provenance_file: "github-artifact-attestation"
                },
                rollback: {
                  rollback_scope: "linux-desktop-client",
                  rollback_steps: "withdraw-release-asset-and-publish-replacement-version",
                  replacement_version: "next-version-required",
                  rollback_owner: "maintainer"
                }
              }'
          }

          (
            cd "${output_dir}"
            sha256sum "${archive_name}" > "${archive_name}.sha256"
            sha256sum "${deb_name}" > "${deb_name}.sha256"
          )
          archive_checksum_value="$(cut -d' ' -f1 "${output_dir}/${archive_name}.sha256")"
          deb_checksum_value="$(cut -d' ' -f1 "${output_dir}/${deb_name}.sha256")"
          archive_manifest_name="${stem}.manifest.json"
          deb_manifest_name="anixops-net_${deb_version}_amd64.manifest.json"
          manifest "${archive_name}" linux-desktop-tarball tar.gz "${archive_checksum_value}" > "${output_dir}/${archive_manifest_name}"
          manifest "${deb_name}" linux-desktop-deb deb "${deb_checksum_value}" > "${output_dir}/${deb_manifest_name}"
          (
            cd "${output_dir}"
            sha256sum "${archive_manifest_name}" > "${archive_manifest_name}.sha256"
            sha256sum "${deb_manifest_name}" > "${deb_manifest_name}.sha256"
            sha256sum -c ./*.sha256
          )
          file_count="$(find "${output_dir}" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "${file_count}" != "8" ]; then
            echo "::error::Linux desktop output must hold the tarball and deb four-file sets."
            find "${output_dir}" -maxdepth 1 -type f -print
            exit 1
          fi

          {
            echo "bundle_name=${stem}-release-bundle"
            echo "output_dir=${output_dir}"
            echo "archive_name=${archive_name}"
            echo "archive_checksum_value=${archive_checksum_value}"
            echo "archive_manifest_name=${archive_manifest_name}"
            echo "deb_name=${deb_name}"
            echo "deb_checksum_value=${deb_checksum_value}"
            echo "deb_manifest_name=${deb_manifest_name}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### Linux Desktop Client"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Tarball | ${archive_name} |"
            echo "| Tarball sha256 | ${archive_checksum_value} |"
            echo "| Debian package | ${deb_name} |"
            echo "| Debian package sha256 | ${deb_checksum_value} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Linux desktop release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.bundle_name }}
          path: ${{ steps.package.outputs.output_dir }}/*
          retention-days: 14
          if-no-files-found: error

  package-windows:
    name: Package Windows managed client
    if: ${{ !cancelled() && needs.release-policy.result == 'success' && needs.third-party-notices.result == 'success' && (github.event_name == 'pull_request' || needs.release-ci-gate.result == 'success') }}
    runs-on: windows-latest
    timeout-minutes: 45
    needs:
      - release-policy
      - release-ci-gate
      - third-party-notices
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      artifact_path: ${{ steps.package.outputs.artifact_path }}
      checksum_algorithm: ${{ steps.package.outputs.checksum_algorithm }}
      checksum_file: ${{ steps.package.outputs.checksum_file }}
      checksum_value: ${{ steps.package.outputs.checksum_value }}
      artifact_manifest_name: ${{ steps.package.outputs.artifact_manifest_name }}
      artifact_manifest_path: ${{ steps.package.outputs.artifact_manifest_path }}
      artifact_manifest_checksum_file: ${{ steps.package.outputs.artifact_manifest_checksum_file }}
      artifact_manifest_checksum_value: ${{ steps.package.outputs.artifact_manifest_checksum_value }}
      portable_artifact_name: ${{ steps.package.outputs.portable_artifact_name }}
      portable_artifact_path: ${{ steps.package.outputs.portable_artifact_path }}
      portable_checksum_file: ${{ steps.package.outputs.portable_checksum_file }}
      portable_checksum_value: ${{ steps.package.outputs.portable_checksum_value }}
      portable_manifest_name: ${{ steps.package.outputs.portable_manifest_name }}
      portable_manifest_path: ${{ steps.package.outputs.portable_manifest_path }}
      portable_manifest_checksum_file: ${{ steps.package.outputs.portable_manifest_checksum_file }}
      portable_manifest_checksum_value: ${{ steps.package.outputs.portable_manifest_checksum_value }}
      bundle_name: ${{ steps.package.outputs.bundle_name }}
      output_dir: ${{ steps.package.outputs.output_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the third-party notices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-notices-${{ needs.release-policy.outputs.version }}
          path: ${{ runner.temp }}/notices

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Setup Windows C toolchain
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libsystre

      - name: Configure Windows Rust GNU target
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $MsysRoot = "${{ steps.msys2.outputs.msys2-location }}"
          $MingwPrefix = Join-Path $MsysRoot "mingw64"
          "${{ github.workspace }}\.github\scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$MingwPrefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "MSYS2_LOCATION=$MsysRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MINGW_PREFIX=$MingwPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RC_x86_64_pc_windows_gnu=${{ github.workspace }}\.github\scripts\rc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_BUILD_TARGET=${{ env.WINDOWS_TARGET }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_x86_64_pc_windows_gnu=$MingwPrefix\bin\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AR_x86_64_pc_windows_gnu=$MingwPrefix\bin\ar.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$MingwPrefix\bin\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned WiX toolset
        shell: pwsh
        env:
          WIX_VERSION: ${{ env.WINDOWS_WIX_VERSION }}
        run: |
          $ErrorActionPreference = "Stop"
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add -g "WixToolset.Util.wixext/$env:WIX_VERSION"
          wix --version

      - name: Build, validate, checksum, and manifest Windows managed client
        id: package
        shell: pwsh
        env:
          VERSION: ${{ needs.release-policy.outputs.version }}
          TARGET: ${{ env.WINDOWS_TARGET }}
          RUST_TOOLCHAIN: ${{ env.WINDOWS_RUST_TOOLCHAIN }}
          RUST_PROFILE: ${{ env.WINDOWS_RUST_PROFILE }}
          WIX_VERSION: ${{ env.WINDOWS_WIX_VERSION }}
          CI_RUN_URL: ${{ needs.release-ci-gate.outputs.ci_run_url }}
          RELEASE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          NOTICES: ${{ runner.temp }}/notices/desktop/THIRD_PARTY_NOTICES.txt
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path $env:NOTICES -PathType Leaf) -or (Get-Item $env:NOTICES).Length -le 0) {
            throw "The third-party notices are missing: $env:NOTICES"
          }
          $noticesPath = (Resolve-Path $env:NOTICES).Path
          $licensePath = (Resolve-Path LICENSE).Path
          $checkoutSha = (git rev-parse HEAD).Trim()
          if ($checkoutSha -ne $env:RELEASE_SHA) {
            throw "Checkout SHA $checkoutSha does not match release SHA $env:RELEASE_SHA."
          }

          rustup toolchain install $env:RUST_TOOLCHAIN --profile $env:RUST_PROFILE
          rustup default $env:RUST_TOOLCHAIN
          rustup target add $env:TARGET --toolchain $env:RUST_TOOLCHAIN
          rustc .github/scripts/windres_compat.rs -o .github/scripts/windres.exe
          rustc .github/scripts/rc_compat.rs -o .github/scripts/rc.exe

          if (-not (Test-Path -Path Cargo.lock -PathType Leaf)) {
            throw "Cargo.lock must be checked in before creating release artifacts."
          }
          $version = $env:VERSION
          $target = $env:TARGET
          if ($version -notmatch '^v([0-9]+)\.([0-9]+)\.([0-9]+)(?:-(alpha|beta|rc)\.([1-9][0-9]*))?$') {
            throw "Windows MSI version source is invalid: $version"
          }
          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $patch = [int]$Matches[3]
          $channel = $Matches[4]
          $sequence = if ($Matches[5]) { [int]$Matches[5] } else { 0 }
          if ($channel) {
            $maxSequence = switch ($channel) {
              "alpha" { 499 }
              "beta" { 399 }
              "rc" { 98 }
            }
            if ($sequence -lt 1 -or $sequence -gt $maxSequence) {
              throw "$channel release sequence must be between 1 and $maxSequence to preserve Windows Installer version ordering."
            }
          }
          $msiBuild = $patch * 1000
          if ($channel -eq "alpha") {
            $msiBuild += $sequence
          } elseif ($channel -eq "beta") {
            $msiBuild += 500 + $sequence
          } elseif ($channel -eq "rc") {
            $msiBuild += 900 + $sequence
          } else {
            $msiBuild += 999
          }
          if ($major -gt 255 -or $minor -gt 255 -or $msiBuild -gt 65535) {
            throw "Mapped MSI product version exceeds Windows Installer limits."
          }
          $productVersion = "$major.$minor.$msiBuild"
          $appDir = Join-Path $env:RUNNER_TEMP "native-app"
          dotnet publish apps/windows-native/src/AnixOps.Net.App/AnixOps.Net.App.csproj `
            --configuration Release --runtime win-x64 --self-contained true --output $appDir `
            "-p:Version=$major.$minor.$patch" "-p:FileVersion=$major.$minor.$patch.$msiBuild"
          if ($LASTEXITCODE -ne 0) { throw "Windows native app publish failed." }
          $guiPath = Join-Path $appDir "AnixOpsNet.exe"
          cargo build --locked --release --target $env:TARGET -p anixops-net-service -p client-mcp
          if ($LASTEXITCODE -ne 0) { throw "Windows service or MCP build failed." }
          $releaseDir = (Resolve-Path "target/$env:TARGET/release").Path
          $servicePath = Join-Path $releaseDir "anixops-net-service.exe"
          $mcpPath = Join-Path $releaseDir "anixops-mcp.exe"
          foreach ($binaryPath in @($guiPath, $servicePath, $mcpPath)) {
            if (-not (Test-Path $binaryPath -PathType Leaf)) { throw "Missing $binaryPath" }
          }
          Copy-Item $licensePath (Join-Path $appDir "LICENSE.txt")
          Copy-Item $noticesPath (Join-Path $appDir "THIRD_PARTY_NOTICES.txt")

          $artifactStem = "networkcore-windows-$version-$target"
          $distDir = "dist\windows\$target"
          $outputDir = Join-Path $distDir "artifacts"
          $archiveName = "$artifactStem.msi"
          $archivePath = Join-Path $outputDir $archiveName
          $archiveChecksumName = "$archiveName.sha256"
          $archiveChecksumPath = Join-Path $outputDir $archiveChecksumName
          $manifestName = "$artifactStem.manifest.json"
          $manifestPath = Join-Path $outputDir $manifestName
          $manifestChecksumName = "$manifestName.sha256"
          $manifestChecksumPath = Join-Path $outputDir $manifestChecksumName
          $portableStem = "networkcore-windows-portable-$version-$target"
          $portableArchiveName = "$portableStem.zip"
          $portableArchivePath = Join-Path $outputDir $portableArchiveName
          $portableChecksumName = "$portableArchiveName.sha256"
          $portableChecksumPath = Join-Path $outputDir $portableChecksumName
          $portableManifestName = "$portableStem.manifest.json"
          $portableManifestPath = Join-Path $outputDir $portableManifestName
          $portableManifestChecksumName = "$portableManifestName.sha256"
          $portableManifestChecksumPath = Join-Path $outputDir $portableManifestChecksumName
          $portableStageDir = Join-Path $distDir "portable\$portableStem"
          $bundleName = "$artifactStem-release-bundle"

          Remove-Item -Recurse -Force $distDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $wintunPath = & .github/scripts/fetch-wintun.ps1 -Destination (Join-Path $env:RUNNER_TEMP "wintun")
          $wintunLicensePath = Join-Path (Split-Path $wintunPath) "wintun-LICENSE.txt"
          wix build installer/windows-native/Package.wxs `
            -ext WixToolset.Util.wixext `
            -arch x64 `
            -d "ProductVersion=$productVersion" `
            -d "AppDir=$appDir" `
            -d "ServiceExe=$servicePath" `
            -d "McpExe=$mcpPath" `
            -d "WintunDir=$(Split-Path $wintunPath)" `
            -o $archivePath
          if ($LASTEXITCODE -ne 0) { throw "Windows MSI build failed." }
          wix msi validate -sice ICE03 $archivePath
          if ($LASTEXITCODE -ne 0) { throw "$archivePath did not validate." }
          & .github/scripts/check-windows-icons.ps1 -Msi $archivePath -Exe @($guiPath)
          # The MSI carries the license notices: an administrative image lists the files it installs.
          $msiImage = Join-Path $env:RUNNER_TEMP "msi-image"
          Remove-Item -Recurse -Force $msiImage -ErrorAction SilentlyContinue
          $adminInstall = Start-Process -FilePath msiexec.exe -Wait -PassThru `
            -ArgumentList @("/a", "`"$archivePath`"", "/qn", "TARGETDIR=`"$msiImage`"")
          if ($adminInstall.ExitCode -ne 0) { throw "Administrative image of the MSI failed ($($adminInstall.ExitCode))." }
          foreach ($notice in @("LICENSE.txt", "THIRD_PARTY_NOTICES.txt", "wintun-LICENSE.txt")) {
            $found = @(Get-ChildItem -Path $msiImage -Recurse -Filter $notice | Where-Object { $_.Length -gt 0 })
            if ($found.Count -ne 1) { throw "The MSI does not install $notice." }
          }
          Remove-Item -Recurse -Force $msiImage
          # WiX emits a .wixpdb beside the MSI; it is a build symbol, not a release asset.
          $wixPdbPath = [System.IO.Path]::ChangeExtension($archivePath, ".wixpdb")
          Remove-Item -Force $wixPdbPath -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path $portableStageDir | Out-Null
          Copy-Item (Join-Path $appDir "*") $portableStageDir -Recurse
          Get-ChildItem $portableStageDir -Recurse -File -Filter *.pdb | Remove-Item
          Copy-Item @($servicePath, $mcpPath, $wintunPath, $wintunLicensePath) $portableStageDir
          Copy-Item installer/windows-native/PORTABLE-README.txt (Join-Path $portableStageDir "README.txt")
          Compress-Archive -Path $portableStageDir -DestinationPath $portableArchivePath -CompressionLevel Optimal
          $portableInspectionDir = Join-Path $distDir "portable-inspection"
          Expand-Archive -Path $portableArchivePath -DestinationPath $portableInspectionDir
          foreach ($binary in @("AnixOpsNet.exe", "anixops-net-service.exe", "anixops-mcp.exe", "wintun.dll")) {
            if (-not (Test-Path (Join-Path $portableInspectionDir "$portableStem/$binary") -PathType Leaf)) {
              throw "Portable ZIP does not contain $binary."
            }
          }
          foreach ($notice in @("LICENSE.txt", "THIRD_PARTY_NOTICES.txt", "wintun-LICENSE.txt")) {
            $noticeFile = Join-Path $portableInspectionDir "$portableStem\$notice"
            if (-not (Test-Path $noticeFile -PathType Leaf) -or (Get-Item $noticeFile).Length -le 0) {
              throw "Portable ZIP does not contain $notice."
            }
          }

          $checksumValue = (Get-FileHash -Algorithm SHA256 -Path $archivePath).Hash.ToLowerInvariant()
          if ($checksumValue -notmatch '^[0-9a-f]{64}$') {
            throw "MSI checksum is not a sha256 digest."
          }
          "$checksumValue  $archiveName" | Set-Content -Path $archiveChecksumPath -Encoding ascii
          $archiveSize = (Get-Item $archivePath).Length
          $manifest = [ordered]@{
            schema_version = 3
            artifact_kind = "windows-managed-client-msi"
            package_format = "msi"
            artifact_name = $archiveName
            target_triple = $target
            version = $version
            commit_sha = $env:RELEASE_SHA
            source_ref = $env:SOURCE_REF
            ci_run_url = $env:CI_RUN_URL
            release_run_url = $env:RELEASE_RUN_URL
            runner = "windows-latest"
            rust_toolchain = $env:RUST_TOOLCHAIN
            wix_version = $env:WIX_VERSION
            product_version = $productVersion
            installer = [ordered]@{
              file_name = $archiveName
              relative_path = "dist/windows/$target/artifacts/$archiveName"
              size_bytes = $archiveSize
            }
            checksum = [ordered]@{
              algorithm = "sha256"
              file_name = $archiveChecksumName
              value = $checksumValue
            }
            included_files = @(
              [ordered]@{ path = "AnixOpsNet.exe"; kind = "binary"; required = $true; source = "apps/windows-native" },
              [ordered]@{ path = "anixops-net-service.exe"; kind = "binary"; required = $true; source = "apps/windows-service" },
              [ordered]@{ path = "anixops-mcp.exe"; kind = "binary"; required = $true; source = "crates/client-mcp" },
              [ordered]@{ path = "wintun.dll"; kind = "runtime"; required = $true; source = "wintun.net/builds/wintun-0.14.1.zip:bin/amd64" },
              [ordered]@{ path = "wintun-LICENSE.txt"; kind = "documentation"; required = $true; source = "wintun.net/builds/wintun-0.14.1.zip:LICENSE.txt" },
              [ordered]@{ path = "LICENSE.txt"; kind = "documentation"; required = $true; source = "LICENSE" },
              [ordered]@{ path = "THIRD_PARTY_NOTICES.txt"; kind = "documentation"; required = $true; source = ".github/actions/third-party-notices" }
            )
            install_model = "wix-per-machine-msi"
            system_mutation_policy = "windows-service-and-user-session"
            source_identity = "apps/windows-native+apps/windows-service+crates/client-mcp+installer/windows-native"
            signing = [ordered]@{
              signing_policy = "unsigned-no-authenticode-with-github-attestation"
              signing_status = "not-signed-by-policy"
              attestation_policy = "github-artifact-attestation-required"
              attestation_status = "required-before-publish"
              provenance_policy = "github-build-provenance-required"
              provenance_file = "github-artifact-attestation"
            }
            rollback = [ordered]@{
              rollback_policy = "msi-uninstall-purge-and-version-reinstall"
              rollback_status = "summarized-before-publish"
              rollback_scope = "windows-managed-client"
              rollback_trigger = "checksum-install-runtime-security-or-provenance-defect"
              rollback_steps = "withdraw-release-asset-and-publish-replacement-version"
              replacement_version = "next-version-required"
              rollback_owner = "maintainer"
            }
          }
          $manifest | ConvertTo-Json -Depth 20 | Set-Content -Path $manifestPath -Encoding utf8
          $manifestChecksumValue = (Get-FileHash -Algorithm SHA256 -Path $manifestPath).Hash.ToLowerInvariant()
          "$manifestChecksumValue  $manifestName" | Set-Content -Path $manifestChecksumPath -Encoding ascii

          $portableChecksumValue = (Get-FileHash -Algorithm SHA256 -Path $portableArchivePath).Hash.ToLowerInvariant()
          if ($portableChecksumValue -notmatch '^[0-9a-f]{64}$') {
            throw "Portable ZIP checksum is not a sha256 digest."
          }
          "$portableChecksumValue  $portableArchiveName" | Set-Content -Path $portableChecksumPath -Encoding ascii
          $portableArchiveSize = (Get-Item $portableArchivePath).Length
          $portableManifest = [ordered]@{
            schema_version = 3
            artifact_kind = "windows-managed-client-portable-zip"
            package_format = "zip"
            artifact_name = $portableArchiveName
            target_triple = $target
            version = $version
            commit_sha = $env:RELEASE_SHA
            source_ref = $env:SOURCE_REF
            ci_run_url = $env:CI_RUN_URL
            release_run_url = $env:RELEASE_RUN_URL
            runner = "windows-latest"
            rust_toolchain = $env:RUST_TOOLCHAIN
            archive = [ordered]@{
              file_name = $portableArchiveName
              relative_path = "dist/windows/$target/artifacts/$portableArchiveName"
              size_bytes = $portableArchiveSize
            }
            checksum = [ordered]@{
              algorithm = "sha256"
              file_name = $portableChecksumName
              value = $portableChecksumValue
            }
            included_files = @(
              [ordered]@{ path = "$portableStem/AnixOpsNet.exe"; kind = "binary"; required = $true; source = "apps/windows-native" },
              [ordered]@{ path = "$portableStem/anixops-net-service.exe"; kind = "binary"; required = $true; source = "apps/windows-service" },
              [ordered]@{ path = "$portableStem/anixops-mcp.exe"; kind = "binary"; required = $true; source = "crates/client-mcp" },
              [ordered]@{ path = "$portableStem/wintun.dll"; kind = "runtime"; required = $true; source = "wintun.net/builds/wintun-0.14.1.zip:bin/amd64" },
              [ordered]@{ path = "$portableStem/wintun-LICENSE.txt"; kind = "documentation"; required = $true; source = "wintun.net/builds/wintun-0.14.1.zip:LICENSE.txt" },
              [ordered]@{ path = "$portableStem/LICENSE.txt"; kind = "documentation"; required = $true; source = "LICENSE" },
              [ordered]@{ path = "$portableStem/THIRD_PARTY_NOTICES.txt"; kind = "documentation"; required = $true; source = ".github/actions/third-party-notices" },
              [ordered]@{ path = "$portableStem/README.txt"; kind = "documentation"; required = $true; source = "installer/windows-native/PORTABLE-README.txt" }
            )
            install_model = "manual-extract"
            system_mutation_policy = "foreground-core-and-user-session"
            source_identity = "apps/windows-native+apps/windows-service+crates/client-mcp+installer/windows-native"
            signing = [ordered]@{
              signing_policy = "unsigned-no-authenticode-with-github-attestation"
              signing_status = "not-signed-by-policy"
              attestation_policy = "github-artifact-attestation-required"
              attestation_status = "required-before-publish"
              provenance_policy = "github-build-provenance-required"
              provenance_file = "github-artifact-attestation"
            }
            rollback = [ordered]@{
              rollback_policy = "purge-delete-extracted-directory"
              rollback_status = "summarized-before-publish"
              rollback_scope = "windows-managed-client-portable"
              rollback_trigger = "checksum-runtime-security-or-provenance-defect"
              rollback_steps = "purge-uninstall-delete-and-publish-replacement-version"
              replacement_version = "next-version-required"
              rollback_owner = "maintainer"
            }
          }
          $portableManifest | ConvertTo-Json -Depth 20 | Set-Content -Path $portableManifestPath -Encoding utf8
          $portableManifestChecksumValue = (Get-FileHash -Algorithm SHA256 -Path $portableManifestPath).Hash.ToLowerInvariant()
          "$portableManifestChecksumValue  $portableManifestName" | Set-Content -Path $portableManifestChecksumPath -Encoding ascii

          foreach ($file in @(
            $archivePath,
            $archiveChecksumPath,
            $manifestPath,
            $manifestChecksumPath,
            $portableArchivePath,
            $portableChecksumPath,
            $portableManifestPath,
            $portableManifestChecksumPath
          )) {
            if (-not (Test-Path -Path $file -PathType Leaf)) {
              throw "Missing Windows artifact output file: $file"
            }
            if ((Get-Item $file).Length -le 0) {
              throw "Empty Windows artifact output file: $file"
            }
          }
          $fileCount = @(Get-ChildItem -Path $outputDir -File).Count
          if ($fileCount -ne 8) {
            $fileNames = @(Get-ChildItem -Path $outputDir -File | Select-Object -ExpandProperty Name) -join ", "
            throw "Windows artifact output dir must contain exactly eight files. Found: $fileNames"
          }

          @(
            "artifact_name=$archiveName",
            "artifact_path=$archivePath",
            "checksum_algorithm=sha256",
            "checksum_file=$archiveChecksumPath",
            "checksum_value=$checksumValue",
            "artifact_manifest_name=$manifestName",
            "artifact_manifest_path=$manifestPath",
            "artifact_manifest_checksum_file=$manifestChecksumPath",
            "artifact_manifest_checksum_value=$manifestChecksumValue",
            "portable_artifact_name=$portableArchiveName",
            "portable_artifact_path=$portableArchivePath",
            "portable_checksum_file=$portableChecksumPath",
            "portable_checksum_value=$portableChecksumValue",
            "portable_manifest_name=$portableManifestName",
            "portable_manifest_path=$portableManifestPath",
            "portable_manifest_checksum_file=$portableManifestChecksumPath",
            "portable_manifest_checksum_value=$portableManifestChecksumValue",
            "bundle_name=$bundleName",
            "output_dir=$outputDir"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          @(
            "### Windows Managed Client MSI",
            "",
            "| Item | Value |",
            "| --- | --- |",
            "| Installer | $archiveName |",
            "| Installer sha256 | $checksumValue |",
            "| Manifest | $manifestName |",
            "| Manifest sha256 | $manifestChecksumValue |",
            "| Target | $target |",
            "| Source identity | WinUI + core service + MCP + WiX |",
            "| Install model | wix-per-machine-msi |",
            "| System mutation policy | windows-service-and-user-session |",
            "",
            "### Windows Portable ZIP",
            "",
            "| Item | Value |",
            "| --- | --- |",
            "| Archive | $portableArchiveName |",
            "| Archive sha256 | $portableChecksumValue |",
            "| Manifest | $portableManifestName |",
            "| Manifest sha256 | $portableManifestChecksumValue |",
            "| Install model | manual-extract |",
            "| System mutation policy | foreground-core-and-user-session |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload Windows release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.bundle_name }}
          path: |
            ${{ steps.package.outputs.artifact_path }}
            ${{ steps.package.outputs.checksum_file }}
            ${{ steps.package.outputs.artifact_manifest_path }}
            ${{ steps.package.outputs.artifact_manifest_checksum_file }}
            ${{ steps.package.outputs.portable_artifact_path }}
            ${{ steps.package.outputs.portable_checksum_file }}
            ${{ steps.package.outputs.portable_manifest_path }}
            ${{ steps.package.outputs.portable_manifest_checksum_file }}
          retention-days: 14
          if-no-files-found: error

  attest-linux-gui:
    if: github.event_name != 'pull_request'
    name: Attest Linux desktop client bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - release-policy
      - package-linux-gui
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      attestation_status: ${{ steps.attestation-output.outputs.attestation_status }}
    steps:
      - name: Download Linux desktop release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package-linux-gui.outputs.bundle_name }}
          path: dist/linux-gui-attestation

      - name: Validate attestation subjects
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist/linux-gui-attestation -maxdepth 1 -type f | wc -l | tr -d ' ')" = "8"
          (
            cd dist/linux-gui-attestation
            sha256sum -c ./*.sha256
          )

      - name: Generate Linux desktop artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/linux-gui-attestation/*

      - name: Emit attestation status
        id: attestation-output
        shell: bash
        run: echo "attestation_status=attested" >> "${GITHUB_OUTPUT}"

  attest-windows:
    if: github.event_name != 'pull_request'
    name: Attest Windows managed client bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - release-policy
      - package-windows
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      attestation_status: ${{ steps.attestation-output.outputs.attestation_status }}
      provenance_file: ${{ steps.attestation-output.outputs.provenance_file }}
    steps:
      - name: Download Windows release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package-windows.outputs.bundle_name }}
          path: dist/windows-attestation

      - name: Validate Windows attestation subjects
        shell: bash
        env:
          ARCHIVE_NAME: ${{ needs.package-windows.outputs.artifact_name }}
          ARCHIVE_CHECKSUM_NAME: ${{ needs.package-windows.outputs.artifact_name }}.sha256
          MANIFEST_NAME: ${{ needs.package-windows.outputs.artifact_manifest_name }}
          MANIFEST_CHECKSUM_NAME: ${{ needs.package-windows.outputs.artifact_manifest_name }}.sha256
          PORTABLE_ARCHIVE_NAME: ${{ needs.package-windows.outputs.portable_artifact_name }}
          PORTABLE_ARCHIVE_CHECKSUM_NAME: ${{ needs.package-windows.outputs.portable_artifact_name }}.sha256
          PORTABLE_MANIFEST_NAME: ${{ needs.package-windows.outputs.portable_manifest_name }}
          PORTABLE_MANIFEST_CHECKSUM_NAME: ${{ needs.package-windows.outputs.portable_manifest_name }}.sha256
        run: |
          set -euo pipefail
          for file in \
            "${ARCHIVE_NAME}" \
            "${ARCHIVE_CHECKSUM_NAME}" \
            "${MANIFEST_NAME}" \
            "${MANIFEST_CHECKSUM_NAME}" \
            "${PORTABLE_ARCHIVE_NAME}" \
            "${PORTABLE_ARCHIVE_CHECKSUM_NAME}" \
            "${PORTABLE_MANIFEST_NAME}" \
            "${PORTABLE_MANIFEST_CHECKSUM_NAME}"; do
            test -f "dist/windows-attestation/${file}"
            test -s "dist/windows-attestation/${file}"
          done
          test "$(find dist/windows-attestation -maxdepth 1 -type f | wc -l | tr -d ' ')" = "8"
          (
            cd dist/windows-attestation
            sha256sum -c "${ARCHIVE_CHECKSUM_NAME}"
            sha256sum -c "${MANIFEST_CHECKSUM_NAME}"
            sha256sum -c "${PORTABLE_ARCHIVE_CHECKSUM_NAME}"
            sha256sum -c "${PORTABLE_MANIFEST_CHECKSUM_NAME}"
          )

      - name: Generate Windows artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/windows-attestation/${{ needs.package-windows.outputs.artifact_name }}
            dist/windows-attestation/${{ needs.package-windows.outputs.artifact_name }}.sha256
            dist/windows-attestation/${{ needs.package-windows.outputs.artifact_manifest_name }}
            dist/windows-attestation/${{ needs.package-windows.outputs.artifact_manifest_name }}.sha256
            dist/windows-attestation/${{ needs.package-windows.outputs.portable_artifact_name }}
            dist/windows-attestation/${{ needs.package-windows.outputs.portable_artifact_name }}.sha256
            dist/windows-attestation/${{ needs.package-windows.outputs.portable_manifest_name }}
            dist/windows-attestation/${{ needs.package-windows.outputs.portable_manifest_name }}.sha256

      - name: Emit Windows attestation status
        id: attestation-output
        shell: bash
        run: |
          set -euo pipefail
          echo "attestation_status=attested" >> "${GITHUB_OUTPUT}"
          echo "provenance_file=github-artifact-attestation" >> "${GITHUB_OUTPUT}"
          echo "windows-package-artifact-attestation-execution-status=attested"

  # Android APK (arm64), built by the same composite action as ci.yml, in two jobs so that the release signing key
  # never shares a job with Gradle, the Rust build or a third-party action:
  # - package-android builds the APK without any secret and hands it over unsigned, with its SHA-256;
  # - sign-android enters the android-release environment (only on a tag release: required reviewer, v* tags only,
  #   the only place the ANDROID_KEYSTORE_* secrets live), checks the APK against that SHA-256 and signs it with
  #   the plain-shell sign-apk action. A tag release fails instead of falling back to a throwaway key, and the
  #   signing certificate must be the one pinned in the ANDROID_RELEASE_CERT_SHA256 variable.
  # A run from main (build check only) does not enter the environment and signs with a throwaway key.
  # docs/manual-intervention.md, 安卓正式签名密钥.
  package-android:
    if: github.event_name != 'pull_request'
    name: Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - release-policy
      - third-party-notices
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
    outputs:
      unsigned_sha256: ${{ steps.stage.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Android versionName
        id: version-name
        shell: bash
        env:
          VERSION: ${{ needs.release-policy.outputs.version }}
        run: echo "name=${VERSION#v}" >> "${GITHUB_OUTPUT}"

      - name: Download the third-party notices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-notices-${{ needs.release-policy.outputs.version }}
          path: ${{ runner.temp }}/notices

      - name: Build the unsigned APK
        id: apk
        uses: ./.github/actions/android-apk
        with:
          sign: "false"
          version-name: ${{ steps.version-name.outputs.name }}
          notices-file: ${{ runner.temp }}/notices/android/THIRD_PARTY_NOTICES.txt

      - name: Stage the unsigned APK
        id: stage
        shell: bash
        env:
          APK: ${{ steps.apk.outputs.apk }}
          KIND: ${{ steps.apk.outputs.kind }}
        run: |
          set -euo pipefail
          test "${KIND}" = unsigned
          # The user agreement, the privacy policy and the third-party notices are inside the APK.
          for asset in assets/TERMS.md assets/PRIVACY.md assets/THIRD_PARTY_NOTICES.txt; do
            if ! unzip -Z1 "${APK}" | grep -qxF "${asset}"; then
              echo "::error::The APK lacks ${asset}"
              exit 1
            fi
          done
          mkdir -p dist/android-unsigned
          cp "${APK}" dist/android-unsigned/app-release-unsigned.apk
          sha="$(sha256sum dist/android-unsigned/app-release-unsigned.apk | cut -d' ' -f1)"
          echo "sha256=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Upload the unsigned APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned-${{ needs.release-policy.outputs.version }}
          path: dist/android-unsigned/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign-android:
    name: Sign Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - release-policy
      - package-android
    # Only a tag release enters the environment: its deployment rule allows v* tags only, so a run from main would be
    # rejected there, and it has nothing to sign for users anyway.
    environment: ${{ needs.release-policy.outputs.is_tag_release == 'true' && 'android-release' || '' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      # No artifact or APK name here: GitHub drops a job output that contains a secret's value, and the key alias
      # secret ("anixops") is part of every name. Publish GitHub Release derives both names from the version.
      signing_kind: ${{ steps.apk.outputs.kind }}
    steps:
      # Only first-party actions pinned to a commit and the repository's own shell (sign-apk), from the tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails closed: a tag release never falls back to a throwaway key (users could not install it over the
      # previous version, and later releases could not be installed over it). Names only, never values.
      - name: The release signing key is configured
        if: ${{ needs.release-policy.outputs.is_tag_release == 'true' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not set in the android-release environment"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Download the unsigned APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned-${{ needs.release-policy.outputs.version }}
          path: ${{ runner.temp }}/android-unsigned

      - name: The APK is the one the build job made
        shell: bash
        env:
          EXPECTED: ${{ needs.package-android.outputs.unsigned_sha256 }}
        run: |
          set -euo pipefail
          apk="${RUNNER_TEMP}/android-unsigned/app-release-unsigned.apk"
          actual="$(sha256sum "${apk}" | cut -d' ' -f1)"
          if [[ ! "${EXPECTED}" =~ ^[0-9a-f]{64}$ ]] || [ "${actual}" != "${EXPECTED}" ]; then
            echo "::error::Unsigned APK SHA-256 ${actual} does not match the build job's '${EXPECTED}'"
            exit 1
          fi

      - name: Sign the APK
        id: apk
        uses: ./.github/actions/sign-apk
        with:
          unsigned: ${{ runner.temp }}/android-unsigned/app-release-unsigned.apk
          name: anixops-net-android-arm64
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # The pinned certificate (public: Play Console → App signing → App signing key certificate) catches a secret
      # replaced by another keystore, such as the Play upload key.
      - name: Signed with the release key
        if: ${{ needs.release-policy.outputs.is_tag_release == 'true' }}
        shell: bash
        env:
          APK: ${{ steps.apk.outputs.apk }}
          KIND: ${{ steps.apk.outputs.kind }}
          EXPECTED_CERT: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          bash .github/scripts/android-signing-gate.sh "${KIND}" "${EXPECTED_CERT}" "${APK}"

      - name: Stage the APK
        id: stage
        shell: bash
        env:
          VERSION: ${{ needs.release-policy.outputs.version }}
          APK: ${{ steps.apk.outputs.apk }}
        run: |
          set -euo pipefail
          name="anixops-net-${VERSION}-android-arm64.apk"
          mkdir -p dist/android
          cp "${APK}" "dist/android/${name}"
          (cd dist/android && sha256sum -- "${name}" > "${name}.sha256")
          echo "apk_name=${name}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=anixops-net-android-${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Generate Android artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/android/${{ steps.stage.outputs.apk_name }}

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: dist/android/*
          if-no-files-found: error
          retention-days: 3

  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - release-policy
      - release-ci-gate
      - package-linux-gui
      - package-windows
      - attest-linux-gui
      - attest-windows
      - sign-android
    if: ${{ needs.release-policy.outputs.is_tag_release == 'true' && github.ref_type == 'tag' }}
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux desktop release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package-linux-gui.outputs.bundle_name }}
          path: dist/release

      - name: Download Windows release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package-windows.outputs.bundle_name }}
          path: dist/release

      - name: Download Android APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anixops-net-android-${{ needs.release-policy.outputs.version }}
          path: dist/android

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release-policy.outputs.version }}
          RELEASE_KIND: ${{ needs.release-policy.outputs.release_kind }}
          CI_RUN_URL: ${{ needs.release-ci-gate.outputs.ci_run_url }}
          LINUX_GUI_ATTESTATION_STATUS: ${{ needs.attest-linux-gui.outputs.attestation_status }}
          WINDOWS_ATTESTATION_STATUS: ${{ needs.attest-windows.outputs.attestation_status }}
          WINDOWS_MSI: ${{ needs.package-windows.outputs.artifact_name }}
          WINDOWS_ZIP: ${{ needs.package-windows.outputs.portable_artifact_name }}
          LINUX_TARBALL: ${{ needs.package-linux-gui.outputs.archive_name }}
          LINUX_DEB: ${{ needs.package-linux-gui.outputs.deb_name }}
          ANDROID_APK: anixops-net-${{ needs.release-policy.outputs.version }}-android-arm64.apk
          ANDROID_SIGNING: ${{ needs.sign-android.outputs.signing_kind }}
          KERNEL_REV_SOURCE: Cargo.toml
        run: |
          set -euo pipefail
          test "${LINUX_GUI_ATTESTATION_STATUS}" = "attested"
          test "${WINDOWS_ATTESTATION_STATUS}" = "attested"
          # A published release only ships an APK signed with the release key (sign-android already failed
          # otherwise); empty when GitHub dropped the output (see sign-android).
          if [ "${ANDROID_SIGNING}" != "release" ]; then
            echo "::error::Android APK is not signed with the release key (kind '${ANDROID_SIGNING}')."
            exit 1
          fi
          test "$(find dist/release -maxdepth 1 -type f | wc -l | tr -d ' ')" = "16"
          (
            cd dist/release
            sha256sum -c ./*.sha256
          )
          (
            cd dist/android
            sha256sum -c ./*.sha256
          )
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "::error::Release ${VERSION} already exists. Asset overwrite is forbidden."
            exit 1
          fi

          # Publish only what users download: five packages under one name scheme plus one
          # SHA256SUMS. Manifests and per-file .sha256 stay in the workflow artifacts; the
          # attestations are bound to the file digests, so renaming keeps them verifiable.
          publish_dir=dist/publish
          mkdir -p "${publish_dir}"
          cp "dist/release/${WINDOWS_MSI}" "${publish_dir}/anixops-net-${VERSION}-windows-x64.msi"
          cp "dist/release/${WINDOWS_ZIP}" "${publish_dir}/anixops-net-${VERSION}-windows-x64-portable.zip"
          cp "dist/release/${LINUX_DEB}" "${publish_dir}/anixops-net-${VERSION}-linux-amd64.deb"
          cp "dist/release/${LINUX_TARBALL}" "${publish_dir}/anixops-net-${VERSION}-linux-x64.tar.gz"
          cp "dist/android/${ANDROID_APK}" "${publish_dir}/${ANDROID_APK}"
          (
            cd "${publish_dir}"
            sha256sum -- anixops-net-* > SHA256SUMS
            cat SHA256SUMS
          )
          assets=()
          while IFS= read -r file; do
            assets+=("${file}")
          done < <(find "${publish_dir}" -maxdepth 1 -type f | sort)
          test "${#assets[@]}" = "6"

          android_note="安卓 8.0 及以上（arm64），下载后直接安装。"
          kernel_rev="$(grep -m1 -oE 'rev = "[0-9a-f]{40}"' "${KERNEL_REV_SOURCE}" | cut -d'"' -f2)"
          # The notes (checked in release-policy) go first; their own top-level heading is dropped because the
          # release title already names the version.
          sed '1{/^# /d}' "docs/release-notes/${VERSION}.md" > release-body.md
          cat >> release-body.md <<EOF

          ## 下载

          | 平台 | 文件 | 说明 |
          | --- | --- | --- |
          | Windows 10/11 | \`anixops-net-${VERSION}-windows-x64.msi\` | 安装版（推荐） |
          | Windows 10/11 | \`anixops-net-${VERSION}-windows-x64-portable.zip\` | 便携版，解压后按 README 启动核心与界面 |
          | Debian / Ubuntu | \`anixops-net-${VERSION}-linux-amd64.deb\` | \`sudo apt install ./<文件名>\` |
          | 其他 Linux | \`anixops-net-${VERSION}-linux-x64.tar.gz\` | 解压后按 INSTALL.md 配置服务，再运行 \`bin/anixops-net\` |
          | 安卓 | \`${ANDROID_APK}\` | ${android_note} |

          这是开源版，只含公开协议。需要 ANX 协议的用户请在服务商面板里下载 ANX 版（iOS 只有 ANX 版，通过 TestFlight 分发）。
          所有平台的最新版下载链接汇总在 [下载页](https://anixops.github.io/anixops-net/)。

          - Linux 版需要 GTK 4.14、libadwaita 1.5 与 systemd（例如 Ubuntu 24.04 或 Debian 13）。
          - 校验：\`sha256sum -c SHA256SUMS\`（Windows 用 \`Get-FileHash <文件> -Algorithm SHA256\` 与 SHA256SUMS 比对）；来源证明：\`gh attestation verify <文件> --repo ${GH_REPO}\`。
          - Windows 安装包未做 Authenticode 代码签名，安装前应先完成上述两项校验。两项均通过后，如出现 SmartScreen 提示，可选择「更多信息 → 仍要运行」。镜像、转发或企业重新分发时，应在分发前完成同样的校验。

          <sub>内核 [networkcore_anixops@${kernel_rev:0:7}](https://github.com/AnixOps/networkcore_anixops/commit/${kernel_rev}) · [CI](${CI_RUN_URL})</sub>
          EOF
          prerelease_args=()
          if [ "${RELEASE_KIND}" = "prerelease" ]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "${VERSION}" "${assets[@]}" \
            --title "AnixOps Net ${VERSION}" \
            --notes-file release-body.md \
            --verify-tag \
            "${prerelease_args[@]}"
          echo "Published $(gh release view "${VERSION}" --json url -q '.url')"
          # A release created with GITHUB_TOKEN triggers no workflow, so refresh the download page explicitly.
          gh workflow run download-page.yml --ref main || echo "::warning::Could not refresh the download page; run download-page.yml by hand."
