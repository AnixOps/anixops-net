[package]
name = "desktop-mitm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTPS decryption on the desktop clients: the local root, the imported plugin library and the engine `mitm` section they make."

[dependencies]
engine-embedded = { workspace = true }
base64 = "0.22"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rcgen = { version = "0.14.8", features = ["x509-parser"] }
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x509-parser = "0.18.1"

[target.'cfg(unix)'.dependencies]
# geteuid for the ownership check of the folder opened bodies go to (capture::ensure_private_dir).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-data = { path = "../windows-data" }
