# The Android app: the Linux client's Tauri window and backend (apps/linux-gui, `gui` feature) on Android, with
# the VpnService plugin (vpn-plugin) carrying traffic through the engine's TUN interface.
#
# A workspace of its own: the plugin and the Tauri mobile build would pull the window toolkit into the root
# workspace's plain `cargo clippy --workspace` jobs. Cargo.lock here starts from the root lockfile so both
# resolve the kernel and Tauri to the same versions. Built only by the CI `android` job (tauri android build).
[workspace]
members = [".", "vpn-plugin"]
resolver = "2"

[package]
name = "networkcore-android"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/AnixOps/anixops-net"
description = "AnixOps Net for Android: the shared Tauri + React interface over the embedded engine behind VpnService."
publish = false

[lib]
# Tauri loads the app as lib<name>.so.
name = "anixops_net"
crate-type = ["cdylib", "rlib"]

[dependencies]
networkcore-linux-gui = { path = "../linux-gui", features = ["gui"] }
tauri = { version = "2", features = [] }
tauri-plugin-anixops-vpn = { path = "vpn-plugin" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
