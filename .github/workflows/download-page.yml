name: Download page

# Publishes the fixed download page of the open-source client to GitHub Pages
# (https://anixops.github.io/anixops-net/): every platform of the newest stable release (the newest beta only
# while no stable release exists), plus fixed links such as /windows/ that redirect to its files and a
# latest.json. A beta newer than the stable release gets its own section, beta/<key>/ links and latest-beta.json;
# it never replaces the stable release. The ANX edition is never listed here; the page sends its users to the
# panel. Built by .github/scripts/download_page.py (tests: download_page_test.py).
#
# release.yml dispatches this after it publishes a release (a release made with GITHUB_TOKEN triggers no
# workflow). Pull requests only build the page; deploying needs Settings → Pages → Source = GitHub Actions
# (docs/manual-intervention.md).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/scripts/download_page.py
      - .github/scripts/download_page_test.py
      - .github/workflows/download-page.yml
  pull_request:
    paths:
      - .github/scripts/download_page.py
      - .github/scripts/download_page_test.py
      - .github/workflows/download-page.yml

permissions:
  contents: read

concurrency:
  group: download-page-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build download page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the page from the newest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 -I .github/scripts/download_page_test.py
          # Every page of releases (newest first): with a fixed window, a run of betas after a stable release
          # would push the stable release out and the page would fall back to a beta.
          gh api --paginate "repos/${GH_REPO}/releases?per_page=100" --jq '.[]' | jq -s '.' > "${RUNNER_TEMP}/releases.json"
          python3 -I .github/scripts/download_page.py "${RUNNER_TEMP}/releases.json" site "${GH_REPO}"
          test -s site/index.html
          test -s site/windows/index.html
          python3 -I - "${RUNNER_TEMP}/releases.json" <<'PY'
          import json, sys
          releases = json.load(open(sys.argv[1]))
          latest = json.load(open("site/latest.json"))
          assert latest["version"].startswith("v"), latest
          # Once a stable release is published, latest.json must never point to a prerelease.
          if any(not r.get("draft") and not r.get("prerelease") for r in releases):
              assert latest["prerelease"] is False and latest["channel"] == "stable", latest
          print(latest["version"], latest["channel"], sorted(latest["assets"]))
          PY
          find site -type f | sort

      - name: Upload the page
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
